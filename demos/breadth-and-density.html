<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadth and Density</title>
<!-- BREADTH AND DENSITY: EVERY OCTAVE IS A SWEEP. Tom, 4 October: each octave has a front and a back, split
     by its corner, so each octave is itself a 0 to π/2 sweep; "recursive within an octave and additive
     outside"; "the recursion is the density … the infinite breadth is outer octaves and the infinite
     density is the inner recursive octaves."

     THE OCTAVE AS A SWEEP. An octave round its corner c runs from ½c to 2c (one octave, two facings,
     R167). Its own reading must be 0 at ½c (its home), 1 at c (its corner) and ∞ at 2c (its horizon).
     Three points fix one Möbius map, the cross ratio against the octave's three marks; with s = v/c,
         r = 2(s − ½) / (2 − s),      g = (2/π)·atan r.
     Nothing is chosen. And it is fair to the facings unasked: s ↦ 1/s sends r ↦ 1/r, so g ↦ 1 − g
     (Proposition 3.2(b)'s condition), and each octave's corner sits at its own g = ½.

     BREADTH, ADDITIVE. Octaves are numbered n, corners 4ⁿ apart, and the place on the whole line is n + g:
     continuous (the top of octave n is the bottom of octave n + 1), every octave the same width, without
     end both ways. Across octaves a count, related by difference: Proposition 3.4(a), the logarithm.

     DENSITY, RECURSIVE. r is itself a reading on [0, ∞), so it has a corner and octaves of its own, which
     crowd toward the octave's edges; each of those is a sweep again, and so on. A value's address is then
     (n; j₁, j₂, …): which octave, then which octave within it, at each depth. The edges of an octave are
     horizons of the sweep inside it (R165).

     THE SHARE AND g, SIDE BY SIDE (§3.5). Laid by the share (proportional, as §3.3 has it) and laid by g
     (the sweep) the octave agrees at its edges and its corner and nowhere else; the two strips show both.

     Hands: drag either panel to move the reading · depth: the buttons, or 0–4 · ← → step the reading. -->
<style>
  :root{--bg:#0b0d12;--panel:#12151c;--line:#2b2e36;--gold:#e8c86a;--teal:#1D9E75;--blue:#6aa8e8;--ink:#c9c7be;--hi:#f1efe6;--dim:#8a909b;
        --mono:"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font:13px var(--mono)}
  #app{height:100%;display:flex;flex-direction:column}
  canvas{display:block;flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair}
  .bar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
  button{font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .lab{color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Top: the octaves side by side, each a sweep. Bottom: the reader's octave as one sweep, its recursion opened to the chosen depth."></canvas>
  <div class="bar" role="group" aria-label="Depth of the recursion">
    <span class="lab">depth</span>
    <button type="button" data-d="0">0</button><button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button><button type="button" data-d="4">4</button>
  </div>
</div>
<script>
const PI = Math.PI, GOLD = '#e8c86a', TEAL = '#1D9E75', BLUE = '#6aa8e8', INK = '#c9c7be', HI = '#f1efe6', DIM = '#8a909b', BG = '#0b0d12';
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const LEVEL = ['#e8c86a', '#1D9E75', '#6aa8e8', '#b48cff', '#e0876a'];   // depth 0 … 4

// ── THE OCTAVE AS A SWEEP ────────────────────────────────────────────────────────────────────────────
const octaveOf = x => Math.floor((Math.log2(x) + 1) / 2);                // the octave n whose ½c … 2c holds x, c = 4ⁿ
const rOf = s => 2 * (s - 0.5) / (2 - s);                                // s = x/c on [½, 2) → r on [0, ∞): home, corner, horizon
const sOf = r => (2 * r + 1) / (r + 2);                                  // and back
const gOfR = r => (2 / PI) * Math.atan(r);
const rOfG = g => Math.tan(clamp(g, 0, 1) * PI / 2);
// a value's place on the whole line, n + g: additive across octaves
function place(x){ const n = octaveOf(x), c = 4 ** n; return n + gOfR(rOf(x / c)); }
function valueAt(p){ const n = Math.floor(p), g = p - n; return 4 ** n * sOf(rOfG(g)); }
// the address: (n; j₁, j₂, …) and the g at each depth
function address(x, depth){
  const n = octaveOf(x); let r = rOf(x / 4 ** n); const digits = [], gs = [gOfR(r)];
  for (let d = 0; d < depth; d++) { if (!(r > 0) || !isFinite(r)) break; const j = octaveOf(r); digits.push(j); r = rOf(r / 4 ** j); gs.push(gOfR(r)); }
  return { n, digits, gs };
}
// the recursion's marks inside one octave, as values of r (the octave's own reading): every sub-octave's
// edges and corner, to the given depth, kept only where they are at least `gap` apart in g
function marks(depth, J){
  // kids(d): the marks d levels deep inside one octave, in that octave's own reading r. Level 1 is the
  // octave's sub-octaves (their edges and corners); level k + 1 is level k inside each sub-octave.
  const kids = d => {
    if (d === 0) return [];
    const inner = kids(d - 1), out = [];
    for (let j = -J; j <= J; j++) {
      out.push({ r: 4 ** j, d: 1 }, { r: 2 * 4 ** j, d: 1 });          // sub-octave j's corner, and its edge with j + 1
      for (const q of inner) out.push({ r: 4 ** j * sOf(q.r), d: q.d + 1 });
    }
    return out;
  };
  return [{ r: 1, d: 0 }].concat(kids(depth).filter(m => Math.abs(m.r - 1) > 1e-12));   // the octave's own corner is depth 0
}

// ── STATE ────────────────────────────────────────────────────────────────────────────────────────────
let x = 1.37, depth = 2, last = '', force = true;
const btns = [...document.querySelectorAll('[data-d]')];
const setDepth = d => { depth = d; btns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.d === d))); force = true; };
btns.forEach(b => b.onclick = () => setDepth(+b.dataset.d));
setDepth(2);

// ── DRAWING ──────────────────────────────────────────────────────────────────────────────────────────
const cv = document.getElementById('cv'), vis = cv.getContext('2d'), back = document.createElement('canvas'), ctx = back.getContext('2d');
let W = 0, H = 0, D = 0, L = null, markCache = { depth: -1, list: [] };
function layout(){
  const narrow = W < 700, topH = narrow ? 150 : Math.max(150, H * 0.3);
  const U = narrow ? W / 5.2 : Math.min(150, W / 8.5);                   // one octave's width on the breadth line
  const R = Math.max(70, Math.min(narrow ? W * 0.62 : H * 0.5, H - topH - (narrow ? 270 : 120)));   // on a phone, room below for the strips and the address
  return { narrow, topH, U, yLine: topH - 34, R, ax: narrow ? 24 : W * 0.18, ay: topH + 34 + R };
}
function draw(){
  const w = Math.round(cv.clientWidth), h = Math.round(cv.clientHeight), d = Math.min(2, devicePixelRatio || 1);
  if (!w || !h) return;
  if (Math.abs(w - W) > 1 || Math.abs(h - H) > 1 || d !== D) { W = w; H = h; D = d; cv.width = back.width = W * D; cv.height = back.height = H * D; force = true; }
  const key = x.toPrecision(12) + depth; if (key === last && !force) return; last = key; force = false;
  L = layout(); ctx.setTransform(D, 0, 0, D, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.textBaseline = 'alphabetic';
  const P = place(x), a = address(x, 4);
  // ── BREADTH: the octaves side by side, each its own sweep, laid by n + g ──
  const X = p => W / 2 + (p - P) * L.U;
  ctx.strokeStyle = 'rgba(201,199,190,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, L.yLine); ctx.lineTo(W, L.yLine); ctx.stroke();
  ctx.font = '11px ' + MONO; ctx.textAlign = 'center';
  for (let n = Math.floor(P) - 8; n <= Math.floor(P) + 8; n++) {
    const x0 = X(n), x1 = X(n + 1); if (x1 < -20 || x0 > W + 20) continue;
    const r = (x1 - x0) * 0.42, ox = x0 + 4, oy = L.yLine - 10;           // the octave's quarter sweep: home up, horizon along
    ctx.strokeStyle = n === a.n ? GOLD : 'rgba(232,200,106,.4)'; ctx.lineWidth = n === a.n ? 2 : 1.2;
    ctx.beginPath(); ctx.arc(ox, oy, r, -PI / 2, 0); ctx.stroke();
    const cA = -PI / 2 + PI / 4;                                          // its corner, at its own g = ½
    ctx.strokeStyle = n === a.n ? GOLD : 'rgba(232,200,106,.5)'; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + r * Math.cos(cA), oy + r * Math.sin(cA)); ctx.stroke();
    ctx.strokeStyle = 'rgba(201,199,190,.6)'; ctx.beginPath(); ctx.moveTo(x0, L.yLine - 8); ctx.lineTo(x0, L.yLine + 8); ctx.stroke();   // where octaves meet
    ctx.strokeStyle = GOLD; ctx.beginPath(); ctx.moveTo((x0 + x1) / 2, L.yLine - 5); ctx.lineTo((x0 + x1) / 2, L.yLine + 5); ctx.stroke();   // its corner on the line
    if (n === a.n) { const ga = -PI / 2 + a.gs[0] * PI / 2;              // the reading on its octave's sweep
      ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(ox + r * Math.cos(ga), oy + r * Math.sin(ga), 4, 0, 2 * PI); ctx.fill(); }
    ctx.fillStyle = n === a.n ? GOLD : DIM; ctx.fillText('n ' + n, (x0 + x1) / 2, L.yLine + 22);
    if (!L.narrow) { ctx.fillStyle = DIM; ctx.fillText('c = 4^' + n, (x0 + x1) / 2, L.yLine + 36); }
  }
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(W / 2, L.yLine - 26); ctx.lineTo(W / 2, L.yLine + 12); ctx.stroke();
  ctx.fillStyle = DIM; ctx.textAlign = 'left'; ctx.fillText(L.narrow ? 'BREADTH · octaves add: place = n + g' : 'BREADTH · the octaves, additive: place = n + g, every octave the same width, without end both ways', 12, 18);
  // ── DENSITY: the reader's octave as one sweep, the recursion opened to `depth` ──
  const { R, ax, ay } = L, gAt = g => -PI / 2 + g * PI / 2, at = (g, rr) => [ax + rr * Math.cos(gAt(g)), ay + rr * Math.sin(gAt(g))];
  ctx.fillStyle = DIM; ctx.fillText(L.narrow ? 'DENSITY · octave ' + a.n + ' as one sweep · depth ' + depth : 'DENSITY · octave n = ' + a.n + ' as one sweep: home ½c at the top, corner c at 45°, horizon 2c along · depth ' + depth, 12, L.topH + 18);
  ctx.strokeStyle = 'rgba(201,199,190,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ax, ay - R - 8); ctx.lineTo(ax, ay); ctx.lineTo(ax + R + 8, ay); ctx.stroke();
  ctx.strokeStyle = 'rgba(232,200,106,.35)'; ctx.beginPath(); ctx.arc(ax, ay, R, -PI / 2, 0); ctx.stroke();
  if (markCache.depth !== depth) markCache = { depth, list: marks(depth, depth >= 4 ? 3 : depth >= 3 ? 4 : 7).map(m => ({ g: gOfR(m.r), d: m.d })).filter(m => m.g > 0.0005 && m.g < 0.9995) };
  const L1 = R, stripY = ay + 30, sw = Math.min(W - 24 - (L.narrow ? 0 : 0), L.narrow ? W - 24 : R * 1.6), sx = L.narrow ? 12 : ax;
  for (const m of [...markCache.list].sort((p, q) => q.d - p.d)) {         // deeper marks first, shallower drawn over them
    const len = 22 - m.d * 4, [x1, y1] = at(m.g, L1 - len / 2), [x2, y2] = at(m.g, L1 + len / 2);
    ctx.strokeStyle = LEVEL[m.d]; ctx.globalAlpha = 0.85 - m.d * 0.12; ctx.lineWidth = m.d === 0 ? 2.2 : 1.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // the same marks on the two strips: laid by g (the sweep) and by the share (proportional)
    const s = sOf(rOfG(m.g)), byShare = s < 1 ? (s - 0.5) : 0.5 + (1 - (2 / s - 1)) / 2;
    for (const [px, row] of [[m.g, 0], [byShare, 1]]) { const xx = sx + px * sw, yy = stripY + row * 34;
      ctx.beginPath(); ctx.moveTo(xx, yy - len / 3); ctx.lineTo(xx, yy + len / 3); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // the reading's needle on the octave's sweep, and the reading on the strips
  const gl = a.gs[0], [nx, ny] = at(gl, R);
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(nx, ny); ctx.stroke();
  ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(nx, ny, 4.5, 0, 2 * PI); ctx.fill();
  const sx0 = x / 4 ** a.n, shareX = sx0 < 1 ? sx0 - 0.5 : 0.5 + (1 - (2 / sx0 - 1)) / 2;
  ctx.strokeStyle = 'rgba(201,199,190,.3)'; ctx.lineWidth = 1;
  for (const row of [0, 1]) { const yy = stripY + row * 34; ctx.beginPath(); ctx.moveTo(sx, yy); ctx.lineTo(sx + sw, yy); ctx.stroke(); }
  for (const [px, row] of [[gl, 0], [shareX, 1]]) { ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(sx + px * sw, stripY + row * 34, 4, 0, 2 * PI); ctx.fill(); }
  ctx.fillStyle = DIM; ctx.textAlign = 'left'; ctx.font = '11px ' + MONO;
  ctx.fillText('laid by g, the sweep', sx, stripY - 10); ctx.fillText('laid by the share, proportional', sx, stripY + 24);
  // the reading, as an address
  const tx = L.narrow ? 12 : ax + R + 40, ty = L.narrow ? stripY + 70 : L.topH + 60;
  const lines = [
    ['x = ' + x.toPrecision(6) + ' h', HI],
    ['place n + g = ' + P.toFixed(4), GOLD],
    ['address (n; j₁, j₂, …) = (' + a.n + (a.digits.length ? '; ' + a.digits.slice(0, depth).join(', ') : '') + ')', BLUE],
    ['g at each depth: ' + a.gs.slice(0, depth + 1).map(g => g.toFixed(3)).join(' → '), INK],
    ['marks shown: ' + markCache.list.length + (depth && !L.narrow ? ' (each depth a whole ladder inside every octave)' : ''), DIM],
  ];
  ctx.font = '13px ' + MONO;
  lines.forEach(([t, c], i) => { ctx.fillStyle = c; ctx.fillText(t, tx, ty + i * 20); });
  vis.globalCompositeOperation = 'copy'; vis.drawImage(back, 0, 0);
}
function step(){ draw(); requestAnimationFrame(step); }

// ── HANDS: drag the breadth line to move along n + g; drag in the sweep to move within the octave ───
let drag = null;
const local = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
function handle(px, py){
  if (!L) return;
  if (drag.zone === 'top') { const P0 = drag.P0 - (px - drag.x0) / L.U; x = clamp(valueAt(P0), 4 ** -12, 4 ** 12); }
  else { const g = clamp(Math.atan2(px - L.ax, L.ay - py) / (PI / 2), 0, 0.99999); const n = octaveOf(x); x = 4 ** n * sOf(rOfG(g)); }
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const [px, py] = local(e);
  drag = { zone: py < (L ? L.topH : H / 3) ? 'top' : 'sweep', x0: px, P0: place(x) }; handle(px, py); });
cv.addEventListener('pointermove', e => { if (drag) handle(...local(e)); });
const up = () => { drag = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '4') setDepth(+e.key);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { x = clamp(valueAt(place(x) + (e.key === 'ArrowRight' ? 1 : -1) / 32), 4 ** -12, 4 ** 12); e.preventDefault(); }
});
addEventListener('resize', () => { force = true; });
requestAnimationFrame(step);
</script>
</body>
</html>
