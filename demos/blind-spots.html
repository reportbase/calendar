<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Where It Cannot See</title>
<style>
  :root { --bg:#0e0f12; --panel:#16181d; --fg:#e8e6e1; --muted:#8b8f98; --line:#2a2d35; --shape:#c9c4b8;
          --seen:#6fcf8e; --hidden:#ff6b8a; --jump:#e0a64a; --edge:#b48cff; --reader:#7fb2ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, sans-serif; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  .bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;
         background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; max-width:calc(100vw - 24px); }
  button { background:#20232a; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; min-height:36px; }
  button.on { border-color:var(--reader); color:var(--reader); }
  .held { position:fixed; left:14px; top:12px; color:var(--muted); font-size:13px; }
  .held b { color:var(--jump); font-weight:600; } .held i { color:var(--edge); font-style:normal; font-weight:600; }
  .ans { position:fixed; right:14px; top:12px; font-size:13px; }
  @media (max-width:600px) { .bar { gap:6px; padding:6px; } button { padding:6px 10px; } .ans { top:32px; left:14px; right:auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="held" id="held"></div>
<div class="ans" id="ans"></div>
<div class="bar">
  <button id="play" class="on">turning</button>
  <button id="shade" class="on">backside</button>
</div>
<script>
// A still reader holds only addresses: a list of landmark pairs, where neighbouring payloads jump (its backside begins)
// or where a ray starts or stops meeting a border (its silhouette edges). Tap anywhere: the reader looks along that
// address once and answers whether the place is in view, and the list shows where its view breaks.
const TAU = Math.PI * 2, N = 360, JUMP = 1.3;
const BASE = [[-0.9,-0.6],[0.2,-0.95],[0.2,-0.35],[0.75,-0.35],[0.95,0.4],[0.1,0.35],[-0.15,0.95],[-0.8,0.55],[-0.35,0.05]];
const READER = { x:-3.0, y:0.1 }, HALF = 0.42;
let t = 0, playing = true, shade = true, tap = null;
const shapeAt = t => { const w = 0.003 * t, co = Math.cos(w), si = Math.sin(w); return BASE.map(([x, y]) => [co * x - si * y, si * x + co * y]); };
function hit(poly, sx, sy, th) { const ux = Math.cos(th), uy = Math.sin(th); let best = null;
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length];
    const ax = a[0] - sx, ay = a[1] - sy, bx = b[0] - sx, by = b[1] - sy, sa = ax * uy - ay * ux, sb = bx * uy - by * ux;
    if ((sa > 0) === (sb > 0)) continue; const f = sa / (sa - sb), px = ax + (bx - ax) * f, py = ay + (by - ay) * f, r = px * ux + py * uy;
    if (r > 0 && (best === null || r < best)) best = r; } return best; }
const angle = j => -HALF + 2 * HALF * j / (N - 1);
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); let W, H, S, OX, OY;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function resize() { const dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const barH = W < 600 ? 80 : 80, top = W < 600 ? 60 : 40, avail = H - barH - top; S = Math.min((W - 32) / 4.8, avail / 3.0); OX = W / 2 + 0.95 * S; OY = top + avail / 2; }
const P = (x, y) => [OX + x * S, OY - y * S], Wd = (px, py) => ({ x:(px - OX) / S, y:(OY - py) / S });
function frame() {
  if (playing) t++;
  const poly = shapeAt(t), look = []; for (let j = 0; j < N; j++) look.push(hit(poly, READER.x, READER.y, angle(j)));
  const jumps = [], edges = [];                       // the reader's list: addresses only
  for (let j = 0; j + 1 < N; j++) { const a = look[j], b = look[j + 1];
    if ((a === null) !== (b === null)) edges.push(j); else if (a !== null && Math.max(a, b) / Math.min(a, b) > JUMP) jumps.push(j); }
  ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, W, H);
  const [rx, ry] = P(READER.x, READER.y);
  // the backside: along every address, what lies past the first border
  if (shade) { ctx.fillStyle = 'rgba(255,107,138,0.07)';
    for (let j = 0; j + 1 < N; j++) { const r0 = look[j], r1 = look[j + 1]; if (r0 === null || r1 === null) continue; const far = 6;
      const a0 = angle(j), a1 = angle(j + 1); ctx.beginPath();
      ctx.moveTo(...P(READER.x + r0 * Math.cos(a0), READER.y + r0 * Math.sin(a0))); ctx.lineTo(...P(READER.x + far * Math.cos(a0), READER.y + far * Math.sin(a0)));
      ctx.lineTo(...P(READER.x + far * Math.cos(a1), READER.y + far * Math.sin(a1))); ctx.lineTo(...P(READER.x + r1 * Math.cos(a1), READER.y + r1 * Math.sin(a1))); ctx.closePath(); ctx.fill(); } }
  // the landmark pairs, drawn as the addresses they are
  const drawAddr = (j, col) => { const a = (angle(j) + angle(j + 1)) / 2; ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(...P(READER.x + 6 * Math.cos(a), READER.y + 6 * Math.sin(a))); ctx.stroke(); };
  jumps.forEach(j => drawAddr(j, css('--jump'))); edges.forEach(j => drawAddr(j, css('--edge')));
  ctx.strokeStyle = css('--shape'); ctx.lineWidth = 2; ctx.beginPath(); poly.forEach((p, i) => { const [a, b] = P(p[0], p[1]); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = css('--reader'); ctx.beginPath(); ctx.arc(rx, ry, 8, 0, TAU); ctx.fill();
  // the tapped place: one look along its address
  let ans = '';
  if (tap) { const a = Math.atan2(tap.y - READER.y, tap.x - READER.x), d = Math.hypot(tap.x - READER.x, tap.y - READER.y);
    if (Math.abs(a) > HALF) ans = '<span style="color:var(--muted)">outside its facing</span>';
    else { const r = hit(poly, READER.x, READER.y, a), seen = r === null || d <= r + 1e-9;
      ctx.strokeStyle = seen ? css('--seen') : css('--hidden'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(...P(tap.x, tap.y)); ctx.stroke();
      ans = seen ? '<span style="color:var(--seen)">can see it from here</span>' : '<span style="color:var(--hidden)">cannot see it from here</span>'; }
    ctx.fillStyle = css('--fg'); ctx.beginPath(); ctx.arc(...P(tap.x, tap.y), 5, 0, TAU); ctx.fill(); }
  document.getElementById('held').innerHTML = `held: <b>${jumps.length} jumps</b> · <i>${edges.length} edges</i> · 0 payloads`;
  document.getElementById('ans').innerHTML = ans;
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', e => { tap = Wd(e.clientX, e.clientY); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') tap = Wd(e.clientX, e.clientY); });
const $ = id => document.getElementById(id);
$('play').onclick = () => { playing = !playing; $('play').classList.toggle('on', playing); $('play').textContent = playing ? 'turning' : 'still'; };
$('shade').onclick = () => { shade = !shade; $('shade').classList.toggle('on', shade); };
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
