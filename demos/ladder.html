<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>From Somewhere to Nowhere</title>
<style>
  :root { --bg:#0e0f12; --panel:#16181d; --fg:#e8e6e1; --muted:#8b8f98; --line:#2a2d35;
          --h:#7fb2ff; --v:#e0a64a; --bar:#e8e6e1; --pair:#b48cff; --own:#6fcf8e; --corr:#e0a64a; --conv:#8b8f98; --back:#ff6b8a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, sans-serif; overflow:hidden; }
  canvas { display:block; position:fixed; left:0; top:0; touch-action:none; }
  .rungs { position:fixed; right:14px; top:14px; width:300px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .rung { padding:7px 9px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-bottom:4px; font-size:13px; }
  .rung.sel { border-color:var(--line); background:#1d2027; }
  .rung .k { display:inline-block; width:22px; color:var(--muted); }
  .own .n { color:var(--own); } .corr .n { color:var(--corr); } .conv .n { color:var(--conv); }
  .rung .d { color:var(--muted); display:none; margin:3px 0 0 22px; } .rung.sel .d { display:block; }
  .bar { position:fixed; left:14px; top:14px; display:flex; gap:8px; }
  button { background:#20232a; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; min-height:36px; }
  button.on { border-color:var(--own); color:var(--own); }
  @media (max-width:700px) { .rungs { left:10px; right:10px; top:auto; bottom:64px; width:auto; max-height:36vh; overflow:auto; padding:6px; } .rung { padding:5px 7px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="rungs" id="rungs"></div>
<div class="bar"><button id="sweep">four sweeps</button></div>
<script>
// A bar of 1 sweeps from horizontal to vertical: h and v are its two magnitudes. The reading v/h runs from home (0)
// through the corner (1) to the horizon. The quarter sweep sends a reading r to −1/r. Drag the bar to sweep it.
const TAU = Math.PI * 2;
let th = 0.55, anim = null, sel = 0;
const RUNGS = [
  ['0', 'the frame', 'own', 'Home, corner, horizon: the reader has these by standing somewhere. Every reading is placed against them.'],
  ['1', 'the absolute', 'own', 'The quarter sweep, r → −1/r: the reader\'s own sense of what is square to what. It holds it as its own convention.'],
  ["1′", 'checked against the world', 'corr', 'Not from one standpoint. It needs something known (a circle), or three standpoints that share what they see.'],
  ['2', 'a shared horizon', 'corr', 'Two readers agree which of their directions are the same. It needs them to know they are looking at the same things.'],
  ['3', 'a shared absolute', 'corr', 'Two readers agree on what is square. The same need: shared landmarks.'],
  ['4', 'a unit', 'corr', 'Two readers compare lengths. It needs one border both have seen.'],
  ['5', 'an origin and axes', 'conv', 'x, y, z: a place and directions no one stands at. Pure convention; it carries nothing.'],
];
const rungsEl = document.getElementById('rungs');
rungsEl.innerHTML = '<div style="color:var(--muted);font-size:12px;margin:0 0 6px 4px">what the view from nowhere adds, rung by rung</div>' +
  RUNGS.map((r, i) => `<div class="rung ${r[2]}${i === sel ? ' sel' : ''}" data-i="${i}"><span class="k">${r[0]}</span><span class="n">${r[1]}</span><div class="d">${r[3]}</div></div>`).join('');
rungsEl.querySelectorAll('.rung').forEach(el => el.onclick = () => { sel = Number(el.dataset.i); rungsEl.querySelectorAll('.rung').forEach(e => e.classList.toggle('sel', Number(e.dataset.i) === sel)); });
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); let W, H, PX, PY, L, lineY, lineX0, lineX1;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function resize() { const dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const narrow = W < 700, usableW = narrow ? W : W - 330, usableH = narrow ? H * 0.58 : H;
  L = Math.min(usableW * 0.28, usableH * 0.28); PX = usableW / 2; PY = narrow ? usableH * 0.42 : usableH * 0.42;
  lineY = PY + L * 1.45; lineX0 = Math.max(44, PX - L * 1.9); lineX1 = Math.min(usableW - 44, PX + L * 1.9); }
// the reading line: plain positions for readings between −4 and 4; beyond that, at the ends, toward the horizon
const toX = r => { const m = Math.max(-4, Math.min(4, r)); return (lineX0 + lineX1) / 2 + m / 4 * (lineX1 - lineX0) / 2; };
function draw() {
  if (anim) { const p = (performance.now() - anim) / 8000; if (p >= 1) { anim = null; document.getElementById('sweep').classList.remove('on'); th = 0; } else th = p * TAU; }
  ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, W, H);
  const c = Math.cos(th), s = Math.sin(th), h = Math.abs(c), v = Math.abs(s), front = c >= 0;
  // the bar of 1 and its two magnitudes
  ctx.strokeStyle = css('--line'); ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.arc(PX, PY, L, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  const ex = PX + c * L, ey = PY - s * L;
  ctx.strokeStyle = css('--h'); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(ex, PY); ctx.stroke();
  ctx.strokeStyle = css('--v'); ctx.beginPath(); ctx.moveTo(ex, PY); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.strokeStyle = front ? css('--bar') : css('--back'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = css('--bar'); ctx.beginPath(); ctx.arc(ex, ey, 7, 0, TAU); ctx.fill();
  ctx.font = '13px system-ui'; ctx.fillStyle = css('--h'); ctx.fillText(`h ${h.toFixed(2)}`, PX + c * L / 2 - 18, PY + 18);
  ctx.fillStyle = css('--v'); ctx.fillText(`v ${v.toFixed(2)}`, ex + (c >= 0 ? 8 : -52), PY - s * L / 2);
  // the reading, and its quarter-sweep partner
  const r = h < 1e-9 ? Infinity : (Math.sign(c * s) || 1) * v / h, partner = r === 0 ? Infinity : -1 / r;
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(lineX0, lineY); ctx.lineTo(lineX1, lineY); ctx.stroke();
  const tick = (x, lab, up) => { ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, lineY - 6); ctx.lineTo(x, lineY + 6); ctx.stroke(); ctx.fillStyle = css('--muted'); ctx.fillText(lab, x - ctx.measureText(lab).width / 2, up ? lineY - 14 : lineY + 22); };
  const narrow = W < 700; tick(toX(0), 'home 0'); tick(toX(1), 'corner 1', narrow); tick(toX(-1), '−1', narrow); tick(lineX0, 'horizon'); tick(lineX1, 'horizon');
  const fin = x => isFinite(x);
  const rx = fin(r) ? toX(r) : lineX1, px = fin(partner) ? toX(partner) : lineX1;
  ctx.strokeStyle = css('--pair'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(rx, lineY - 8); ctx.quadraticCurveTo((rx + px) / 2, lineY - 60, px, lineY - 8); ctx.stroke();
  ctx.fillStyle = css('--bar'); ctx.beginPath(); ctx.arc(rx, lineY, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = css('--pair'); ctx.beginPath(); ctx.arc(px, lineY, 5, 0, TAU); ctx.fill();
  ctx.fillStyle = css('--fg'); ctx.font = '14px system-ui';
  const fmt = x => !fin(x) ? '∞' : Math.abs(x) > 99 ? (x > 0 ? '>99' : '<−99') : x.toFixed(2);
  ctx.fillText(`reading v/h = ${fmt(r)}`, lineX0, lineY + 50);
  ctx.fillStyle = css('--pair'); ctx.fillText(`quarter sweep → ${fmt(partner)}`, lineX0, lineY + 72);
  if (!front) { ctx.fillStyle = css('--back'); ctx.fillText('behind: reads the same as the front', lineX0, lineY + 94); }
  requestAnimationFrame(draw);
}
let drag = false;
const setFrom = e => { th = Math.atan2(PY - e.clientY, e.clientX - PX); };
cv.addEventListener('pointerdown', e => { if (Math.hypot(e.clientX - PX, e.clientY - PY) < L * 1.3) { drag = true; anim = null; setFrom(e); cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove', e => { if (drag) setFrom(e); });
cv.addEventListener('pointerup', () => drag = false); cv.addEventListener('pointercancel', () => drag = false);
document.getElementById('sweep').onclick = () => { anim = performance.now(); document.getElementById('sweep').classList.add('on'); };
addEventListener('resize', resize); resize(); requestAnimationFrame(draw);
</script>
</body>
</html>
