<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA-CLT · Continuous Curves on the Arc v2</title>
<style>
#menu::-webkit-scrollbar { width: 6px; }
#menu::-webkit-scrollbar-track { background: transparent; }
#menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 3px; }
#menu::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.38); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #03040c;
    overflow: hidden;
    width: 100vw; height: 100vh;
    font-family: 'Courier New', monospace;
    color: rgba(255,255,255,0.8);
  }
  canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; touch-action: none; }
  #viewBtns .vbtn{border:1px solid rgba(255,255,255,0.18);border-radius:3px;padding:5px 10px;text-align:center;cursor:pointer}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="menuToggle" style="
  position: fixed; top: 14px; right: 14px; z-index: 11;
  background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 3px; padding: 6px 12px;
  font-family: 'Courier New', monospace; font-size: 12px;
  color: rgba(255,255,255,0.85); cursor: pointer; user-select: none;
">☰ menu</div>

<div id="menu" style="
  display: none;
  position: fixed; top: 46px; right: 14px; z-index: 10;
  background: rgba(4,6,18,0.85); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 6px; padding: 12px 14px; min-width: 285px;
  max-height: calc(100vh - 60px); overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.25) transparent;
  font-family: 'Courier New', monospace; font-size: 11px;
  color: rgba(255,255,255,0.8); user-select: none;
">
  <div id="homeButton" style="
    border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
    padding: 6px 12px; text-align: center; cursor: pointer; margin-bottom: 12px;
  ">⌂ home</div>
  <div id="sAuto" title="Space toggles · Esc stops" style="
    border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
    padding: 6px 12px; text-align: center; cursor: pointer; margin-bottom: 12px;
    color: rgba(255,255,255,0.8);
  ">▶ auto motion</div>
  <div style="color:#64c8ff; margin-bottom:6px;">bottom view</div>
  <div id="viewBtns" style="display:flex; flex-direction:column; gap:5px; margin-bottom:14px;"></div>
  <div style="color:#64c8ff; margin-bottom:6px;">top line</div>
  <div id="topGlyphBtns" style="display:flex; gap:5px; margin-bottom:14px;">
    <div class="tgbtn" data-glyph="dome" style="flex:1; border:1px solid rgba(255,255,255,0.18); border-radius:3px; padding:5px 8px; text-align:center; cursor:pointer;">dome</div>
    <div class="tgbtn" data-glyph="atom" style="flex:1; border:1px solid rgba(255,255,255,0.18); border-radius:3px; padding:5px 8px; text-align:center; cursor:pointer;">atom</div>
    <div class="tgbtn" data-glyph="dial" style="flex:1; border:1px solid rgba(255,255,255,0.18); border-radius:3px; padding:5px 8px; text-align:center; cursor:pointer;">dial</div>
    <div class="tgbtn" data-glyph="twodial" style="flex:1; border:1px solid rgba(255,255,255,0.18); border-radius:3px; padding:5px 8px; text-align:center; cursor:pointer;">2 dials</div>
  </div>
  <!-- One combo box for both the wave (wave/slope panels) and the bridge curve
       (bridge-theorem panel); its contents swap with the active panel. -->
  <div id="curveCtl">
    <label id="curveLabel" style="display:block; color:#f2b45f; margin-bottom:4px;">wave</label>
    <select id="sCurveWave" style="width:100%; margin-bottom:14px; background:rgba(0,0,0,0.55);
      color:rgba(255,255,255,0.85); border:1px solid rgba(255,255,255,0.18); border-radius:3px;
      font-family:'Courier New',monospace; font-size:11px; padding:4px;"></select>
    <div id="paramWrap" style="display:none;">
      <label style="display:block; color:#d4a043; margin-bottom:4px;">curve parameter
        <span id="vParam" style="float:right; color:rgba(255,255,255,0.9)">0.50</span></label>
      <input type="range" id="sParam" min="0" max="1" value="0.5" step="0.01"
        style="width:100%; accent-color:#d4a043; height:3px; margin-bottom:12px;">
    </div>
  </div>
  <label style="display:block; color:#7fb069; margin-bottom:4px;">fisheye window ±L
    <span id="vFishL" style="float:right; color:rgba(255,255,255,0.9)">8</span></label>
  <input type="range" id="sFishL" min="2" max="32" value="8" step="1"
    style="width:100%; accent-color:#7fb069; height:3px; margin-bottom:12px;">
  <label style="display:block; color:#7fb069; margin-bottom:4px;">leaves N
    <span id="vLeaves" style="float:right; color:rgba(255,255,255,0.9)">32</span></label>
  <input type="range" id="sLeaves" min="8" max="120" value="32" step="1"
    style="width:100%; accent-color:#7fb069; height:3px; margin-bottom:12px;">
  <label style="display:block; color:#64c8ff; margin-bottom:4px;">shared h
    <span id="vDepth" style="float:right; color:rgba(255,255,255,0.9)">1.20</span></label>
  <input type="range" id="sDepth" min="-4" max="4" value="0.263" step="0.01"
    style="width:100%; accent-color:#64c8ff; height:3px;">
</div>

<script>
const PSI = 2 / Math.PI;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const SAFE = Math.PI / 2 - 1e-12;  // renderer's θ→tan clamp. MUST match PAN_LIMIT's ε or the display saturates first. Reach = 1/ε ≈ 10^12. The absolute wall is IEEE-754's own: tan of the double nearest π/2 ≈ 1.6e16 — beyond ε≈1e-16 the clamp isn't ours to move.

// ═══════════════════════════════════════════════════════════════════════════
// CURVE LIBRARY — each entry has:
//   label:   display name
//   desc:    short formula note
//   param:   { label, min, max, fmt } — the knob meaning for this curve
//   f(t, p): the angular signal f(θ) ∈ ℝ, used as radial envelope on the arc
//   preview(t, p): returns {x,y} in [-1,1]×[-1,1] for the 2D shape preview
//   previewLabel: what we're showing in the 2D panel
// ═══════════════════════════════════════════════════════════════════════════
const CURVES = [
  // ── POLYNOMIALS (original) ───────────────────────────────────────────────
  {
    label: 'constant · 1',
    desc:  'f(θ) = 1  ·  deg 0',
    param: { label: 'scale a', min: 0.1, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => p,
    preview: (t, p) => ({ x: t / (Math.PI/2), y: p }),
    previewLabel: 'f(θ) = a  (constant)',
    previewFull: false,
  },
  {
    label: 'linear · θ',
    desc:  'f(θ) = θ  ·  deg 1',
    param: { label: 'slope m', min: 0.5, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => p * t,
    preview: (t, p) => ({ x: t / (Math.PI/2), y: p * t }),
    previewLabel: 'f(θ) = m·θ  (linear)',
    previewFull: false,
  },
  {
    label: 'quadratic · 1−θ²',
    desc:  'f(θ) = 1 − θ²  ·  deg 2',
    param: { label: 'scale a', min: 0.5, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => p * (1 - t*t),
    preview: (t, p) => ({ x: t / (Math.PI/2), y: p * (1 - t*t) }),
    previewLabel: 'f(θ) = a(1−θ²)  (parabola)',
    previewFull: false,
  },
  {
    label: 'cubic · θ³',
    desc:  'f(θ) = θ³  ·  deg 3',
    param: { label: 'scale a', min: 0.5, max: 5, fmt: v => v.toFixed(2) },
    f: (t, p) => p * t*t*t,
    preview: (t, p) => ({ x: t / (Math.PI/2), y: p * t*t*t }),
    previewLabel: 'f(θ) = a·θ³  (cubic)',
    previewFull: false,
  },
  {
    label: 'quartic · (1−θ²)²',
    desc:  'f(θ) = (1−θ²)²  ·  deg 4',
    param: { label: 'scale a', min: 0.5, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => { const u = 1 - t*t; return p * u*u; },
    preview: (t, p) => { const u = 1 - t*t; return { x: t/(Math.PI/2), y: p*u*u }; },
    previewLabel: 'f(θ) = a·(1−θ²)²  (quartic)',
    previewFull: false,
  },
  {
    label: 'Chebyshev T₃',
    desc:  'f(θ) = 4u³ − 3u  where u = 2θ/π  ·  deg 3',
    param: { label: 'scale a', min: 0.5, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => { const u = 2*t/Math.PI; return p * (4*u*u*u - 3*u); },
    preview: (t, p) => { const u = 2*t/Math.PI; return { x: t/(Math.PI/2), y: p*(4*u*u*u-3*u) }; },
    previewLabel: 'Chebyshev T₃(u)  u=2θ/π',
    previewFull: false,
  },
  {
    label: 'Chebyshev T₅',
    desc:  'f(θ) = 16u⁵ − 20u³ + 5u  where u = 2θ/π  ·  deg 5',
    param: { label: 'scale a', min: 0.5, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => { const u = 2*t/Math.PI; return p * (16*Math.pow(u,5) - 20*Math.pow(u,3) + 5*u); },
    preview: (t, p) => { const u = 2*t/Math.PI; return { x: t/(Math.PI/2), y: p*(16*Math.pow(u,5)-20*Math.pow(u,3)+5*u) }; },
    previewLabel: 'Chebyshev T₅(u)  u=2θ/π',
    previewFull: false,
  },
  {
    label: 'sin(4θ)',
    desc:  'f(θ) = sin(4θ)  ·  oscillatory',
    param: { label: 'freq n', min: 1, max: 8, fmt: v => v.toFixed(1) },
    f: (t, p) => Math.sin(p * t),
    preview: (t, p) => ({ x: t/(Math.PI/2), y: Math.sin(p*t) }),
    previewLabel: 'f(θ) = sin(n·θ)  (sinusoidal)',
    previewFull: false,
  },
  // ── CIRCLES & ELLIPSES ──────────────────────────────────────────────────
  {
    label: 'circle  ·  cos θ',
    desc:  'x=cos θ, y=sin θ  →  f(θ)=cos θ',
    param: { label: 'phase φ', min: 0, max: Math.PI*2, fmt: v => (v/Math.PI).toFixed(2)+'π' },
    f: (t, p) => Math.cos(t + p),
    preview: (t, p) => ({ x: Math.cos(t + p), y: Math.sin(t + p) }),
    previewLabel: 'unit circle  (x=cos θ, y=sin θ)',
    previewFull: true,
  },
  {
    label: 'ellipse  ·  a cos θ',
    desc:  'x=cos θ, y=b·sin θ  →  f(θ)=cos θ',
    param: { label: 'aspect b', min: 0.2, max: 2.5, fmt: v => v.toFixed(2) },
    f: (t, p) => Math.cos(t),
    preview: (t, p) => ({ x: Math.cos(t), y: p * Math.sin(t) }),
    previewLabel: 'ellipse  (b = aspect ratio)',
    previewFull: true,
  },
  // ── PROJECTIONS OF SPHERE ───────────────────────────────────────────────
  {
    label: 'sphere gnomonic  ·  z-component',
    desc:  'point on S² via gnomonic: f(θ)=cos θ / √(1+tan²θ)',
    param: { label: 'φ rotate', min: 0, max: Math.PI*2, fmt: v => (v/Math.PI).toFixed(2)+'π' },
    f: (t, p) => {
      // Point on S² with azimuth = p, polar angle maps to θ
      // Gnomonic: (X,Y) = (tan θ · cos φ, tan θ · sin φ), z = 1/√(1+tan²θ) = cos θ
      return Math.cos(t);  // z-component
    },
    preview: (t, p) => {
      // Show the gnomonic projection trajectory as p varies
      const R = Math.tan(Math.min(Math.abs(t), Math.PI/2 - 0.01));
      return { x: Math.min(R,2) * Math.cos(p) / 2, y: Math.min(R,2) * Math.sin(p) / 2 };
    },
    previewLabel: 'S² gnomonic projection  (z-component)',
    previewFull: true,
  },
  {
    label: 'sphere stereographic  ·  latitude',
    desc:  'stereographic S²: R = tan(θ/2), f(θ)=R/(1+R²)  [S² invariant density]',
    param: { label: 'φ azimuth', min: 0, max: Math.PI*2, fmt: v => (v/Math.PI).toFixed(2)+'π' },
    f: (t, p) => {
      const R = Math.tan(Math.abs(t) / 2 + 0.001);
      return R / (1 + R * R);  // S² invariant density at this radius
    },
    preview: (t, p) => {
      // Stereographic inverse: circle on S² projects to circle in plane
      const r = 0.7;  // fixed circle radius on S²
      const lat = Math.PI/4 + t * 0.3;
      return { x: r * Math.cos(t * 2 + p), y: r * Math.sin(t * 2 + p) };
    },
    previewLabel: 'S² stereographic density  1/(1+R²)²',
    previewFull: true,
  },
  // ── SPIRALS ─────────────────────────────────────────────────────────────
  {
    label: 'Archimedean spiral',
    desc:  'r = a·θ  →  f(θ) = θ/π  (radial growth)',
    param: { label: 'turns n', min: 0.5, max: 4, fmt: v => v.toFixed(1) },
    f: (t, p) => t / Math.PI,   // linear radial function of θ
    preview: (t, p) => {
      // Archimedean spiral: r = (p * |t| / (π/2))
      const r = p * Math.abs(t) / (Math.PI / 2 + 0.001);
      return { x: r * Math.cos(t * p * 2), y: r * Math.sin(t * p * 2) };
    },
    previewLabel: 'Archimedean spiral  r = a·θ',
    previewFull: false,
  },
  {
    label: 'logarithmic spiral',
    desc:  'r = e^(bθ)  →  f(θ) = e^(b·θ/π)',
    param: { label: 'growth b', min: 0.1, max: 2.0, fmt: v => v.toFixed(2) },
    f: (t, p) => Math.exp(p * t / Math.PI),
    preview: (t, p) => {
      const r = 0.2 * Math.exp(p * t);
      return { x: Math.min(r, 1.2) * Math.cos(t * 3), y: Math.min(r, 1.2) * Math.sin(t * 3) };
    },
    previewLabel: 'logarithmic spiral  r = e^(bθ)',
    previewFull: false,
  },
  // ── LISSAJOUS ────────────────────────────────────────────────────────────
  {
    label: 'Lissajous  ·  sin(nθ)',
    desc:  'f(θ) = sin(n·θ)  ·  n = frequency ratio',
    param: { label: 'freq n', min: 1, max: 8, fmt: v => v.toFixed(1) },
    f: (t, p) => Math.sin(p * t),
    preview: (t, p) => ({
      x: Math.cos(t * Math.PI / (Math.PI/2)),
      y: Math.sin(p * t * Math.PI / (Math.PI/2)),
    }),
    previewLabel: 'Lissajous figure  (x=cos t, y=sin nt)',
    previewFull: true,
  },
  {
    label: 'Lissajous  ·  cos(nθ + δ)',
    desc:  'f(θ) = cos(n·θ + δ)  ·  phase-shifted',
    param: { label: 'phase δ', min: 0, max: Math.PI, fmt: v => (v/Math.PI).toFixed(2)+'π' },
    f: (t, p) => Math.cos(3 * t + p),
    preview: (t, p) => ({
      x: Math.cos(2 * t * 2),
      y: Math.cos(3 * t * 2 + p),
    }),
    previewLabel: 'Lissajous  (2:3 ratio + phase)',
    previewFull: true,
  },
  // ── ROSE CURVES ──────────────────────────────────────────────────────────
  {
    label: 'rose curve  ·  cos(nθ)',
    desc:  'r = cos(n·θ)  →  f(θ) = cos(n·θ)',
    param: { label: 'petals n', min: 1, max: 7, fmt: v => Math.round(v).toString() },
    f: (t, p) => Math.cos(Math.round(p) * t),
    preview: (t, p) => {
      const n = Math.round(p);
      const r = Math.cos(n * t);
      return { x: r * Math.cos(t), y: r * Math.sin(t) };
    },
    previewLabel: 'rose curve  r = cos(nθ)',
    previewFull: true,
  },
  {
    label: 'cardioid  ·  1 + cos θ',
    desc:  'r = 1 + cos θ  →  f(θ) = (1 + cos θ)/2',
    param: { label: 'offset a', min: 0, max: 2, fmt: v => v.toFixed(2) },
    f: (t, p) => (p + Math.cos(t)) / (p + 1),
    preview: (t, p) => {
      const r = (p + Math.cos(t)) / (p + 1);
      return { x: r * Math.cos(t), y: r * Math.sin(t) };
    },
    previewLabel: 'cardioid family  r = a + cos θ',
    previewFull: true,
  },
  // ── TRIGONOMETRIC ────────────────────────────────────────────────────────
  {
    label: 'sin(nθ)  ·  n=3',
    desc:  'f(θ) = sin(3θ)',
    param: { label: 'amplitude a', min: 0.1, max: 2, fmt: v => v.toFixed(2) },
    f: (t, p) => p * Math.sin(3 * t),
    preview: (t, p) => ({ x: t / (Math.PI/2), y: p * Math.sin(3 * t) }),
    previewLabel: 'f(θ) = a·sin(3θ)  (direct plot)',
    previewFull: false,
  },
  {
    label: 'cos(θ)·sin(2θ)',
    desc:  'f(θ) = cos θ · sin(2θ)  ·  symmetric beat',
    param: { label: 'scale a', min: 0.5, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => p * Math.cos(t) * Math.sin(2 * t),
    preview: (t, p) => {
      const r = p * Math.cos(t) * Math.sin(2 * t);
      return { x: r * Math.cos(t), y: r * Math.sin(t) };
    },
    previewLabel: 'r = a·cos θ·sin(2θ)  (polar)',
    previewFull: false,
  },
  // ── SPECIAL ──────────────────────────────────────────────────────────────
  {
    label: 'Cauchy density  ·  1/(1+x²)',
    desc:  'f(θ) = 1/(1+tan²θ) = cos²θ  ·  Cauchy on arc',
    param: { label: 'scale γ', min: 0.1, max: 3, fmt: v => v.toFixed(2) },
    f: (t, p) => p / (1 + Math.pow(Math.tan(Math.min(Math.abs(t), SAFE)), 2)),
    preview: (t, p) => {
      const x = Math.tan(Math.min(Math.abs(t), SAFE)) * Math.sign(t);
      return { x: x / 4, y: p / (1 + x * x) };
    },
    previewLabel: 'Cauchy density  f(x)=γ/(1+x²)  on ℝ',
    previewFull: false,
  },
  {
    label: 'S¹ invariant  ·  x→ −1/x duality',
    desc:  'f(θ) = |cos θ| / (|cos θ|+|sin θ|)  ·  inversion-symmetric',
    param: { label: 'power p', min: 0.5, max: 4, fmt: v => v.toFixed(2) },
    f: (t, p) => {
      const c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));
      return Math.pow(c / (c + s + 1e-6), p);
    },
    preview: (t, p) => {
      // Show how x and 1/x are dual on the circle
      const x = Math.tan(Math.min(Math.abs(t), SAFE)) * Math.sign(t);
      const r = Math.abs(x) < 0.01 ? 100 : 1 / Math.abs(x);
      return { x: Math.cos(t) * 0.8, y: Math.sin(t) * 0.8 };
    },
    previewLabel: 'S¹ inversion duality  x ↔ 1/x',
    previewFull: true,
  },
  {
    label: 'S² tail signature  ·  1/(1+R²)²',
    desc:  'f(θ) = cos⁴θ  ·  S² stereographic invariant',
    param: { label: 'dim n', min: 1, max: 4, fmt: v => v.toFixed(1) },
    f: (t, p) => Math.pow(Math.cos(t), 2 * p),  // cos^{2n} θ
    preview: (t, p) => {
      // Show rung decay R_r → 2^{-n} for different n
      const r = Math.pow(0.5, p) * (1 + 0.5 * Math.cos(4 * t));
      return { x: r * Math.cos(t), y: r * Math.sin(t) };
    },
    previewLabel: 'S^n invariant density  cos^{2n}θ',
    previewFull: false,
  },
];

function currentCurve() { return CURVES[state.curveIdx]; }
function currentParam() {
  const c = currentCurve();
  const p = c.param;
  return p.min + (state.paramT) * (p.max - p.min);
}

// ═══════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════
const state = {
  theta: Math.PI / 3,  // ~60°, gives multi-rung cascade trace
  ap: 0.80,
  N: 32,
  rScale: 1.00,
  topGlyph: 'dome',    // top number line glyph: 'dome' (semicircle) | 'atom' (v:h rise/run triangle) | 'dial' (atom's reading dial, 0 on top)
  curveIdx: 2,         // quadratic 1−θ²
  depth: 14,
  paramT: 0.5,
  cascadeAngle: 0,     // rotation angle of the cascade dial (radians)
  waveIdx: 0,          // (legacy) index into WAVE_FNS — superseded by fnIdx
  fnIdx: 0,            // index into UNIFIED_FNS — the ONE selected function (wave + bridge share it)
  wavePan: 0,          // continuous-wave view: horizontal pan offset (wave-only)
  autoMotion: false,   // continuous auto-pan running? (Space toggles, Esc stops)
  fishL: 8,            // fisheye circle: window half-width in slope units
  hVal: 1.2,           // 2D view: the SHARED reference — the run; one register, drawn on every line
  vVal: 0.45,          // 2D view: first rise v₁ (top line); the pointing is (v₁ : v₂ : h)
  v2Val: 1.8,          // 2D view: second rise v₂ (bottom line)
  depthD: 1,           // retired: the "depth" was the shared h all along
  curAtom: 'vVal',     // 2D view: which register the number line currently edits
  shapeIdx: 0,         // 2D view: which shape occupies the plane
  vhdPlay: true,       // 2D view: the shape plays as a SIGNAL driving v₁, v₂ in quadrature
  sphYaw: -0.55,       // pointing sphere: orbit yaw (drag to rotate)
  sphPitch: 0.35,      // pointing sphere: orbit pitch
  foldT: 0,            // fold view: 0 = meridian 2-ring … 3 = welded read dial
  beamA: 1.732,        // beam view: the two pans — FREE registers, no unit anywhere
  beamB: 1.0,          //   (the read is scale-free: only A:B matters, and (0:0) is honest)
  seqDepth: 1,         // sequence view: depth d — the shape held as N = 2^(d+1) resolved atoms
  stYaw: -0.6,         // stance view: orbit yaw (surveyor only — writes nothing)
  stPitch: 0.32,       // stance view: orbit pitch
  stShape: 0,          // stance view: which 3D preset curve
  stSel: -1,           // stance view: picked leaf (arrow keys write its registers)
  elOp: 'ratio',       // eight line: what the combined readout presents — 'ratio' (A/B) or 'sum' (A−B, signed)
  elSel: 'A',          // eight line: the SELECTED atom — the top line shows and edits this register
  skyYaw: -0.5,        // sky view: orbit yaw (surveyor only)
  skyPitch: 0.18,      // sky view: orbit pitch
  viewMode: 'tangent',   // 'rungs' = cascade dial below the arc;
                       // 'tangent' = tan θ plot below the arc, with leaf
                       //             connection lines from arc to plot
};

// ═══════════════════════════════════════════════════════════════════════════
// Cascade math — same as original, now operating on the curve f(θ)
// ═══════════════════════════════════════════════════════════════════════════
function rungBand(r, depth, side) {
  if (r === 0) return side === 'pos' ? [0, Math.PI/4] : [-Math.PI/4, 0];
  const a = Math.atan(Math.pow(2, r - 1));
  const b = (r === depth) ? Math.PI/2 : Math.atan(Math.pow(2, r));
  return side === 'pos' ? [a, b] : [-b, -a];
}
function computeSpectrum(curveFn, depth) {
  // Sample the curve at the N leaf positions to get the bridge-theorem
  // coefficients c_k = f(θ_k). The cascade rung structure is retained
  // here as a *visualization* — each leaf is binned into a rung based on
  // |tan θ_k|, and we record the per-rung integrals for the colored band
  // display. The reconstruction itself does not use the rung integrals;
  // it uses all N coefficients via the K_N kernel (see reconstructKN).
  const N = state.N;
  const result = [];
  for (let r = 0; r <= depth; r++) {
    const [loP, hiP] = rungBand(r, depth, 'pos');
    const [loN, hiN] = rungBand(r, depth, 'neg');
    result.push({
      rung: r,
      posBandLo: loP, posBandHi: hiP,
      negBandLo: loN, negBandHi: hiN,
      posIntegral: 0, negIntegral: 0,
      posThetas: [], negThetas: [],
      posCoeffs: [], negCoeffs: [],
    });
  }
  for (let i = 0; i < N; i++) {
    const th  = itemTheta(i, N);
    const val = curveFn(th);
    if (!isFinite(val)) continue;
    const absTan = Math.abs(Math.tan(Math.max(-SAFE, Math.min(SAFE, th))));
    const r = Math.min(rungOf(absTan), depth);
    const bin = result[r];
    if (th >= 0) { bin.posIntegral += val; bin.posThetas.push(th); bin.posCoeffs.push(val); }
    else         { bin.negIntegral += val; bin.negThetas.push(th); bin.negCoeffs.push(val); }
  }
  return result;
}

// ═══════════════════════════════════════════════════════════════════════════
// Tangent Bridge Theorem reconstruction
// ═══════════════════════════════════════════════════════════════════════════
// The Bridge Theorem (TBT v7) states that discrete leaf coefficients and
// the continuous reconstruction are equivalent through the kernel
//   K_N(φ) = sin(N·φ) / (N · tan(φ))
// on period π. The reconstruction at any θ is the barycentric form
//   f̂(θ) = Σ c_k · K_N(θ - θ_k) / Σ K_N(θ - θ_k)
// where c_k = f(θ_k) are the leaf samples and θ_k = (k + 0.5)π/N − π/2
// (matching this demo's itemTheta convention, centered around 0).
function kernelKN(phi, N) {
  // Wrap to (−π/2, π/2] (period π in v22 inside-view parameterization)
  let p = phi;
  while (p >  Math.PI / 2) p -= Math.PI;
  while (p <= -Math.PI / 2) p += Math.PI;
  if (Math.abs(p) < 1e-12) return 1;
  const den = N * Math.tan(p);
  if (Math.abs(den) < 1e-12) return 1;
  return Math.sin(N * p) / den;
}

// Sample the curve at all N leaf positions and return the coefficient
// sequence c_k = f(θ_k). Replaces the polynomial-fit recovery: the bridge
// theorem says coefficients ARE the leaf values, not the result of a
// regression against rung integrals.
function leafCoefficients(curveFn) {
  const N = state.N;
  const c = new Float64Array(N);
  for (let k = 0; k < N; k++) {
    const v = curveFn(itemTheta(k, N));
    c[k] = isFinite(v) ? v : 0;
  }
  return c;
}

// Evaluate the K_N reconstruction at a single angle θ given the leaf
// coefficients. Barycentric form (division by the kernel-weight sum). With a
// finite aperture halfW < N/2 the sum runs over a Hann-tapered window of leaves
// around the query — the bounded observer. K_N is cardinal at the nodes and the
// taper is 1 on-node, so recon(θ_k) = c_k for any aperture; only the between-node
// interpolation tightens as halfW shrinks.
function reconstructKN(coeffs, theta, halfW) {
  const N = coeffs.length;
  let num = 0, den = 0;
  if (!halfW || halfW >= N / 2) {
    for (let k = 0; k < N; k++) { const w = kernelKN(theta - itemTheta(k, N), N); num += coeffs[k] * w; den += w; }
  } else {
    const c = (theta + Math.PI / 2) / Math.PI * N - 0.5;   // continuous centre in leaf-index units
    const lo = Math.floor(c - halfW), hi = Math.ceil(c + halfW);
    for (let j = lo; j <= hi; j++) {
      const x = (j - c) / halfW;                            // −1 … 1 across the aperture
      if (x <= -1 || x >= 1) continue;
      const taper = 0.5 * (1 + Math.cos(Math.PI * x));      // Hann: 1 at centre → 0 (flat) at edge
      const k = ((j % N) + N) % N;                          // cyclic (period-π horizon closure)
      const w = kernelKN(theta - itemTheta(k, N), N) * taper;
      num += coeffs[k] * w; den += w;
    }
  }
  if (Math.abs(den) < 1e-12) return 0;
  return num / den;
}

// Bounded-observer aperture half-width (leaves per side). ap = 1 → N/2 (the full
// unbounded sum). In fisheye mode it narrows toward the horizon by acuity
// cos²(θ − gaze): widest at the gaze, tightening to the edges.
function apertureHalf(theta) {
  const N = state.N;
  let h = state.ap * N / 2;
  if (state.fisheye) {
    let d = theta - state.theta;
    while (d >  Math.PI / 2) d -= Math.PI;
    while (d <= -Math.PI / 2) d += Math.PI;
    h *= Math.cos(d) * Math.cos(d);
  }
  return Math.max(1.2, Math.min(N / 2, h));
}

function l2Error(trueFn, coeffs) {
  // Integrated squared error between the K_N reconstruction (through the
  // bounded-observer aperture) and the true curve, sampled densely.
  const n = 2000;
  let ss = 0;
  for (let i = 0; i < n; i++) {
    const t = -Math.PI/2 + 1e-4 + (i + 0.5) * (Math.PI - 2e-4) / n;
    const d = trueFn(t) - reconstructKN(coeffs, t, apertureHalf(t));
    ss += d * d;
  }
  return Math.sqrt(ss / n);
}

// ═══ BRIDGE THEOREM panel — a continuous curve f(θ) on the arc, sampled into N
// leaf coefficients c_k = f(θ_k), reconstructed continuously by K_N through the
// bounded-observer aperture. Blue = the true curve; gold = the K_N recon; stems
// = the N leaf coefficients (rung-coloured, focal leaf haloed). Ported from the
// bridge.html demo; drives off this file's CURVES / state / rungColorForTheta. ═══
// Bottom chart in the WAVE'S value frame: a value v sits at cx + R·v (identical
// to the number line and the wave), and state.wavePan slides the world under a
// fixed centre. The curve is read as a function of VALUE, g(v) = f(atan v), so
// it extends both directions with no θ-box clamp — panning reveals farther
// values. Blue = the true curve, gold = the K_N reconstruction, stems/dots =
// the N leaf coefficients (sample points on the curve, rung-coloured, focal
// leaf haloed, leaves inside the aperture bright). Minimal chrome, like the wave.
function drawBridgeTheorem(R, cx, dpr, yTop) {
  // The bridge reconstructs the SAME function the wave draws. That function is
  // value-domain, f(x); the bridge samples it at the number-line rung positions
  // (value = tan θ_k) by using curveFn(θ) = f(tan θ), so its true curve in the
  // value frame is exactly f(value) — the wave — with the K_N recon overlaid.
  const vf = currentValueFn();
  const curveFn = t => vf(Math.tan(t));
  const coeffs = leafCoefficients(curveFn);
  const err = l2Error(curveFn, coeffs);
  const W = canvas.width, H = canvas.height;
  const N = coeffs.length;

  const valToPx = v => cx + R * v;
  const pxToVal = px => (px - cx) / R;
  const panShift = state.wavePan || 0;
  const thetaOf = v => Math.atan(v);              // value → angle (the number line's own map)
  const gazeTheta = Math.atan(panShift);           // the value under centre = the gaze
  const halfApTheta = state.ap * (Math.PI / 2);

  const panelTop = yTop + 8 * dpr, panelBot = H - 20 * dpr;
  const panelH = panelBot - panelTop;
  if (panelH < 50 * dpr) return;

  // vertical range from the VISIBLE stretch of the curve (+ on-screen leaves),
  // so steep value-domain functions don't blow the scale up off-screen.
  let yMin = Infinity, yMax = -Infinity;
  for (let px = 0; px <= W; px += 6) {
    const v = curveFn(thetaOf(pxToVal(px) + panShift));
    if (isFinite(v)) { if (v < yMin) yMin = v; if (v > yMax) yMax = v; }
  }
  for (let k = 0; k < N; k++) {
    const px = valToPx(Math.tan(itemTheta(k, N)) - panShift);
    if (px < 0 || px > W) continue;
    const c = coeffs[k]; if (isFinite(c)) { if (c < yMin) yMin = c; if (c > yMax) yMax = c; }
  }
  if (!(yMax > yMin)) { yMin = -1; yMax = 1; }
  const yPad = Math.max((yMax - yMin) * 0.12, 0.05);
  yMin -= yPad; yMax += yPad;
  if (yMin > 0) yMin = 0;
  if (yMax < 0) yMax = 0;
  const valToPy = v => panelTop + (1 - (v - yMin) / (yMax - yMin)) * panelH;

  // zero baseline (subtle, spans the panel)
  if (0 > yMin && 0 < yMax) {
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(0, valToPy(0)); ctx.lineTo(W, valToPy(0)); ctx.stroke();
  }

  // true curve g(v) = f(atan v), faint blue
  ctx.strokeStyle = 'rgba(106,147,204,0.35)'; ctx.lineWidth = 1.6 * dpr;
  ctx.beginPath(); let first = true;
  for (let px = 0; px <= W; px += 2) {
    const v = curveFn(thetaOf(pxToVal(px) + panShift));
    if (!isFinite(v)) { first = true; continue; }
    const y = valToPy(v); first ? (ctx.moveTo(px, y), first = false) : ctx.lineTo(px, y);
  }
  ctx.stroke();

  // K_N reconstruction (gold) — through the bounded-observer aperture
  ctx.strokeStyle = 'rgba(212,160,67,0.95)'; ctx.lineWidth = 2.0 * dpr;
  ctx.beginPath(); first = true;
  for (let px = 0; px <= W; px += 2) {
    const th = thetaOf(pxToVal(px) + panShift);
    const v = reconstructKN(coeffs, th, apertureHalf(th));
    if (!isFinite(v)) { first = true; continue; }
    const y = valToPy(v); first ? (ctx.moveTo(px, y), first = false) : ctx.lineTo(px, y);
  }
  ctx.stroke();

  // centre line (fixed) — the observer's home column
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5 * dpr;
  ctx.setLineDash([4 * dpr, 4 * dpr]);
  ctx.beginPath(); ctx.moveTo(cx, panelTop); ctx.lineTo(cx, panelBot); ctx.stroke();
  ctx.setLineDash([]);

  // focal leaf — nearest θ_k to the gaze
  let fIdx = 0, fDist = Infinity;
  for (let k = 0; k < N; k++) { const d = Math.abs(itemTheta(k, N) - gazeTheta); if (d < fDist) { fDist = d; fIdx = k; } }
  const fClose = fDist < (Math.PI / N) * 0.5;

  // leaves — sample points (tan θ_k, c_k) on the curve, translating with the pan
  for (let k = 0; k < N; k++) {
    const th = itemTheta(k, N);
    const px = valToPx(Math.tan(th) - panShift);
    if (px < -30 * dpr || px > W + 30 * dpr) continue;
    let d = th - gazeTheta; while (d > Math.PI/2) d -= Math.PI; while (d <= -Math.PI/2) d += Math.PI;
    const inWin = Math.abs(d) <= halfApTheta;
    const isFocal = (k === fIdx) && fClose;
    const py = valToPy(coeffs[k]);
    ctx.strokeStyle = rungColorForTheta(th, isFocal ? 0.85 : (inWin ? 0.45 : 0.16));
    ctx.lineWidth = (isFocal ? 1.5 : 1) * dpr;
    ctx.beginPath(); ctx.moveTo(px, valToPy(0)); ctx.lineTo(px, py); ctx.stroke();
    if (isFocal) { ctx.fillStyle = rungColorForTheta(th, 0.30); ctx.beginPath(); ctx.arc(px, py, 8 * dpr, 0, 2*Math.PI); ctx.fill(); }
    ctx.fillStyle = rungColorForTheta(th, isFocal ? 1.0 : (inWin ? 0.95 : 0.55));
    ctx.beginPath(); ctx.arc(px, py, (isFocal ? 4.5 : 3) * dpr, 0, 2*Math.PI); ctx.fill();
  }

  // white current-position dot — where the curve crosses the centre line
  {
    const v = curveFn(gazeTheta);
    if (isFinite(v)) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, valToPy(v), 5 * dpr, 0, 2*Math.PI); ctx.fill(); }
  }

  // compact caption — the theorem's readout, unobtrusive
  const Kgaze = Math.min(N, Math.round(2 * apertureHalf(gazeTheta)));
  ctx.font = `${10 * dpr}px 'Courier New', monospace`; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = state.fisheye ? 'rgba(120,210,255,0.85)' : 'rgba(139,132,119,0.85)';
  ctx.fillText(state.fisheye
    ? `fisheye · ${Kgaze}/${N} leaves at the gaze`
    : `bounded observer · ${Kgaze}/${N} leaves per query · N=${N}`, 12 * dpr, H - 7 * dpr);
  ctx.textAlign = 'right';
  ctx.fillStyle = err < 1e-10 ? 'rgba(127,176,105,0.85)' : 'rgba(212,160,67,0.85)';
  ctx.fillText(err < 1e-10 ? 'L² error = 0 · recon = f' : `L² error = ${err.toExponential(2)}`, W - 12 * dpr, H - 7 * dpr);
}
// Optimized: Math.clz32 reads the IEEE 754 exponent field — O(1) integer op
// rung = floor(log2(|x|)) + 1 = 32 - clz32(floor(|x|)) for |x| < 2^32
function rungOf(x) {
  const a = Math.abs(x);
  if (a < 1) return 0;
  if (!isFinite(a)) return Infinity;
  if (a < 4294967296) return 32 - Math.clz32(a | 0);
  return Math.floor(Math.log2(a)) + 1; // fallback >2^32
}
// Rung colour shared by top projection chart and bottom recovered chart
// Color palette by integer band. Bands 0-6 hand-picked; bands 7+ generated
// programmatically by hue rotation so each band has a distinct color.
const BAND_BASE_RGB = [
  '100,200,255',  // 0: cyan
  '255,180,80',   // 1: gold
  '200,130,255',  // 2: purple
  '127,176,105',  // 3: green
  '255,100,100',  // 4: red
  '255,140,40',   // 5: orange
  '255,120,200',  // 6: pink
];
// Generated colors for bands 7, 8, 9, ... using HSL with a hue offset.
const _bandColorCache = new Map();
function bandColorRGB(band) {
  if (band < BAND_BASE_RGB.length) return BAND_BASE_RGB[band];
  if (_bandColorCache.has(band)) return _bandColorCache.get(band);
  // Hue rotates around the wheel; saturation/lightness moderate.
  const hue = (band * 47) % 360;          // 47° step gives good spread
  const sat = 70;                         // %
  const light = 65;                       // %
  // Convert HSL to RGB
  const h = hue / 360, s = sat / 100, l = light / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h * 6) % 2) - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (h < 1/6) { r = c; g = x; b = 0; }
  else if (h < 2/6) { r = x; g = c; b = 0; }
  else if (h < 3/6) { r = 0; g = c; b = x; }
  else if (h < 4/6) { r = 0; g = x; b = c; }
  else if (h < 5/6) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  const R = Math.round((r + m) * 255);
  const G = Math.round((g + m) * 255);
  const B = Math.round((b + m) * 255);
  const rgb = `${R},${G},${B}`;
  _bandColorCache.set(band, rgb);
  return rgb;
}

// Legacy alias used elsewhere — return the array of base colors for callers
// that index into it. For arc rendering and tick rendering, use bandColorRGB(band)
// directly so unbounded bands work.
const RUNG_COLORS_RGB = BAND_BASE_RGB;

// Band of |x|: integer floor. No clamp — works for arbitrarily large |x|.
function bandOf(x) {
  const a = Math.abs(x);
  if (!isFinite(a)) return 1000;
  return Math.floor(a);
}

// Draw the semicircular arc as a single white stroke.
function drawRungArc(cx, cy_arc, R, dpr) {
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 2.7*dpr;
  ctx.beginPath();
  ctx.arc(cx, cy_arc, R, Math.PI, 2 * Math.PI, false);
  ctx.stroke();
}

// Half of the inscribed square, drawn inside the arc. The full square would
// have vertices at the ±45° unit corners (on the arc) and at ±135°; we show
// only the top half: the top edge between the two ±45° corners and the two
// side edges dropping to the horizontal midline (y = cy_arc). The two side
// edges are rung-coloured to match the arc; gold dots mark the unit corners.
function drawHalfInscribedSquare(cx, cy_arc, R, dpr) {
  const d = R * Math.SQRT1_2;                  // R·√2/2
  const TR = { x: cx + d, y: cy_arc - d };     // +45° corner (on arc)
  const TL = { x: cx - d, y: cy_arc - d };     // −45° corner (on arc)
  const MR = { x: cx + d, y: cy_arc };         // right side, at the midline
  const ML = { x: cx - d, y: cy_arc };         // left side, at the midline

  // Top edge between the two unit corners — the ray through a top-edge point
  // has |tan θ| < 1, so the whole edge is rung 0.
  ctx.lineWidth = 2.25 * dpr;
  ctx.strokeStyle = `rgba(${bandColorRGB(0)},0.85)`;
  ctx.beginPath(); ctx.moveTo(TL.x, TL.y); ctx.lineTo(TR.x, TR.y); ctx.stroke();

  // Side edges, rung-colored per segment. The ray at angle θ crosses a
  // vertical side at height h = d/|tan θ| above the midline, so rung r
  // (|tan| ∈ [2^(r−1), 2^r]) owns the segment h ∈ [d/2^r, d/2^(r−1)]:
  // each side is the dyadic ladder itself — rung 1 the top half, rung 2 the
  // next quarter, and so on, halving toward the midline (tan → ∞).
  ctx.lineWidth = 2.25 * dpr;
  const MAXR = 8;
  for (const sideX of [MR.x, ML.x]) {
    for (let r = 1; r <= MAXR; r++) {
      const hTop = d / Math.pow(2, r - 1);
      const hBot = (r === MAXR) ? 0 : d / Math.pow(2, r);
      ctx.strokeStyle = `rgba(${bandColorRGB(r)},0.85)`;
      ctx.beginPath();
      ctx.moveTo(sideX, cy_arc - hTop);
      ctx.lineTo(sideX, cy_arc - hBot);
      ctx.stroke();
    }
  }

  // Gold dots at the two unit corners (where the square touches the arc).
  ctx.fillStyle = '#ffd24a';
  [TR, TL].forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 4*dpr, 0, 2*Math.PI); ctx.fill(); });

  // (The 45° inscribed half-circle — the √2 cascade handoff — was drawn here
  // in light blue with its three tangency dots; removed per review.)
}

// The bare algebraic atom (v:h), drawn in place of the semicircle dome: the
// rise/run right triangle. The RUN h is the vertical reference leg from the arc
// centre up to the apex (value 0 on the chord); the RISE v is the horizontal leg
// along the chord out to the ball at chord-value tan θ; the hypotenuse is the
// pointing. Right angle at the apex; gold dots at the ±1 unit corners (|v|=|h|,
// the balance). r = v/h = tan θ is read directly off the two legs.
function drawAtomTriangle(ax, cy_arc, R, dpr, theta) {
  const W = canvas.width;
  const chord_y = cy_arc - R;
  const tanv = Math.tan(Math.max(-SAFE, Math.min(SAFE, theta)));
  const bxRaw = ax + R * tanv;
  const bx = Math.max(6 * dpr, Math.min(W - 6 * dpr, bxRaw));   // keep the ball on-screen at steep angles
  const O = { x: ax, y: cy_arc };        // arc centre
  const A = { x: ax, y: chord_y };       // apex — value 0 on the chord, right angle here
  const B = { x: bx, y: chord_y };       // ball — value tan θ on the chord

  // gold unit corners at ±1 (where |v| = |h|, the self-certified balance)
  ctx.fillStyle = '#ffd24a';
  [ax + R, ax - R].forEach(ux => {
    if (ux < -6 * dpr || ux > W + 6 * dpr) return;
    ctx.beginPath(); ctx.arc(ux, chord_y, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  });

  // run leg h: apex → centre, vertical (the shared reference)
  ctx.lineWidth = 2.4 * dpr;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.moveTo(O.x, O.y); ctx.lineTo(A.x, A.y); ctx.stroke();

  // rise leg v: apex → ball, horizontal along the chord (rung-coloured)
  ctx.strokeStyle = rungColorForTheta(theta, 0.9);
  ctx.lineWidth = 2.6 * dpr;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();

  // hypotenuse: centre → ball (the pointing)
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.8 * dpr;
  ctx.beginPath(); ctx.moveTo(O.x, O.y); ctx.lineTo(B.x, B.y); ctx.stroke();

  // right-angle mark at the apex
  const s = 7 * dpr, dir = (B.x >= A.x) ? 1 : -1;
  ctx.lineWidth = 1.2 * dpr; ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.moveTo(A.x, A.y + s); ctx.lineTo(A.x + dir * s, A.y + s); ctx.lineTo(A.x + dir * s, A.y);
  ctx.stroke();

  // centre dot
  ctx.beginPath(); ctx.arc(O.x, O.y, 2.5 * dpr, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();

  // leg labels
  ctx.font = `${12 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('h', O.x - 7 * dpr, (O.y + A.y) / 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = rungColorForTheta(theta, 0.95);
  if (Math.abs(B.x - A.x) > 14 * dpr) ctx.fillText('v', (A.x + B.x) / 2, A.y - 7 * dpr);
}
function rungColorForTheta(th, alpha) {
  // Color by the DYADIC RUNG (rung 0 = [-1,1], rung r = [2^(r-1), 2^r]),
  // matching the chord strip's paintBand indexing — NOT by the integer band
  // bandOf(x) = floor|x|, which uses the same palette with a different
  // meaning and puts green leaves on purple rungs.
  const tanV = Math.tan(Math.max(-SAFE, Math.min(SAFE, th)));
  return `rgba(${bandColorRGB(rungOf(tanV))},${alpha})`;
}

// ═══════════════════════════════════════════════════════════════════════════
// Shared helpers
// ═══════════════════════════════════════════════════════════════════════════
function resize() {
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  draw();
}
window.addEventListener('resize', resize);

function currentR() {
  const W = canvas.width, H = canvas.height;
  const dpr = devicePixelRatio;
  // Layout:
  //   rungs view  — top half is arc, bottom half is cascade dial.
  //                 Arc bottom at H/2 → R = H/4 - 40.
  //   tangent view — top ~1/3 is arc, bottom ~2/3 is tan plot.
  //                  Arc bottom at H/3 → R = H/6 - 30.
  //                  The smaller arc leaves more room for the tan plot,
  //                  whose curve genuinely benefits from extra vertical
  //                  pixels (the asymptotic climb fills the panel).
  const idealR = (state.viewMode === 'tangent' || state.viewMode === 'tangentAtom' || state.viewMode === 'tangentDial' || state.viewMode === 'tangentTwoDial')
    ? 1.5 * (H / 6 - 30 * dpr)
    : (H / 4 - 40 * dpr);
  const maxByWidth = (W - 80 * dpr) / 2;
  const minR = 30 * dpr;
  return Math.max(minR, Math.min(state.rScale * idealR, maxByWidth));
}
function itemTheta(i, N) {
  return -Math.PI / 2 + ((i + 0.5) / N) * Math.PI;
}
function inWindow(th, thetaC, halfAp) {
  return th >= thetaC - halfAp && th <= thetaC + halfAp;
}

// ═══════════════════════════════════════════════════════════════════════════
// Projection draw functions (tangent only)
// ═══════════════════════════════════════════════════════════════════════════
function drawProjection(R, cx, cy_arc, dpr) {
  drawTangent(R, cx, cy_arc, dpr);
}

// ═══ THE STANDARD NUMBER LINE — a global any panel can call for its top. ═══
// The original apparatus whole: chord + integer ticks + rung strip + the
// semicircle dome with its half-inscribed square + the dashed gaze ray + the
// ball — held CENTERED: the scene does not pan; the pointing swings to theta
// and the ball rides the chord at R·tan(theta). One value in, the classic
// picture out. (Implemented as drawTangent with a centered override, so the
// standard line and the panning line can never drift apart.)
function drawStandardNumberLine(R, cx, cy_arc, dpr, theta, plain) {
  // PANNABLE by default: the whole apparatus flows so the current value rides
  // under the dome — the open instrument's native motion. (The wave view still
  // pins its apparatus internally; anything needing a pinned line can pass
  // centered:true through drawTangent directly.)
  drawTangent(R, cx, cy_arc, dpr, { centered: false, theta: theta, plain: !!plain });
}

// ═══ THE STANDARD SLOPE CHART — the bottom tangent section, one global that
// BOTH slope-chart panels share (parallels drawStandardNumberLine for the top).
// The sideways tan θ curve with its dyadic rung bands, scaled to match the top
// chord (R px per slope unit) and panned to the same centre. Panels differ only
// in their TOP glyph (dome vs atom); the bottom section is this one function. ═══
function drawStandardSlopeChart(R, cx, dpr, yTop) {
  drawTangentPlot(R, cx, dpr, yTop);
}
// EVERY panel's top is the standard centered line (see draw()): dome where
// the value is a slope, plain where it is h. Drags drive the pointer
// directly everywhere except the wave, whose top drag pans the wave itself.
const STD_LINE_VIEWS = ['beam', 'atom', 'atoms2', 'atoms3', 'atoms4', 'inter', 'eight',
                        'vhd', 'vh3', 'sphere', 'fold', 'bridge', 'torus', 'scope',
                        'bouquet', 's3', 'aperture', 'tangent', 'vcu', 'vcf',
                        'cauchy', 'rungs', 'wave'];
function stdLinePlain() {
  return (state.viewMode === 'vh3' && state.curAtom === 'hVal') ||
         (state.viewMode === 'vhd' && state.curAtom === 'hVal') ||
         ['sphere', 'fold', 'bridge', 'torus', 'scope', 'bouquet', 's3', 'aperture']
           .indexOf(state.viewMode) >= 0;
}

// ═══ SHARED PANEL CONTROLS — one implementation each. ═══
function presetZonesAt(yTop) {
  const dpr = devicePixelRatio, W = canvas.width;
  return SHAPES2D.map((s, i) => ({ i, cx: W - 36 * dpr, cy: yTop + 24 * dpr + i * 42 * dpr, r: 15 * dpr }));
}
function playZoneAt(yTop, dy) {
  const dpr = devicePixelRatio;
  return { cx: 36 * dpr, cy: yTop + (dy === undefined ? 24 : dy) * dpr, r: 15 * dpr };
}
function drawPlayButton(z, dpr) {
  ctx.strokeStyle = state.vhdPlay ? 'rgba(242,180,95,0.8)' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.arc(z.cx, z.cy, z.r, 0, 2 * Math.PI); ctx.stroke();
  ctx.fillStyle = state.vhdPlay ? 'rgba(242,180,95,0.9)' : 'rgba(255,255,255,0.6)';
  if (state.vhdPlay) {
    ctx.fillRect(z.cx - 4.5 * dpr, z.cy - 5 * dpr, 3 * dpr, 10 * dpr);
    ctx.fillRect(z.cx + 1.5 * dpr, z.cy - 5 * dpr, 3 * dpr, 10 * dpr);
  } else {
    ctx.beginPath();
    ctx.moveTo(z.cx - 3.5 * dpr, z.cy - 5.5 * dpr);
    ctx.lineTo(z.cx - 3.5 * dpr, z.cy + 5.5 * dpr);
    ctx.lineTo(z.cx + 6 * dpr, z.cy);
    ctx.closePath(); ctx.fill();
  }
}
function drawPresets(zones, dpr) {
  for (const z of zones) {
    const on = z.i === state.shapeIdx;
    ctx.strokeStyle = on ? 'rgba(242,180,95,0.8)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.2 * dpr;
    ctx.beginPath(); ctx.arc(z.cx, z.cy, z.r, 0, 2 * Math.PI); ctx.stroke();
    ctx.strokeStyle = on ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const q = SHAPES2D[z.i].f((i % 60) / 60);
      const sx = z.cx + q.x * z.r * 0.38, sy = z.cy - q.y * z.r * 0.38;
      i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
    }
    ctx.stroke();
  }
}
function syncHFromLine() {   // the line → h write-through every h-view runs
  if (_lastSphTheta === null) _lastSphTheta = state.theta;
  if (state.theta !== _lastSphTheta) {
    _lastSphTheta = state.theta;
    const t = Math.max(-Math.PI / 2 + 1e-9, Math.min(Math.PI / 2 - 1e-9, state.theta));
    state.hVal = Math.max(-1e6, Math.min(1e6, Math.tan(t)));
  }
}

// ═══ THE STANDARD DIAL — the single atom's read circle, one global. ═══
// (§1.5's reading dial.) Corner (agreement, gold) at the top, glowing at
// balance — the one self-certified state; the seam (address glue, 0 ≡ ∞)
// at the bottom — blue dot for the address, red ring for the scar; home
// chart climbs the LEFT half (amber), horizon the RIGHT (blue), the live
// chart drawn brighter. The marker is the read min/max with the seam nudge:
// one address, two arrivals. Handles (0:0) honestly: dead dial, no marker.
// Returns { m, home }.
function drawAtomDial(cx0, cy0, r0, dpr, A, B, opts) {
  const o = opts || {};
  const fy = o.zeroTop ? -1 : 1;   // zeroTop: flip vertically → 0 ≡ ∞ on top, corner 1 on the bottom
  const a = Math.abs(A), b = Math.abs(B);
  const dead = (a === 0 && b === 0);
  const m = dead ? 0 : Math.min(a, b) / Math.max(a, b);
  const home = a <= b;
  const hot = 0.65, cold = o.current ? 0.30 : 0.22;
  if (o.current) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.6 * dpr;
    ctx.beginPath(); ctx.arc(cx0, cy0, r0 + 7 * dpr, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.lineWidth = 1.3 * dpr;
  if (o.rungColors) {
    // Colour the ring by the dyadic rung of |slope|, matching the number line.
    // Dial parameter u ∈ [0,1] (u=0 → seam 0≡∞, u=0.5 → corner, u=1 → seam):
    //   home half u∈[0,0.5] is |slope|≤1 → ALL rung 0 (one band, the LEFT side);
    //   horizon half u∈[0.5,1] is |slope|>1 → rungs 1,2,3… halving toward the ∞
    //   seam (the RIGHT side).
    const arcSeg = (uA, uB, rung) => {
      ctx.strokeStyle = `rgba(${bandColorRGB(rung)},${dead ? 0.15 : 0.85})`;
      ctx.beginPath();
      const steps = 22;
      for (let i = 0; i <= steps; i++) {
        const u = uA + (uB - uA) * (i / steps);
        const ang = Math.PI / 2 + u * 2 * Math.PI;
        const x = cx0 + r0 * Math.cos(ang);
        const y = cy0 + fy * r0 * Math.sin(ang);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    };
    ctx.lineWidth = 2.2 * dpr;
    arcSeg(0, 0.5, 0);                                    // home half — rung 0 (light blue), LEFT
    const MAXR = 8;
    for (let r = 1; r <= MAXR; r++) {
      const uLo = 1 - Math.pow(2, -r);
      const uHi = (r === MAXR) ? 1 : 1 - Math.pow(2, -(r + 1));
      arcSeg(uLo, uHi, r);                                // horizon rungs 1,2,3…, RIGHT
    }
  } else {
    ctx.strokeStyle = `rgba(242,180,95,${dead ? 0.15 : (home ? hot : cold)})`;
    ctx.beginPath(); ctx.arc(cx0, cy0, r0, Math.PI / 2, 3 * Math.PI / 2); ctx.stroke();
    ctx.strokeStyle = `rgba(100,200,255,${dead ? 0.15 : (home ? cold : hot)})`;
    ctx.beginPath(); ctx.arc(cx0, cy0, r0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  }
  const balanced = !dead && m > 0.98;
  if (balanced) {
    ctx.fillStyle = 'rgba(242,180,95,0.20)';
    ctx.beginPath(); ctx.arc(cx0, cy0 - fy * r0, 13 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.fillStyle = 'rgba(242,180,95,0.95)';
  ctx.beginPath(); ctx.arc(cx0, cy0 - fy * r0, (balanced ? 4.4 : 3.2) * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#64c8ff';
  ctx.beginPath(); ctx.arc(cx0, cy0 + fy * r0, 3.0 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(224,82,82,0.75)'; ctx.lineWidth = 1.1 * dpr;
  ctx.beginPath(); ctx.arc(cx0, cy0 + fy * r0, 6 * dpr, 0, 2 * Math.PI); ctx.stroke();
  if (o.arrivals) {
    ctx.lineWidth = 1 * dpr;
    ctx.strokeStyle = 'rgba(242,180,95,0.55)';
    ctx.beginPath(); ctx.moveTo(cx0 - 15 * dpr, cy0 + fy * (r0 + 9 * dpr)); ctx.lineTo(cx0 - 6 * dpr, cy0 + fy * (r0 + 3 * dpr)); ctx.stroke();
    ctx.strokeStyle = 'rgba(100,200,255,0.55)';
    ctx.beginPath(); ctx.moveTo(cx0 + 15 * dpr, cy0 + fy * (r0 + 9 * dpr)); ctx.lineTo(cx0 + 6 * dpr, cy0 + fy * (r0 + 3 * dpr)); ctx.stroke();
  }
  if (o.labels) {
    ctx.font = `${11 * dpr}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(242,180,95,0.9)';
    ctx.fillText('1', cx0, cy0 - fy * (r0 + 10 * dpr));
    ctx.fillStyle = 'rgba(100,200,255,0.9)';
    ctx.fillText('0 ≡ ∞', cx0, cy0 + fy * (r0 + 24 * dpr));
  }
  if (!dead && !o.noMarker) {
    const u = home ? m / 2 : 1 - m / 2;
    const ang = Math.PI / 2 + u * 2 * Math.PI;
    let px = cx0 + r0 * Math.cos(ang);
    const py = cy0 + fy * r0 * Math.sin(ang);
    if (m < 0.02) px += (home ? -6 : 6) * dpr;   // one address, two arrivals
    if (o.spoke !== false) {
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1 * dpr;
      ctx.beginPath(); ctx.moveTo(cx0, cy0); ctx.lineTo(px, py); ctx.stroke();
    }
    const mr = (o.markerR || 4.5) * dpr;
    ctx.fillStyle = o.markerColor || (home ? '#f2b45f' : '#64c8ff');
    ctx.beginPath(); ctx.arc(px, py, mr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(px, py, mr * 0.36, 0, 2 * Math.PI); ctx.fill();
  }
  return { m: m, home: home };
}

// Top-glyph: the atom's reading dial, drawn in place of the semicircle dome.
// Sized like the dome (radius R, top tangent to the number line), but centred on
// the CURRENT reading (screen centre) rather than pinned to the 0 tick — so it
// travels with the horizontal panning and stays under the ball instead of
// following 0 off-screen. Flipped (zeroTop) so 0 ≡ ∞ sits on top and the corner
// 1 at the bottom; ring rung-coloured (home light-blue left, rungs right). No
// text labels.
function drawTopAtomDial(cxScreen, cy_arc, R, dpr, theta) {
  drawAtomDial(cxScreen, cy_arc, R, dpr, Math.sin(theta), Math.cos(theta),
               { zeroTop: true, labels: false, arrivals: false, markerR: 4.8, current: false, rungColors: true, markerColor: '#ffffff' });
}

// Top-glyph: the semicircle dome as a fixed centred GAUGE (same treatment as the
// dial) — drawn at the screen centre with apex up and the ±1 unit corners, and a
// white marker riding the arc at the current pointing. It stays put while the
// number line scrolls under it, instead of being pinned to the 0 tick and
// drifting off-screen.
function drawTopDome(cxScreen, cy_arc, R, dpr, theta) {
  drawRungArc(cxScreen, cy_arc, R, dpr);
  drawHalfInscribedSquare(cxScreen, cy_arc, R, dpr);
  ctx.beginPath(); ctx.arc(cxScreen, cy_arc, 2.5 * dpr, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  // pointing marker on the arc at the current slope, with a spoke from the centre
  const t = Math.max(-SAFE, Math.min(SAFE, theta));
  const mx = cxScreen + R * Math.sin(t), my = cy_arc - R * Math.cos(t);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(cxScreen, cy_arc); ctx.lineTo(mx, my); ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(mx, my, 4.8 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#03040c'; ctx.beginPath(); ctx.arc(mx, my, 1.7 * dpr, 0, 2 * Math.PI); ctx.fill();
}

// Top-glyph: TWO reading dials as a horizontal figure-eight — the negative-slope
// lobe on the left, the positive-slope lobe on the right, tangent at the centre
// where their 0 ≡ ∞ seams meet: that junction IS home/horizon. Each lobe is a
// rung-coloured dial (seam toward the junction, corner 1 at the outer edge); the
// white marker rides whichever lobe matches the current slope's sign. Centred
// gauge — stays put while the number line scrolls, like the single dial.
function drawTopTwoDials(cxScreen, cy_arc, R, dpr, theta) {
  const r = R * 0.6;
  const sinA = Math.abs(Math.sin(theta)), cosA = Math.abs(Math.cos(theta));
  const positive = theta >= 0;   // slope sign picks the active lobe
  const opts = { zeroTop: true, labels: false, arrivals: false, rungColors: true,
                 markerColor: '#ffffff', markerR: 4.6 };
  // right lobe (positive): seam rotated to the LEFT (toward the junction)
  ctx.save();
  ctx.translate(cxScreen + r, cy_arc); ctx.rotate(-Math.PI / 2);
  drawAtomDial(0, 0, r, dpr, sinA, cosA, Object.assign({ noMarker: !positive }, opts));
  ctx.restore();
  // left lobe (negative): seam rotated to the RIGHT (toward the junction)
  ctx.save();
  ctx.translate(cxScreen - r, cy_arc); ctx.rotate(Math.PI / 2);
  drawAtomDial(0, 0, r, dpr, sinA, cosA, Object.assign({ noMarker: positive }, opts));
  ctx.restore();
}

// Slope (derivative) of the current wave at the point sitting under the center
// line — worldX = wavePan. Central difference; used so the top chart's gaze can
// point at the tangent of the bottom curve.
function waveSlopeAtCenter() {
  const f = currentValueFn();
  const x = state.wavePan || 0;
  const h = 1e-3;
  return (f(x + h) - f(x - h)) / (2 * h);
}

// 2D view: each line is one atom — a rise vᵢ read against the shared run h.
// The resolved value min(|vᵢ|,|h|)/max(|vᵢ|,|h|) ∈ [0,1] is crash-proof by
// construction and reaches the corner exactly when |vᵢ| = |h|.
function atomRead(v, h) {
  const a = Math.abs(v), b = Math.abs(h);
  const M = Math.max(a, b);
  return M === 0 ? 0 : Math.min(a, b) / M;
}
function vhdResolved() {   // the top line's read (drives its white ball)
  return atomRead((state.vVal == null) ? 0.45 : state.vVal,
                  (state.hVal == null) ? 1.2 : state.hVal);
}

function drawTangent(R, cx, cy_arc, dpr, override) {
  const ov = override || null;
  const W = canvas.width;
  const chord_y = cy_arc - R;
  // In the continuous-wave view the gaze POINTS at the slope the wave is panned
  // to (thetaC = atan(wavePan)) — the focal ball and its ray swing to it — but
  // the apparatus itself (arc, chord, number line, rung strip) stays centered,
  // so only the pointing changes. In every other view the focal drives the gaze
  // AND pans the whole scene, as before.
  const inWave = !ov && (state.viewMode === 'wave');
  // 2D view, h current: h is a MAGNITUDE, not a slope — same number line, but
  // the slope-interpretation apparatus (dome, square, gaze ray) stays off.
  const plainLineAuto = (state.viewMode === 'vhd' && state.curAtom === 'hVal') ||
                    (state.viewMode === 'sphere') ||
                    (state.viewMode === 'fold') ||
                    (state.viewMode === 'bridge') ||
                    (state.viewMode === 'torus') ||
                    (state.viewMode === 'scope') ||
                    (state.viewMode === 'bouquet') ||
                    (state.viewMode === 's3') ||
                    (state.viewMode === 'aperture'); // in these views the line holds h
  const plainLine = ov ? !!ov.plain : plainLineAuto;
  // In the wave view the top chart POINTS at the slope of the wave where it
  // crosses the center line: the wave value under center is f(wavePan), and its
  // local slope there is f'(wavePan); the gaze angle is atan of that slope, so
  // the top's ray matches the tangent of the bottom curve. The apparatus stays
  // fixed — only the pointing tracks the wave's slope.
  const thetaC  = ov ? ov.theta
    : inWave
    ? Math.atan(waveSlopeAtCenter())   // atan maps any slope into (−90°,90°); no clamp — the line can point anywhere on the arc
    : state.theta;
  const halfAp  = state.ap * (Math.PI / 2);
  const N = state.N;

  // Apparatus shift: normally the scene pans so the focal sits at center. In the
  // wave view we suppress that shift (arcCx = cx) so the arc and number line
  // stay put while the pointer still swings to thetaC.
  const focalTan = Math.tan(Math.max(-SAFE, Math.min(SAFE, thetaC)));
  const arcCx = (inWave || (ov && ov.centered)) ? cx : cx - R * focalTan;

  const arcPt = th => ({ x: arcCx + R * Math.sin(th), y: cy_arc - R * Math.cos(th) });
  const chXOfX = xVal => arcCx + R * xVal;     // chord coord → screen x (linear)
  const chX = th => chXOfX(Math.tan(Math.max(-SAFE, Math.min(SAFE, th))));
  const onCh = th => Math.abs(th) < Math.PI / 4 + 1e-9;

  // Single uniform white chord line spanning the whole screen.
  ctx.lineWidth = 1.5*dpr;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.moveTo(0, chord_y); ctx.lineTo(W, chord_y); ctx.stroke();

  // ─── Rung rectangles on the chord ─────────────────────────────────────
  // The chord IS the tan axis. Paint the full dyadic rung structure as a
  // colored strip just below the chord, both sides, ALWAYS (independent of
  // the focal): rung 0 = [−1,1], rung 1 = [1,2] & [−2,−1], rung 2 = [2,4] &
  // [−4,−2], … each 2× wider than the last. Same palette and frame as the
  // wave view's strip below, so the two register and move together.
  {
    const rectH = 5 * dpr;             // height of the colored strip
    const rectY = chord_y + 2 * dpr;   // just below the chord line

    const paintBand = (vLo, vHi, rung) => {
      const pxL = arcCx + R * vLo;
      const pxR = arcCx + R * vHi;
      const clipL = Math.max(Math.min(pxL, pxR), 0);
      const clipR = Math.min(Math.max(pxL, pxR), W);
      if (clipR <= clipL) return;
      ctx.fillStyle = `rgba(${bandColorRGB(rung)},0.55)`;
      ctx.fillRect(clipL, rectY, clipR - clipL, rectH);
    };

    // Visible chord value range under the pan.
    const vLeft  = (0 - arcCx) / R;
    const vRight = (W - arcCx) / R;
    const maxAbs = Math.max(Math.abs(vLeft), Math.abs(vRight), 2);
    const maxRung = Math.ceil(Math.log2(maxAbs)) + 1;

    paintBand(-1, 1, 0);                         // rung 0 across the origin
    for (let rung = 1; rung <= maxRung; rung++) {
      const lo = Math.pow(2, rung - 1);
      const hi = Math.pow(2, rung);
      paintBand(lo, hi, rung);                   // positive side
      paintBand(-hi, -lo, rung);                 // negative side
    }
  }

  // Integer chord ticks across the entire visible chord. Each tick colored
  // by its integer band. Two-line label: integer value above, angle below.
  const tickH = 7*dpr;
  ctx.textAlign = 'center';

  // (τ half-slope and rung sub-labels removed; ticks now show the slope value.)

  // Visible chord range under the whole-scene pan: arcCx + R*v ∈ [0, W]
  // → v ∈ [(0 - arcCx)/R, (W - arcCx)/R]
  const vLeft  = Math.floor((0 - arcCx) / R) - 1;
  const vRight = Math.ceil((W - arcCx) / R) + 1;
  const tickColorFull = 'rgba(255,255,255,0.9)';
  const tickColorDim  = 'rgba(255,255,255,0.55)';
  // Value in normalized exponent form: v = ±m·2^e, with m∈[1,2) and
  // e = rung−1 = the MSB index (the read-not-computed exponent). The integer
  // is just its leading-bit position 2^e scaled by the mantissa left over.
  const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
  const trimNum = x => x.toFixed(3).replace(/\.?0+$/, '');
  const expForm = v => {
    if (v === 0) return '0';
    const a = Math.abs(v);
    const e = rungOf(a) - 1;
    const m = a / Math.pow(2, e);
    return (v < 0 ? '−' : '+') + trimNum(m) + '·2' + sup(e);
  };
  for (let v = vLeft; v <= vRight; v++) {
    const px = arcCx + R * v;
    if (px < -10*dpr || px > W + 10*dpr) continue;
    ctx.lineWidth = 2*dpr;
    ctx.strokeStyle = tickColorFull;
    ctx.beginPath(); ctx.moveTo(px, chord_y - tickH); ctx.lineTo(px, chord_y + tickH); ctx.stroke();
    // Value-with-exponent above (the number expressed as ±m·2^e)
    ctx.fillStyle = tickColorFull;
    ctx.font = `${15*dpr}px 'Courier New', monospace`;
    ctx.fillText(expForm(v), px, chord_y - 22*dpr);
    // Slope below (the chord value at this tick = tan θ = v itself), suppressed
    // at v = 0 to keep the dome center clear. τ and rung labels removed.
    if (v !== 0) {
      ctx.fillStyle = tickColorDim;
      ctx.font = `${14*dpr}px 'Courier New', monospace`;
      ctx.fillText(trimNum(v), px, chord_y + 30*dpr);
    }
  }

  // Top glyph: 'dome' (semicircle), 'atom' (v:h triangle), or 'dial' (reading
  // dial, 0 on top). Override wins (ov.glyph), else the global state.topGlyph.
  const topGlyph = (ov && ov.glyph) ? ov.glyph : state.topGlyph;
  if (!plainLine) {
    if (topGlyph === 'atom') {
      drawAtomTriangle(arcCx, cy_arc, R, dpr, thetaC);
    } else if (topGlyph === 'dial') {
      drawTopAtomDial(cx, cy_arc, R, dpr, thetaC);
    } else if (topGlyph === 'twodial') {
      drawTopTwoDials(cx, cy_arc, R, dpr, thetaC);
    } else {
      drawTopDome(cx, cy_arc, R, dpr, thetaC);   // centred gauge, stays put like the dial
    }
  }

  // Focal line: ray from arc center (arcCx, cy_arc) at angle θ from vertical.
  // Extends to canvas edges (top y=0 and bottom y=H/2). Crosses chord_y at
  // arcCx + R*tan(θ) = cx (screen center) — which is where the ball sits.
  // (Leaf-ray fan and chord dots removed from all views — only the single focal
  // pointing line is shown below.)

  const dirX = Math.sin(thetaC);
  const dirY = -Math.cos(thetaC);
  const halfH = canvas.height / 2;
  const tMaxes = [];
  if (dirX > 1e-9)  tMaxes.push((W - arcCx) / dirX);
  if (dirX < -1e-9) tMaxes.push(-arcCx / dirX);
  if (dirY < -1e-9) tMaxes.push(-cy_arc / dirY);
  if (dirY > 1e-9)  tMaxes.push((halfH - cy_arc) / dirY);
  const tMins = [];
  if (dirX > 1e-9)  tMins.push(-arcCx / dirX);
  if (dirX < -1e-9) tMins.push((W - arcCx) / dirX);
  if (dirY < -1e-9) tMins.push((halfH - cy_arc) / dirY);
  if (dirY > 1e-9)  tMins.push(-cy_arc / dirY);
  const tMax = Math.min(...tMaxes.filter(v => v > 0));
  const tMin = Math.max(...tMins.filter(v => v < 0));
  if (!plainLine && topGlyph === 'atom') {
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.8*dpr; ctx.setLineDash([6*dpr,4*dpr]);
    ctx.beginPath();
    ctx.moveTo(arcCx + tMin*dirX, cy_arc + tMin*dirY);
    ctx.lineTo(arcCx + tMax*dirX, cy_arc + tMax*dirY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Focal ball where the ray crosses the chord (arcCx + R·tan θ). At steep
  // angles that x flies off-screen, so clamp the DRAWN position to the visible
  // width — the line still points true, the ball just rides the edge.
  const ballXraw = arcCx + R * Math.tan(Math.max(-SAFE, Math.min(SAFE, thetaC)));
  const ballX = Math.max(6*dpr, Math.min(W - 6*dpr, ballXraw));
  ctx.beginPath(); ctx.arc(ballX, chord_y, 5*dpr, 0, 2*Math.PI);
  ctx.fillStyle = plainLine ? '#64c8ff' : '#ffffff';
  ctx.fill();

  // v/d·h/d view: the TOP line is h's — the held reading (filled amber) and
  // its projection h/d (hollow), slid by the shared depth. v lives on its own
  // copy of this line at the bottom of the screen (drawVHD). The white ball
  // and dashed ray are the atom's resolved value min(|h|,|v|)/max(|h|,|v|) —
  // unchanged by d, because the read is scale-free: (h/d)/(v/d) = h/v.
}


// ═══════════════════════════════════════════════════════════════════════════
// Curve overlay — f(θ) wrapped radially around the arc
// ═══════════════════════════════════════════════════════════════════════════
function drawCurveOverlay(R, cx, cy_arc, dpr) {
  const curve = currentCurve();
  const param = currentParam();
  const N = state.N;
  const thetaC = (state.viewMode === 'wave')
    ? Math.atan(waveSlopeAtCenter())   // atan maps any slope into (−90°,90°); no clamp — the line can point anywhere on the arc
    : state.theta;
  const halfAp = state.ap * (Math.PI / 2);

  const envelope = R * 0.35;
  const nSamp = 400;
  let fMax = 0;
  for (let i = 0; i <= nSamp; i++) {
    const t = -Math.PI/2 + 1e-3 + i * (Math.PI - 2e-3) / nSamp;
    const v = curve.f(t, param);
    if (isFinite(v)) fMax = Math.max(fMax, Math.abs(v));
  }
  if (fMax < 1e-6) fMax = 1;
  const fScale = envelope / fMax;

  function arcPt(theta, radial) {
    const r = R + (radial || 0);
    return { x: cx + r * Math.sin(theta), y: cy_arc - r * Math.cos(theta) };
  }

  // Fill between arc and curve
  ctx.fillStyle = 'rgba(180, 100, 255, 0.08)';
  ctx.beginPath();
  for (let i = 0; i <= nSamp; i++) {
    const t = -Math.PI/2 + 1e-3 + i * (Math.PI - 2e-3) / nSamp;
    const p = arcPt(t, 0);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  for (let i = nSamp; i >= 0; i--) {
    const t = -Math.PI/2 + 1e-3 + i * (Math.PI - 2e-3) / nSamp;
    const v = curve.f(t, param);
    const p = arcPt(t, isFinite(v) ? v * fScale : 0);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath(); ctx.fill();

  // Curve trace
  ctx.strokeStyle = 'rgba(200, 130, 255, 0.90)';
  ctx.lineWidth = 2.0 * dpr;
  ctx.beginPath();
  for (let i = 0; i <= nSamp; i++) {
    const t = -Math.PI/2 + 1e-3 + i * (Math.PI - 2e-3) / nSamp;
    const v = curve.f(t, param);
    const p = arcPt(t, isFinite(v) ? v * fScale : 0);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // Per-item ticks
  for (let i = 0; i < N; i++) {
    const th = itemTheta(i, N);
    const v  = curve.f(th, param);
    if (!isFinite(v)) continue;
    const inWin = inWindow(th, thetaC, halfAp);
    const aArc  = arcPt(th, 0);
    const aCurve = arcPt(th, v * fScale);
    const alpha = inWin ? 0.50 : 0.16;
    ctx.strokeStyle = `rgba(200, 130, 255, ${alpha})`;
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(aArc.x, aArc.y); ctx.lineTo(aCurve.x, aCurve.y); ctx.stroke();
    ctx.fillStyle = `rgba(200, 130, 255, ${inWin ? 0.95 : 0.32})`;
    ctx.beginPath(); ctx.arc(aCurve.x, aCurve.y, (inWin ? 2.4 : 1.6) * dpr, 0, 2*Math.PI); ctx.fill();
  }

  // Focus marker
  const fv = curve.f(thetaC, param);
  if (isFinite(fv)) {
    const fArc   = arcPt(thetaC, 0);
    const fCurve = arcPt(thetaC, fv * fScale);
    ctx.strokeStyle = 'rgba(212, 160, 67, 0.85)';
    ctx.lineWidth = 1.8 * dpr;
    ctx.beginPath(); ctx.moveTo(fArc.x, fArc.y); ctx.lineTo(fCurve.x, fCurve.y); ctx.stroke();
    ctx.fillStyle = '#c87fff'; ctx.strokeStyle = 'rgba(212,160,67,1.0)'; ctx.lineWidth = 1.8*dpr;
    ctx.beginPath(); ctx.arc(fCurve.x, fCurve.y, 5*dpr, 0, 2*Math.PI); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(212,160,67,0.90)'; ctx.font = `${15*dpr}px 'Courier New',monospace`;
    ctx.textAlign = thetaC >= 0 ? 'left' : 'right'; ctx.textBaseline = 'middle';
    const dir = thetaC >= 0 ? 1 : -1;
    ctx.fillText(`f(θ) = ${fv.toFixed(4)}`, fCurve.x + dir*10*dpr, fCurve.y - 10*dpr);
    ctx.textBaseline = 'alphabetic';
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Tangent plot panel — alternative bottom view
// ═══════════════════════════════════════════════════════════════════════════
// Plots y = tan θ over θ ∈ (−π/2, +π/2), with vertical asymptotes at the
// arc's endpoints. Leaves on the arc are connected to corresponding points
// on the tangent curve by vertical drop-lines — making the dual visible:
// the semicircle and the tangent curve are the same data in two coordinate
// systems, sharing the θ axis.
//
// The plot is panned to match the arc's panned arcCx (whole-scene pan in
// drawTangent), so drop-lines remain purely vertical regardless of focal.
function drawTangentPlot(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const thetaC = state.theta;
  const SAFE_LOCAL = Math.PI/2 - 1e-6;
  const N = state.N;

  // Match the panned arc center used in drawTangent
  const focalTan = Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, thetaC)));
  const pan = -R * focalTan;
  const arcCx = cx + pan;

  // ─── Layout (turned sideways: the tan value follows a horizontal number line) ──
  // HORIZONTAL axis: tan θ value, signed — the number line. tan = 0 sits at
  // the canvas centre (W/2); positive extends right, negative left, sweeping
  // toward ±∞ as θ → ±π/2. Symmetric so ±1 (the 45° threshold) is at a known
  // offset on either side of centre.
  const panelTop = yTop;                 // touch the arc boundary directly
  const panelBot = H - 14 * dpr;         // tight bottom — minimal margin
  const panelH = panelBot - panelTop;
  const slopeMax = 8;                    // half-window width in tan units (ref-dot clamp only)
  // Horizontal scale MATCHES the top chord: R pixels per slope unit, panned so the
  // current value sits at centre — so the bottom chart's dyadic rung bands line up
  // exactly with the top number line's rung bands (both slope-chart panels).
  const pxPerUnit = R;
  // The number line PANS with the focal: the current value tan(θ_C) is placed
  // at screen centre and stays visible, exactly as the chord/arc pan the focal
  // projection to centre. Origin (tan = 0) therefore shifts as the focal moves.
  const valToPx = s => W / 2 + (s - focalTan) * pxPerUnit;

  // VERTICAL axis: θ ∈ (−π/2, +π/2) running DOWN the panel. θ = 0 at the
  // vertical centre; θ = −π/2 at the top, θ = +π/2 at the bottom. The curve
  // is the classic sideways tangent: a single stroke through the centre that
  // bends out to the left and right horizons.
  const thetaBaselineY = panelTop + panelH / 2;
  const thetaToPy = th => thetaBaselineY + (th / (Math.PI/2)) * (panelH / 2);

  // Compatibility shims for the rest of the routine, now axis-swapped:
  //   a curve point at angle `th` with value `s = tan th` sits at
  //   ( valToPx(s), thetaToPy(th) ).
  const thetaToPx = th => valToPx(Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, th))));
  const slopeYAt  = s  => thetaBaselineY;  /* replaced by thetaToPy in swapped layout */

  // (number-line value labels removed)


  // ─── Full rung structure ──────────────────────────────────────────────
  // Paint the complete dyadic band structure of the tan axis, both sides,
  // always — independent of the focal. Rung 0 = |x|∈[0,1], rung 1 = [1,2],
  // rung 2 = [2,4], … each band 2× wider than the previous, mirrored about
  // the origin. Colored by bandColorRGB(rung), all bands at one constant
  // alpha (matching the top arc's banding — no active-band highlight).
  {
    const yTopBand = panelTop;
    const stripH = panelBot - panelTop;
    const BAND_ALPHA = 0.55;

    if (stripH > 0) {
      // Visible value window (panned): valToPx(s)∈[0,W] ⟺ s∈[focalTan−range, focalTan+range].
      const range = (W / 2) / pxPerUnit;
      const sMin = focalTan - range, sMax = focalTan + range;
      const maxRungVisible = Math.ceil(Math.log2(Math.max(2, Math.abs(sMin), Math.abs(sMax)))) + 1;

      const drawBand = (xLoVal, xHiVal, sideSign, rung) => {
        const lo = sideSign > 0 ? xLoVal : -xHiVal;
        const hi = sideSign > 0 ? xHiVal : -xLoVal;
        let pxA = valToPx(lo), pxB = valToPx(hi);
        const left = Math.max(0, Math.min(pxA, pxB));
        const right = Math.min(W, Math.max(pxA, pxB));
        if (right <= left) return;
        ctx.fillStyle = `rgba(${bandColorRGB(rung)},${BAND_ALPHA})`;
        ctx.fillRect(left, yTopBand, right - left, stripH);
      };

      // Rung 0 spans [−1,1] across the origin — paint as one centred band.
      {
        let pxA = valToPx(-1), pxB = valToPx(1);
        const left = Math.max(0, Math.min(pxA, pxB));
        const right = Math.min(W, Math.max(pxA, pxB));
        if (right > left) {
          ctx.fillStyle = `rgba(${bandColorRGB(0)},${BAND_ALPHA})`;
          ctx.fillRect(left, yTopBand, right - left, stripH);
        }
      }
      // Rungs 1..maxRungVisible on both sides.
      for (let rung = 1; rung <= maxRungVisible; rung++) {
        const xLoVal = Math.pow(2, rung - 1);
        const xHiVal = Math.pow(2, rung);
        drawBand(xLoVal, xHiVal, +1, rung);   // positive side
        drawBand(xLoVal, xHiVal, -1, rung);   // negative side
      }
    }
  }

  // ─── The tan θ curve (sideways) ───────────────────────────────────────
  // θ runs down the panel; the tan value runs left/right along the number
  // line. Sample in VALUE space — evenly across the visible value window —
  // and recover θ = atan(value). This keeps the curve spanning the full
  // width and always drawn at any focal (sampling in θ instead would put
  // vanishingly few points in the window once the focal pans out to large
  // values, and eventually none — the curve would disappear).
  ctx.strokeStyle = 'rgba(255,200,120,0.95)';
  ctx.lineWidth = 2*dpr;
  ctx.beginPath();
  const steps = 2000;
  const range = (W / 2) / pxPerUnit;            // half-window in tan units
  const sMin = focalTan - range, sMax = focalTan + range;
  for (let i = 0; i <= steps; i++) {
    const s = sMin + (sMax - sMin) * (i / steps);
    const th = Math.atan(s);                     // principal branch, always in (−π/2, π/2)
    const px = valToPx(s);                       // spans 0..W by construction
    const py = thetaToPy(th);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // ─── Leaf connection lines — the dual visualization ───────────────────
  // For each leaf at angle θ_k on the arc, draw a vertical line from the
  // arc point down to the corresponding point on the tangent curve.
  // The arc point is at (arcCx + R·sin θ, cy_arc - R·cos θ); the tan-plot
  // point is at (arcCx + R·sin θ, slopeYAt(tan θ)). Same x-pixel — the
  // dual is direct.
  //
  // We also dot the leaf at its tangent-curve position (gold) to make
  // the leaves visible on both curves.
  //
  // Leaves within the focal aperture window are drawn at higher opacity
  // (matching the arc's visual emphasis on the inside-view aperture).
  // ─── Leaf dots — the dual visualization ─────────────────────────────
  // For each leaf at angle θ_k on the arc, place a dot on the tan curve
  // at the corresponding (θ_k, tan θ_k) point. The arc point and the
  // tan-curve point share the same x-pixel (both at arcCx + R·sin θ),
  // making the dual direct without any explicit connecting line.
  //
  // Leaves within the focal aperture window are drawn at higher opacity
  // (matching the arc's visual emphasis on the inside-view aperture).
  // cy_arc_real is needed by the focal indicator below
  const cy_arc_real = 80 * dpr + R;

  // ─── Reference dots at fixed angles ──────────────────────────────────
  // Six dots marking ±π/4, ±π/3, ±π/2.5 on the tan curve. These are
  // geometric reference points: ±π/4 (rung-0/1 boundary, slope ±1),
  // ±π/3 (mid-rung-1, slope ±√3 ≈ ±1.73), ±π/2.5 (deeper, slope ≈ ±3.08,
  // mid-rung-2). Same gold as the curve.
  ctx.fillStyle = 'rgba(255,200,120,0.95)';
  const refAngles = [
    -Math.PI / 2.5, -Math.PI / 3, -Math.PI / 4,
     Math.PI / 4,    Math.PI / 3,  Math.PI / 2.5,
  ];
  for (const th of refAngles) {
    const tanV = Math.tan(th);
    if (Math.abs(tanV) > slopeMax) continue;
    const px = valToPx(tanV);
    const py = thetaToPy(th);
    ctx.beginPath();
    ctx.arc(px, py, 3.5 * dpr, 0, 2 * Math.PI);
    ctx.fill();
  }

  // ─── Focal indicator ──────────────────────────────────────────────────
  // The single dashed line connecting the two charts: from the focal
  // point on the arc down to its corresponding point on the tan curve.
  // This is the only guide line in the tangent view.
  if (Math.abs(thetaC) < SAFE_LOCAL) {
    const focalTanVal = Math.tan(thetaC);
    {
      const curvePx = valToPx(focalTanVal);   // = W/2 (panned to centre, always visible)
      const curvePy = thetaToPy(thetaC);
      // Arc focal point (still up on the arc)
      const arcFocalX = arcCx + R * Math.sin(thetaC);
      const arcFocalY = cy_arc_real - R * Math.cos(thetaC);
      // Dashed line from arc focal point to the tan-curve focal point. Suppressed
      // when the top glyph is a centred gauge (dome or dial) — its apparatus is at
      // screen centre, not out on the panned arc, so there is nothing to anchor to.
      if (state.topGlyph === 'atom') {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.setLineDash([4*dpr, 4*dpr]);
        ctx.lineWidth = 1.5*dpr;
        ctx.beginPath();
        ctx.moveTo(arcFocalX, arcFocalY);
        ctx.lineTo(curvePx, curvePy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      // Marker on the tan curve (white dot only — no text readout)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(curvePx, curvePy, 5*dpr, 0, 2*Math.PI);
      ctx.fill();
    }
  }
}


// ═══════════════════════════════════════════════════════════════════════════
// Cascade panel
// ═══════════════════════════════════════════════════════════════════════════
function drawCascade(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const thetaC = state.theta;
  const SAFE_LOCAL = Math.PI/2 - 1e-6;
  const focalTan = Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, thetaC)));

  // Build the cascade trace: at each rung, the current value (signed).
  // Halve repeatedly until |value| < 1 (caught).
  const trace = [];
  let local = focalTan, r = 0;
  const maxTrace = Math.max(state.depth, 1);
  while (r <= maxTrace) {
    const caught = Math.abs(local) < 1;
    trace.push({ rung: r, value: local, caught });
    if (caught) break;
    if (r === maxTrace) break;
    local = local / 2;
    r++;
  }
  const final = trace[trace.length - 1];
  const finalRung = final.rung;
  const finalChord = final.value;
  const totalRows = trace.length;

  // ─── Layout ──────────────────────────────────────────────────────────────
  const DIAL_MAX_W = 720 * dpr;
  const ROW_H = 24 * dpr;
  const headerH = 64 * dpr;
  const innerY = yTop + headerH;
  const dialBottomY = H - 12 * dpr;
  const availH = dialBottomY - innerY;
  const dialW = Math.min(DIAL_MAX_W, W - 40 * dpr);
  const dialX0 = Math.floor((W - dialW) / 2);
  const vc = innerY + availH / 2;  // vertical center of the dial

  // ─── Header: value · angle · rung ────────────────────────────────────────
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `${20 * dpr}px 'Courier New',monospace`;
  const valueStr = focalTan.toFixed(4);
