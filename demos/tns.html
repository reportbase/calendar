  const halfSlopeStr = (focalTan/(1+Math.sqrt(1+focalTan*focalTan))).toFixed(4);
  const headerY = yTop + 32 * dpr;
  const colW = dialW / 3;
  ctx.fillText(`slope  ${valueStr}`, dialX0, headerY);
  ctx.fillText(`½-slope  ${halfSlopeStr}`, dialX0 + colW, headerY);
  ctx.fillText(`rung   ${finalRung}`, dialX0 + 2 * colW, headerY);
  ctx.textBaseline = 'alphabetic';

  // ─── Wheel mechanics (adapted from Sound of Numbers) ─────────────────────
  // size = number of rungs in the cascade
  // PSI = 2/π
  // ROW_H = pixel height per row at center
  // EXP_EXTENT = ROW_H / PSI = total tan-extent per row
  // extent = total vertical span of the wheel = size × EXP_EXTENT × PSI
  // ai = π / size  (angular slot per row)
  // vProject(e, angle) = ((tan(angle + e·π/size) + 1) * 0.5) * extent − extent/2
  const PSI = 2 / Math.PI;
  const size = totalRows;
  const EXP_EXTENT = ROW_H / PSI;
  const extent = size * EXP_EXTENT * PSI;
  const co = extent * 0.5;
  const ai = Math.PI / size;
  const angle = state.cascadeAngle;

  function vProject(e) {
    return ((Math.tan(angle + e * ai) + 1) * 0.5) * extent - co;
  }
  function vGetCentered() {
    const idx = Math.round(-angle * size / Math.PI);
    return ((idx % size) + size) % size;
  }
  const centered = vGetCentered();

  // Center indicator (faint horizontal line at vc, full dial width)
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath();
  ctx.moveTo(dialX0, vc);
  ctx.lineTo(dialX0 + dialW, vc);
  ctx.stroke();

  // Render each rung at its tan-projected vertical position. Skip rows that
  // fall outside the visible dial area.
  // Layout within row:
  //   [rung label gutter (90px)] [value (220px)] [status (rest)]
  const gutterW = 90 * dpr;
  const valueW = 220 * dpr;
  const statusX0 = dialX0 + gutterW + valueW;

  // Sort rendering so the centered row draws last (on top of any overlaps).
  const renderOrder = [];
  for (let i = 0; i < size; i++) renderOrder.push(i);
  renderOrder.sort((a, b) => (a === centered) - (b === centered));

  for (const i of renderOrder) {
    const step = trace[i];
    const sy = vc + vProject(i);
    if (!isFinite(sy)) continue;
    if (sy < innerY - ROW_H || sy > dialBottomY + ROW_H) continue;
    const rowY = sy - ROW_H / 2;
    const yMid = sy;
    const rungRGB = bandColorRGB(step.rung);
    const isCentered = i === centered;
    const isCatch = step.caught;

    // Row background tint (catch row brightest, centered second, others faint)
    let bgAlpha = 0.05;
    if (isCatch) bgAlpha = 0.22;
    else if (isCentered) bgAlpha = 0.14;
    ctx.fillStyle = `rgba(${rungRGB},${bgAlpha})`;
    ctx.fillRect(dialX0, rowY, dialW, ROW_H);

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(dialX0, rowY + ROW_H);
    ctx.lineTo(dialX0 + dialW, rowY + ROW_H);
    ctx.stroke();

    // Text alpha attenuates with distance from center (the tan-compression
    // pushes far-from-center rows close to the edges, which is naturally
    // visual, but we also dim them to emphasize the centered row)
    const distFromCenter = Math.abs(sy - vc) / (availH / 2);
    const fade = Math.max(0.4, 1 - distFromCenter * 0.6);

    // Rung label (left gutter)
    ctx.fillStyle = `rgba(${rungRGB},${0.95 * fade})`;
    ctx.font = `bold ${14 * dpr}px 'Courier New',monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`rung ${step.rung}`, dialX0 + 12 * dpr, yMid);

    // Value (and corresponding angle) at this rung — middle column
    ctx.fillStyle = `rgba(255,255,255,${0.92 * fade})`;
    ctx.font = `${13 * dpr}px 'Courier New',monospace`;
    const v = step.value;
    const vStr = Math.abs(v) < 0.001 || Math.abs(v) >= 10000
      ? v.toExponential(3)
      : v.toFixed(4);
    const aPi = Math.atan(v) / Math.PI;  // in (-0.5, +0.5)
    let aStr;
    if (v === 1)       aStr = '+π/4';
    else if (v === -1) aStr = '−π/4';
    else if (v === 0)  aStr = '0';
    else               aStr = (aPi >= 0 ? '+' : '−') + Math.abs(aPi).toFixed(3) + 'π';
    ctx.fillText(`${vStr}  (${aStr})`, dialX0 + gutterW, yMid);

    // Status / operation (right column)
    if (step.caught) {
      ctx.fillStyle = `rgba(${rungRGB},${1.0 * fade})`;
      ctx.font = `bold ${13 * dpr}px 'Courier New',monospace`;
      ctx.fillText(`|V| < 1  →  caught ✓`, statusX0, yMid);
    } else {
      const halved = v / 2;
      const hStr = Math.abs(halved) < 0.001 || Math.abs(halved) >= 10000
        ? halved.toExponential(3)
        : halved.toFixed(4);
      ctx.fillStyle = `rgba(255,255,255,${0.7 * fade})`;
      ctx.font = `${12 * dpr}px 'Courier New',monospace`;
      ctx.fillText(`|V| ≥ 1  →  halve to ${hStr}`, statusX0, yMid);
    }
  }

  // Drag-zone hint: small chevrons above/below the dial center to suggest
  // verticality is interactive. Faint, positioned at right edge.
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.font = `${11 * dpr}px 'Courier New',monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('drag ↕', dialX0 + dialW - 8 * dpr, vc);

  return headerH + availH;
}


// ═══════════════════════════════════════════════════════════════════════════
// Master draw
// ═══════════════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════════════
// Virtual circle — the real number line above, closed into a circle below.
// Two charts, selected from the menu:
//   'uniform':  φ = 2·atan(x) = 2θ — the arc chart; equal-angle leaves come
//               out equally spaced (the wrap inverts the tangent projection).
//   'fisheye':  φ = π·x/L — the line chart, position linear in the slope
//               itself; leaf gaps grow with |x| exactly as on the chord,
//               rung bands double per rung, leaves beyond |x|>L pile at ∞.
// The gold dashed edge is the VCP snap: last leaf → first, across the seam.
// ═══════════════════════════════════════════════════════════════════════════
function drawVirtualCircle(R, cx, dpr, yTop, which) {
  const W = canvas.width, H = canvas.height;
  const thetaC = state.theta;
  const halfAp = state.ap * (Math.PI / 2);
  const N = state.N;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const cyv = yTop + availH / 2 + 4 * dpr;
  const rv = Math.max(30 * dpr, Math.min(availH / 2 - 24 * dpr, W * 0.34));
  // Fisheye wrap: LINEAR in the slope — the number line's own ruler, the
  // segment [−L, L] wrapped end-to-end into the circle, leaf gaps growing
  // with |x| exactly as on the line above; leaves beyond |x| > L sit at the
  // seam. L is the menu's fisheye-window slider.
  const L = state.fishL;
  const phiOf = which === 'fisheye'
    ? (x => Math.PI * Math.max(-L, Math.min(L, x)) / L)
    : (x => 2 * Math.atan(x));
  const pt = (phi, rr) => ({ x: cx + rr * Math.sin(phi), y: cyv + rr * Math.cos(phi) });

  // rung band arcs: the chord's dyadic strip, wrapped by this chart
  const bandArc = (vLo, vHi, rung) => {
    ctx.strokeStyle = `rgba(${bandColorRGB(rung)},0.55)`;
    ctx.lineWidth = 5 * dpr;
    ctx.beginPath();
    const steps = 28;
    for (let i = 0; i <= steps; i++) {
      const x = vLo + (vHi - vLo) * i / steps;
      const q = pt(phiOf(x), rv + 6 * dpr);
      i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
    }
    ctx.stroke();
  };
  bandArc(-1, 1, 0);
  for (let rung = 1; rung <= 6; rung++) {
    const lo = Math.pow(2, rung - 1), hi = Math.min(Math.pow(2, rung), 1e6);
    bandArc(lo, hi, rung); bandArc(-hi, -lo, rung);
  }

  // the circle, faint
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.arc(cx, cyv, rv, 0, 2 * Math.PI); ctx.stroke();

  // connect the leaves; closing edge (last → first, across the seam) in gold
  const xs = [];
  for (let i = 0; i < N; i++) xs.push(Math.tan(Math.max(-SAFE, Math.min(SAFE, itemTheta(i, N)))));
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath();
  xs.forEach((x, i) => { const q = pt(phiOf(x), rv); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); });
  ctx.stroke();
  {
    const a = pt(phiOf(xs[N - 1]), rv), b = pt(phiOf(xs[0]), rv);
    ctx.strokeStyle = 'rgba(255,180,80,0.9)';
    ctx.lineWidth = 1.6 * dpr;
    ctx.setLineDash([4 * dpr, 3 * dpr]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // leaf dots — same dots as the chord, this chart's wrap
  for (let i = 0; i < N; i++) {
    const th = itemTheta(i, N);
    const x = Math.tan(Math.max(-SAFE, Math.min(SAFE, th)));
    const q = pt(phiOf(x), rv);
    const inWin = inWindow(th, thetaC, halfAp);
    ctx.fillStyle = rungColorForTheta(th, inWin ? 0.95 : 0.60);
    ctx.beginPath(); ctx.arc(q.x, q.y, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // seam and home markers, minimal
  const seam = pt(Math.PI, rv);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(seam.x, seam.y, 3 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('∞', seam.x, seam.y - 9 * dpr);
  const home = pt(0, rv);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('0', home.x, home.y + 16 * dpr);
  ctx.textAlign = 'left';

  // focal, wrapped by this chart
  if (Math.abs(thetaC) < SAFE) {
    const f = pt(phiOf(Math.tan(thetaC)), rv);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(f.x, f.y, 5 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Continuous wave view — the wave f(x) drawn along the slope axis (panned
// with the focal, same convention as the slope chart), with the N leaves
// sampled onto it. Waves from the surveyor/observer wave demo.
// ═══════════════════════════════════════════════════════════════════════════
const WAVE_FNS = [
  x => Math.sin(1.5*x),
  x => Math.sin(x) + 0.4*Math.sin(3*x),
  x => Math.sin(x)*Math.cos(4*x),
  x => Math.tanh(3*Math.sin(x)),
  x => Math.sin(x*x),
  x => Math.exp(-2*x*x)*2 - 0.4,
  x => 1/(1 + 4*x*x),
  x => Math.abs(Math.sin(x)) - 0.5,
  x => Math.sign(Math.sin(2*x))*0.7,
  x => x*0.4,
  x => Math.sin(x) + 0.15*x,
  x => Math.cos(x)/(1 + Math.abs(x)),
  // ── Shape profiles: atom-atlas closed curves read as single-valued periodic
  // waves — the collapse-mode view of a shape (its radial profile r(θ) recentered
  // to swing about zero), so the leaf lattice samples them and the slope readout
  // and top-chart bridge keep working.
  x => Math.cos(x),                                   // circle  r = 1
  x => (1 + Math.cos(x)) - 1,                          // cardioid  r = 1+cos
  x => (1 + 0.5*Math.cos(x)) - 1,                      // limaçon  r = 1+½cos
  x => Math.cos(3*x),                                 // rose  r = cos 3θ
  x => Math.cos(5*x),                                 // rose  r = cos 5θ
  x => Math.pow(Math.abs(Math.cos(x)),3)*Math.sign(Math.cos(x)),  // astroid  cos³
  x => Math.sin(3*x)*0.9,                             // lissajous 3:2
  x => (5*Math.cos(x) - Math.cos(5*x))/6,             // epicycloid 5:1
  x => 2/(1 + x*x) - 1,                                // cauchy ρ = 1/(1+x²) (the semicircle's shadow), centered
];
// Display labels for WAVE_FNS (index-aligned) — used by the unified curve/wave
// dropdown. Defined here (early) so refreshCurveUI() can read it at startup.
const WAVE_LABELS = [
  'sine · sin(1.5x)', 'two-tone', 'AM signal', 'square-ish', 'chirp',
  'gaussian bump', 'cauchy peak', 'rectified', 'square wave', 'ramp',
  'drifting wave', 'damped',
  'circle', 'cardioid', 'limaçon', 'rose (3)', 'rose (5)', 'astroid',
  'lissajous 3:2', 'epicycloid 5:1', 'cauchy ρ=1/(1+x²)',
];

// ONE unified function library. Every function is read in the VALUE frame,
// f(x) (x = the value under the cursor). The wave/slope panels draw f plainly;
// the bridge panel draws the SAME f with the leaf-sampling + K_N reconstruction
// overlaid. The former bridge CURVES join in as value-domain functions and keep
// their parameter; the plain waves carry no parameter. state.fnIdx selects one.
const UNIFIED_FNS = [
  ...WAVE_FNS.map((fn, i) => ({ label: WAVE_LABELS[i], group: 'waves', f: (x) => fn(x), param: null })),
  ...CURVES.map((c) => ({ label: c.label, group: 'curves', f: (x, p) => c.f(x, p), param: c.param || null })),
];
function currentFn() { return UNIFIED_FNS[state.fnIdx] || UNIFIED_FNS[0]; }
function currentParamVal() { const p = currentFn().param; return p ? p.min + (state.paramT) * (p.max - p.min) : 0; }
// The selected function as a plain value-domain closure f(x), param baked in.
function currentValueFn() { const e = currentFn(), P = currentParamVal(); return x => e.f(x, P); }

function drawWave(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const thetaC = 0;                       // apparatus fixed at home; window centered
  const halfAp = state.ap * (Math.PI / 2);
  const N = state.N;
  const f = currentValueFn();

  // TWO frames. The apparatus is FIXED in the center frame: number line, rungs,
  // dots, leaves — none of it moves. Panning only chooses which stretch of the
  // wave is sampled: the wave curve reads f(worldX + panShift) at each fixed
  // column, so dragging slides the signal through a stationary instrument.
  const focalTan = Math.tan(Math.max(-SAFE, Math.min(SAFE, thetaC)));
  const valToPx = x => cx + R * x;              // fixed center frame (the apparatus)
  const pxToVal = px => (px - cx) / R;          // screen column → fixed value
  const panShift = state.wavePan || 0;          // wave pan: what's read under center

  const panelTop = yTop, panelBot = H - 14 * dpr;
  const panelH = panelBot - panelTop;
  const midY = panelTop + panelH / 2;
  const amp = panelH * 0.34;
  const clampV = v => Math.max(-1.6, Math.min(1.6, v));
  const valToPy = v => midY - clampV(v) * amp;

  // (horizontal zero axis removed)

  // (rung strip / number line removed — the wave view shows only the wave)

  // the continuous wave, amber — the ONLY thing the pan moves. At each fixed
  // screen column we read the wave at (worldX + panShift), so dragging slides
  // the signal left/right through the stationary apparatus.
  ctx.strokeStyle = 'rgba(242,180,95,0.9)';
  ctx.lineWidth = 1.8 * dpr;
  ctx.beginPath();
  for (let px = 0; px <= W; px += 2) {
    const y = valToPy(f(pxToVal(px) + panShift));
    px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
  }
  ctx.stroke();

  // the center line is ALWAYS at screen center — it marks the observer's home
  // column, the fixed point the wave is read against. Panning slides the wave
  // past it; the line itself never moves.
  {
    const pxc = cx;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5 * dpr;
    ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.moveTo(pxc, panelTop + 4 * dpr); ctx.lineTo(pxc, panelBot - 6 * dpr); ctx.stroke();
    ctx.setLineDash([]);
  }

  // (45° corner dots removed)

  // leaves LOCKED to the center frame — a stationary comb. Each sits at its
  // fixed tangent column and its dot height reads the wave (with the pan
  // offset) at that column. The dot and its line take the RUNG COLOR OF THE
  // WAVE'S LOCAL SLOPE there — the same rung the top chart points into — so
  // every dot's color is the slope of the wave beneath it.
  const f2 = f;
  const slopeAt = wx => { const h = 1e-3; return (f2(wx + h) - f2(wx - h)) / (2 * h); };
  for (let i = 0; i < N; i++) {
    const th = itemTheta(i, N);
    const x = Math.tan(Math.max(-SAFE, Math.min(SAFE, th)));
    const px = valToPx(x);                             // fixed column
    if (px < -20 * dpr || px > W + 20 * dpr) continue;
    const inWin = inWindow(th, thetaC, halfAp);
    const worldX = x + panShift;
    const py = valToPy(f(worldX));                     // wave value here now
    const sl = slopeAt(worldX);                        // wave's slope here
    const rung = rungOf(Math.abs(sl));                 // its rung = top chart's rung
    ctx.strokeStyle = `rgba(${bandColorRGB(rung)},${inWin ? 0.35 : 0.15})`;
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(px, midY); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = `rgba(${bandColorRGB(rung)},${inWin ? 0.95 : 0.60})`;
    ctx.beginPath(); ctx.arc(px, py, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // white dot marking the current position — where the wave crosses the center line.
  {
    const worldX = pxToVal(cx) + panShift, py = valToPy(f(worldX));
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(cx, py, 5 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Cauchy view — the semicircle's shadow. ρ(x) = 1/(1+x²) drawn in the ARC's
// own frame (valToPx = arcCx + R·x, identical to the chord mapping above),
// so the whole panel pans rigidly WITH the semicircle: peak under the arc's
// home point, ρ = ½ corners always directly beneath the arc's gold ±45°
// corner dots, rung strip world-anchored mirroring the chord's, leaves at
// their world positions. Dome above, Jacobian below, one object.
// ═══════════════════════════════════════════════════════════════════════════
function drawCauchy(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const thetaC = state.theta;
  const halfAp = state.ap * (Math.PI / 2);
  const N = state.N;

  const focalTan = Math.tan(Math.max(-SAFE, Math.min(SAFE, thetaC)));
  const arcCx = cx - R * focalTan;                 // same pan as the arc above
  const valToPx = x => arcCx + R * x;              // identical to the chord mapping
  const pxToVal = px => (px - arcCx) / R;

  const panelTop = yTop, panelBot = H - 14 * dpr;
  const yBase = panelBot - 24 * dpr;
  const yPk   = panelTop + 18 * dpr;
  const rho = x => 1 / (1 + x * x);
  const Y = r => yBase - r * (yBase - yPk);

  // dyadic rung strip — world-anchored, mirroring the chord strip above
  {
    const rectH = 4 * dpr, rectY = yBase + 2 * dpr;
    const paint = (vLo, vHi, rung) => {
      const a = Math.max(Math.min(valToPx(vLo), valToPx(vHi)), 0);
      const b = Math.min(Math.max(valToPx(vLo), valToPx(vHi)), W);
      if (b <= a) return;
      ctx.fillStyle = `rgba(${bandColorRGB(rung)},0.35)`;
      ctx.fillRect(a, rectY, b - a, rectH);
    };
    paint(-1, 1, 0);
    for (let rung = 1; rung <= 10; rung++) {
      const lo = Math.pow(2, rung - 1), hi = Math.pow(2, rung);
      paint(lo, hi, rung); paint(-hi, -lo, rung);
    }
  }

  // axis
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(0, yBase); ctx.lineTo(W, yBase); ctx.stroke();

  // fill inside the 45° corner (|x| ≤ 1, ρ ≥ ½) — the region under the arc's corners
  const cxa = valToPx(-1), cxb = valToPx(1);
  ctx.beginPath(); ctx.moveTo(cxa, yBase);
  for (let px = Math.max(cxa, 0); px <= Math.min(cxb, W); px += 1) {
    ctx.lineTo(px, Y(rho(pxToVal(px))));
  }
  ctx.lineTo(Math.min(cxb, W), yBase); ctx.closePath();
  ctx.fillStyle = 'rgba(255,140,120,0.12)';
  ctx.fill();

  // the curve across the visible window
  ctx.strokeStyle = 'rgba(255,140,120,0.9)';
  ctx.lineWidth = 2 * dpr;
  ctx.beginPath();
  for (let px = 0; px <= W; px += 2) {
    const y = Y(rho(pxToVal(px)));
    px === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
  }
  ctx.stroke();

  // center line — the Cauchy's own center (x = 0, the peak), welded to the
  // arc so it stays centered ON THE CURVE at all times
  {
    const pxc = valToPx(0);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5 * dpr;
    ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.moveTo(pxc, yPk - 2 * dpr); ctx.lineTo(pxc, yBase); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 45° dots ON the Cauchy curve, in the SAME COLUMN as the semicircle's
  // gold corner dots above: the arc dots sit at ±45° on the arc itself,
  // x-pixel arcCx ± R·sin45° = valToPx(±1/√2); the curve there reads
  // ρ(1/√2) = 2/3. Vertically registered at every pan position.
  {
    const d = Math.SQRT1_2;
    ctx.fillStyle = 'rgba(255,200,120,0.95)';
    ctx.beginPath(); ctx.arc(valToPx(-d), Y(rho(d)), 3.2 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(valToPx(d),  Y(rho(d)), 3.2 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // leaves — world positions, same x-pixels as the chord dots above,
  // drop-line from the curve, size and brightness ∝ acuity at the leaf
  for (let i = 0; i < N; i++) {
    const th = itemTheta(i, N);
    const x = Math.tan(Math.max(-SAFE, Math.min(SAFE, th)));
    const px = valToPx(x);
    if (px < -20 * dpr || px > W + 20 * dpr) continue;
    const r = rho(x);
    const inWin = inWindow(th, thetaC, halfAp);
    ctx.strokeStyle = 'rgba(95,240,200,0.30)';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(px, Y(r)); ctx.lineTo(px, yBase); ctx.stroke();
    ctx.fillStyle = rungColorForTheta(th, inWin ? 0.95 : 0.60);
    ctx.beginPath(); ctx.arc(px, yBase, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// The atom — the 1-ring, held as the pair. Corner (1) at the top, the glued
// zero-address (0 ≡ ∞) at the bottom; home chart climbs the left, horizon the
// right. The reading is the focal pointing held as (|sin θ|, |cos θ|): min/max,
// chart = which is larger. No leaves, no kernel — the carrier alone.
// ═══════════════════════════════════════════════════════════════════════════
function drawAtom(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const cyv = yTop + availH / 2 + 4 * dpr;
  const rv = Math.max(30 * dpr, Math.min(availH / 2 - 28 * dpr, W * 0.34));

  // the reading: pair (|sin θ|, |cos θ|), read min/max — no division ever unsafe
  const t = Math.abs(state.theta);
  drawAtomDial(cx, cyv, rv, dpr, Math.sin(t), Math.cos(t),
               { markerR: 5.5, labels: true, arrivals: true });
}

// ═══════════════════════════════════════════════════════════════════════════
// Two atoms — the 2-ring, ℝP¹. The atom and its sign-reflected partner glued
// at both ends: 0-to-0 at the bottom, ∞-to-∞ at the top — agreement seams
// only, no paradox point, price one sign bit. Landmarks {0, +1, ∞, −1}: the
// corner's ℤ₄ orbit. Positive atom fills the right half, its mirror the left,
// matching the chord's signs above. Drawing angle = 2θ — the signed focal,
// unfolded. Same map as the uniform-circle view: this IS that circle, named.
// ═══════════════════════════════════════════════════════════════════════════
function drawTwoAtoms(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const cyv = yTop + availH / 2 + 4 * dpr;
  const rv = Math.max(30 * dpr, Math.min(availH / 2 - 28 * dpr, W * 0.34));
  const pt = (phi, rr) => ({ x: cx + rr * Math.sin(phi), y: cyv + rr * Math.cos(phi) });

  // the two atoms: positive fills the right semicircle, its mirror the left
  ctx.lineWidth = 1.4 * dpr;
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.arc(cx, cyv, rv, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.arc(cx, cyv, rv, Math.PI / 2, 3 * Math.PI / 2); ctx.stroke();

  // junction seams — both agreements: short cross-ticks at 0 (bottom) and ∞ (top)
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(cx, cyv + rv - 6 * dpr); ctx.lineTo(cx, cyv + rv + 6 * dpr); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cyv - rv - 6 * dpr); ctx.lineTo(cx, cyv - rv + 6 * dpr); ctx.stroke();

  // landmarks: 0 bottom · ∞ top · +1 east · −1 west
  ctx.fillStyle = '#64c8ff';
  ctx.beginPath(); ctx.arc(cx, cyv + rv, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#b482dc';
  ctx.beginPath(); ctx.arc(cx, cyv - rv, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#f2b45f';
  ctx.beginPath(); ctx.arc(cx + rv, cyv, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - rv, cyv, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();

  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('0', cx, cyv + rv + 22 * dpr);
  ctx.fillStyle = 'rgba(180,130,220,0.9)';
  ctx.fillText('∞', cx, cyv - rv - 10 * dpr);
  ctx.fillStyle = 'rgba(242,180,95,0.9)';
  ctx.textAlign = 'left';  ctx.fillText('+1', cx + rv + 10 * dpr, cyv + 4 * dpr);
  ctx.textAlign = 'right'; ctx.fillText('−1', cx - rv - 10 * dpr, cyv + 4 * dpr);
  ctx.textAlign = 'center';

  // the reading: the signed focal, unfolded — drawing angle 2θ, no fold, no bit lost
  const phi = 2 * state.theta;
  const q = pt(phi, rv);
  const home = Math.abs(state.theta) <= Math.PI / 4;   // |slope| ≤ 1
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(cx, cyv); ctx.lineTo(q.x, q.y); ctx.stroke();
  ctx.fillStyle = home ? '#f2b45f' : '#64c8ff';
  ctx.beginPath(); ctx.arc(q.x, q.y, 5.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#03040c';
  ctx.beginPath(); ctx.arc(q.x, q.y, 2 * dpr, 0, 2 * Math.PI); ctx.fill();
}

// ═══════════════════════════════════════════════════════════════════════════
// Three atoms — the 3-ring: the smallest free composite. Parity (c ≡ k mod 2)
// forbids an odd ring from closing on agreements alone: exactly one mixed seam
// returns, carrying the confined two-zeros point. Junctions: one 0–0, one ∞–∞
// (agreements, plain ticks), one 0-to-∞ (the swap seam, glued address). The
// traversal is the pan: one full sweep of the chord walks the ring once.
// ═══════════════════════════════════════════════════════════════════════════
function drawThreeAtoms(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const cyv = yTop + availH / 2 + 4 * dpr;
  const rv = Math.max(30 * dpr, Math.min(availH / 2 - 28 * dpr, W * 0.34));
  const ptu = (u, rr) => {                       // u ∈ [0,1) turn from the mixed seam (bottom)
    const a = Math.PI / 2 + u * 2 * Math.PI;
    return { x: cx + rr * Math.cos(a), y: cyv + rr * Math.sin(a) };
  };

  // the ring, faint
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.4 * dpr;
  ctx.beginPath(); ctx.arc(cx, cyv, rv, 0, 2 * Math.PI); ctx.stroke();

  // corners — mid-arc of each atom
  ctx.fillStyle = '#f2b45f';
  for (const u of [1 / 6, 1 / 2, 5 / 6]) {
    const q = ptu(u, rv);
    ctx.beginPath(); ctx.arc(q.x, q.y, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // agreement junctions: one ∞–∞ (u = 1/3), one 0–0 (u = 2/3) — plain cross-ticks
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1 * dpr;
  for (const u of [1 / 3, 2 / 3]) {
    const qi = ptu(u, rv - 6 * dpr), qo = ptu(u, rv + 6 * dpr);
    ctx.beginPath(); ctx.moveTo(qi.x, qi.y); ctx.lineTo(qo.x, qo.y); ctx.stroke();
  }
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  {
    const qA = ptu(1 / 3, rv + 18 * dpr);
    ctx.fillStyle = 'rgba(180,130,220,0.9)'; ctx.fillText('∞', qA.x, qA.y + 4 * dpr);
    const qB = ptu(2 / 3, rv + 18 * dpr);
    ctx.fillStyle = 'rgba(100,200,255,0.9)'; ctx.fillText('0', qB.x, qB.y + 4 * dpr);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const dA = ptu(1 / 3, rv), dB = ptu(2 / 3, rv);
    ctx.beginPath(); ctx.arc(dA.x, dA.y, 3.5 * dpr, 0, 2 * Math.PI); ctx.fillStyle = '#b482dc'; ctx.fill();
    ctx.beginPath(); ctx.arc(dB.x, dB.y, 3.5 * dpr, 0, 2 * Math.PI); ctx.fillStyle = '#64c8ff'; ctx.fill();
  }

  // the mixed seam (bottom): the parity-forced paradox point — glued address, two arrivals
  ctx.fillStyle = '#64c8ff';
  ctx.beginPath(); ctx.arc(cx, cyv + rv, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(100,200,255,0.55)';
  ctx.beginPath(); ctx.moveTo(cx - 12 * dpr, cyv + rv + 9 * dpr); ctx.lineTo(cx - 3 * dpr, cyv + rv + 2 * dpr); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 12 * dpr, cyv + rv + 9 * dpr); ctx.lineTo(cx + 3 * dpr, cyv + rv + 2 * dpr); ctx.stroke();
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('0 ≡ ∞', cx, cyv + rv + 24 * dpr);

  // the traversal: one full pan of the chord walks the ring once
  // atoms: [0,1/3] 0→∞ · [1/3,2/3] ∞→0 · [2/3,1] 0→∞ (closing mixed)
  const u = Math.min(0.999999, Math.max(0, (state.theta + Math.PI / 2) / Math.PI));
  const s = (u * 3) % 1;                          // position within the current atom
  const atomIdx = Math.floor(u * 3);
  const towardHorizon = (atomIdx !== 1);          // middle atom is traversed ∞→0
  const nearSide = towardHorizon ? (s < 0.5) : (s >= 0.5);
  const q = ptu(u, rv);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(cx, cyv); ctx.lineTo(q.x, q.y); ctx.stroke();
  ctx.fillStyle = nearSide ? '#f2b45f' : '#64c8ff';
  ctx.beginPath(); ctx.arc(q.x, q.y, 5.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#03040c';
  ctx.beginPath(); ctx.arc(q.x, q.y, 2 * dpr, 0, 2 * Math.PI); ctx.fill();
}

// ═══════════════════════════════════════════════════════════════════════════
// Four atoms — the completion: the full direction circle, total 2π. All four
// junctions are agreements (0–0 on the horizontal axes, ∞–∞ on the vertical),
// two sign bits (the quadrant), no paradox point. The eight distinguished
// points — corners on the diagonals, junctions on the axes — are the octant
// walls. Every slope appears twice: the filled marker is the pointing, the
// hollow one its antipode — the orientation a ratio does not carry.
// ═══════════════════════════════════════════════════════════════════════════
function drawFourAtoms(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const cyv = yTop + availH / 2 + 4 * dpr;
  const rv = Math.max(30 * dpr, Math.min(availH / 2 - 28 * dpr, W * 0.34));
  const dir = (a, rr) => ({ x: cx + rr * Math.cos(a), y: cyv - rr * Math.sin(a) });  // math orientation: east right, north up

  // the ring, faint
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.4 * dpr;
  ctx.beginPath(); ctx.arc(cx, cyv, rv, 0, 2 * Math.PI); ctx.stroke();

  // junctions on the axes — all agreements: 0–0 east/west (blue), ∞–∞ north/south (violet)
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1 * dpr;
  for (const a of [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2]) {
    const qi = dir(a, rv - 6 * dpr), qo = dir(a, rv + 6 * dpr);
    ctx.beginPath(); ctx.moveTo(qi.x, qi.y); ctx.lineTo(qo.x, qo.y); ctx.stroke();
  }
  for (const [a, col] of [[0, '#64c8ff'], [Math.PI, '#64c8ff'], [Math.PI / 2, '#b482dc'], [3 * Math.PI / 2, '#b482dc']]) {
    const q = dir(a, rv);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(q.x, q.y, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  // corners on the diagonals
  ctx.fillStyle = '#f2b45f';
  for (const a of [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4]) {
    const q = dir(a, rv);
    ctx.beginPath(); ctx.arc(q.x, q.y, 4 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // glyphs: each address twice — the doubling the orientation buys
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  const glyph = (a, txt, col) => {
    const q = dir(a, rv + 17 * dpr);
    ctx.fillStyle = col; ctx.fillText(txt, q.x, q.y + 4 * dpr);
  };
  glyph(0, '0', 'rgba(100,200,255,0.9)');
  glyph(Math.PI, '0', 'rgba(100,200,255,0.9)');
  glyph(Math.PI / 2, '∞', 'rgba(180,130,220,0.9)');
  glyph(3 * Math.PI / 2, '∞', 'rgba(180,130,220,0.9)');
  glyph(Math.PI / 4, '+1', 'rgba(242,180,95,0.9)');
  glyph(3 * Math.PI / 4, '−1', 'rgba(242,180,95,0.9)');
  glyph(5 * Math.PI / 4, '+1', 'rgba(242,180,95,0.9)');
  glyph(7 * Math.PI / 4, '−1', 'rgba(242,180,95,0.9)');

  // the pointing: the focal direction itself — and its antipode, hollow: the unheld bit
  const a = state.theta;
  const q = dir(a, rv), qa = dir(a + Math.PI, rv);
  const home = Math.abs(state.theta) <= Math.PI / 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(cx, cyv); ctx.lineTo(q.x, q.y); ctx.stroke();
  ctx.strokeStyle = home ? 'rgba(242,180,95,0.7)' : 'rgba(100,200,255,0.7)';
  ctx.lineWidth = 1.4 * dpr;
  ctx.beginPath(); ctx.arc(qa.x, qa.y, 5 * dpr, 0, 2 * Math.PI); ctx.stroke();
  ctx.fillStyle = home ? '#f2b45f' : '#64c8ff';
  ctx.beginPath(); ctx.arc(q.x, q.y, 5.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#03040c';
  ctx.beginPath(); ctx.arc(q.x, q.y, 2 * dpr, 0, 2 * Math.PI); ctx.fill();
}

// ═══════════════════════════════════════════════════════════════════════════
// Interleave — two atoms, two couplings (gbo §9: interleaved, not tensor).
// Left: TWO brackets (A₁:B₁)(A₂:B₂) — independent denominators, the tensor
// product. Sampled, it fills its folded square FLATLY, corners included: both
// horizons are independently reachable. The live point moves on gridlines —
// each gesture moves one coordinate, the grid's kind of motion.
// Right: ONE bracket (A₁:A₂:B) — one shared denominator, one projective class,
// the native 2D pointing. Sampled (gnomonic of the uniform hemisphere — the
// bivariate Cauchy), the cloud is ROUND and fades in the corners: a shared B
// cannot blow up against both numerators independently. The live object is a
// RAY through the origin — sweeping B slides along it; the direction A₁:A₂ is
// the aim. Area vs curve; square vs disc; grid vs pointing.
// Drive: horizontal drag = atom 1 (the focal), vertical drag = atom 2 (dial).
// ═══════════════════════════════════════════════════════════════════════════
function drawInterleave(R, cx, dpr, yTop) {
  const W = canvas.width, H = canvas.height;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const HALF = Math.PI / 2;

  // 2×2: rows = the two couplings, columns = the two folds.
  const pane = Math.min((availH - 84 * dpr) / 2, W * 0.20);
  const gx = Math.min(46 * dpr, W * 0.04), gy = 40 * dpr;
  const cyv = yTop + availH / 2 + 6 * dpr;
  const colX = [cx - pane / 2 - gx / 2, cx + pane / 2 + gx / 2];   // grid fold · polar fold
  const rowY = [cyv - pane / 2 - gy / 2, cyv + pane / 2 + gy / 2]; // tensor · interleaved

  // ── sediment: raw resolved pairs, folded per pane at draw time ──
  if (!state.interT) {
    state.interT = []; state.interI = [];
    for (let i = 0; i < 9000; i++) {
      // two brackets: independent atoms — independent Cauchy readings
      state.interT.push([Math.tan(Math.PI * (Math.random() - 0.5)),
                         Math.tan(Math.PI * (Math.random() - 0.5))]);
      // one bracket: one class — gnomonic of the uniform hemisphere (the bivariate Cauchy)
      const z = Math.max(Math.random(), 1e-12), ps = Math.random() * 2 * Math.PI;
      const s = Math.sqrt(Math.max(0, 1 - z * z));
      state.interI.push([s * Math.cos(ps) / z, s * Math.sin(ps) / z]);
    }
  }

  // the two folds
  const foldGrid = q => [Math.atan(q[0]) / HALF, Math.atan(q[1]) / HALF];          // fold each axis
  const foldPolar = q => {                                                          // fold the class
    const rho = Math.hypot(q[0], q[1]), psi = Math.atan2(q[1], q[0]);
    const rf = Math.atan(rho) / HALF;
    return [rf * Math.cos(psi), rf * Math.sin(psi)];
  };

  const paneFrame = (px, py, circle) => {
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1 * dpr;
    if (circle) { ctx.beginPath(); ctx.arc(px, py, pane / 2, 0, 2 * Math.PI); ctx.stroke(); }
    else ctx.strokeRect(px - pane / 2, py - pane / 2, pane, pane);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.moveTo(px - pane / 2, py); ctx.lineTo(px + pane / 2, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, py - pane / 2); ctx.lineTo(px, py + pane / 2); ctx.stroke();
  };
  const sediment = (px, py, pts, fold, col) => {
    ctx.fillStyle = col;
    for (let i = 0; i < pts.length; i++) {
      const v = fold(pts[i]);
      ctx.fillRect(px + v[0] * pane / 2, py - v[1] * pane / 2, 1.3 * dpr, 1.3 * dpr);
    }
  };

  // rows × columns: each law flat in its own fold, scarred in the other's
  paneFrame(colX[0], rowY[0], false); sediment(colX[0], rowY[0], state.interT, foldGrid,  'rgba(100,200,255,0.30)');
  paneFrame(colX[1], rowY[0], true);  sediment(colX[1], rowY[0], state.interT, foldPolar, 'rgba(100,200,255,0.30)');
  paneFrame(colX[0], rowY[1], false); sediment(colX[0], rowY[1], state.interI, foldGrid,  'rgba(242,180,95,0.30)');
  paneFrame(colX[1], rowY[1], true);  sediment(colX[1], rowY[1], state.interI, foldPolar, 'rgba(242,180,95,0.30)');

  // ── the live pointing: atom 1 = focal (horizontal drag), atom 2 = dial (vertical drag) ──
  const t1 = Math.max(-HALF + 1e-9, Math.min(HALF - 1e-9, state.theta));
  let a2 = ((state.cascadeAngle % Math.PI) + Math.PI) % Math.PI; if (a2 > HALF) a2 -= Math.PI;
  const q = [Math.tan(t1), Math.tan(a2)];
  const marker = (px, py, v, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px + v[0] * pane / 2, py - v[1] * pane / 2, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(px + v[0] * pane / 2, py - v[1] * pane / 2, 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();
  };
  // tensor row: gridline motion — the coordinate lines through the point
  {
    const v = foldGrid(q);
    const mx = colX[0] + v[0] * pane / 2, my = rowY[0] - v[1] * pane / 2;
    ctx.strokeStyle = 'rgba(100,200,255,0.35)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(mx, rowY[0] - pane / 2); ctx.lineTo(mx, rowY[0] + pane / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(colX[0] - pane / 2, my); ctx.lineTo(colX[0] + pane / 2, my); ctx.stroke();
    marker(colX[0], rowY[0], v, '#64c8ff');
    marker(colX[1], rowY[0], foldPolar(q), '#64c8ff');
  }
  // interleaved row: the class is a ray — curved in the grid's fold, a straight radius in its own
  {
    ctx.strokeStyle = 'rgba(242,180,95,0.55)'; ctx.lineWidth = 1.2 * dpr;
    ctx.beginPath();
    for (let i = 0; i <= 160; i++) {
      const lam = Math.tan((i / 160) * (HALF - 1e-6));
      const v = foldGrid([lam * q[0], lam * q[1]]);
      const px = colX[0] + v[0] * pane / 2, py = rowY[1] - v[1] * pane / 2;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    const psi = Math.atan2(q[1], q[0]);
    ctx.beginPath(); ctx.moveTo(colX[1], rowY[1]);
    ctx.lineTo(colX[1] + Math.cos(psi) * pane / 2, rowY[1] - Math.sin(psi) * pane / 2); ctx.stroke();
    marker(colX[0], rowY[1], foldGrid(q), '#f2b45f');
    marker(colX[1], rowY[1], foldPolar(q), '#f2b45f');
  }

  // captions: the two brackets (rows), the two folds (columns) — notation only
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('atan q₁ · atan q₂', colX[0], rowY[0] - pane / 2 - 10 * dpr);
  ctx.fillText('atan ρ · ψ', colX[1], rowY[0] - pane / 2 - 10 * dpr);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('(A₁:B₁)(A₂:B₂)', colX[0] - pane / 2 - 14 * dpr, rowY[0] + 4 * dpr);
  ctx.fillStyle = 'rgba(242,180,95,0.9)';
  ctx.fillText('(A₁:A₂:B)', colX[0] - pane / 2 - 14 * dpr, rowY[1] + 4 * dpr);
  ctx.textAlign = 'center';
}

// ═══════════════════════════════════════════════════════════════════════════
// v/d · h/d — interleaving, concretely (gbo §9's viewport instance). An image
// plane; h from the number line (horizontal drag), v from the vertical gesture,
// d the shared depth (menu slider). The amber reading is the ONE-bracket class
// (h : v : d): as d sweeps it slides along the ray through the center — the aim
// h : v is d-invariant; that ray IS the shared denominator, drawn. The blue
// comparison is the TWO-bracket (h : d)(v : 1): the same knob moves it along a
// gridline — only its own coordinate responds. One knob, two motions. Center =
// home (d → ∞ collapses everything); leaving the frame = the horizon (d → 0).
// ═══════════════════════════════════════════════════════════════════════════
// 2D shapes for the plane between the line and the atoms. Absolute units:
// the shape is the world; the blue square is the aperture (±h); the amber dot
// is the pointing (v₁, v₂). Tracing the boundary writes the registers.
const SHAPES2D = [
  { f: t => { const a = t * 2 * Math.PI; return { x: 1.6 * Math.cos(a), y: 1.6 * Math.sin(a) }; } },                                   // circle
  { f: t => { const a = t * 2 * Math.PI; return { x: 2.1 * Math.cos(a), y: 0.9 * Math.sin(a) }; } },                                   // ellipse
  { f: t => { const a = t * 2 * Math.PI; const r = 1.15 * (1 - Math.sin(a)); return { x: r * Math.cos(a), y: r * Math.sin(a) + 0.6 }; } }, // cardioid
  { f: t => { const a = t * 2 * Math.PI; const r = 1.9 * Math.cos(3 * a); return { x: r * Math.cos(a), y: r * Math.sin(a) }; } },      // rose (3)
  { f: t => { const a = t * 2 * Math.PI; return { x: 1.9 * Math.sin(2 * a), y: 1.3 * Math.sin(a) }; } },                               // lissajous 2:1
];
function vhdPlane() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const regs = vhdRegs();
  const dialTop = regs[0].cy - regs[0].r - 26 * dpr;
  const cy = (yTop + dialTop) / 2;
  const S = Math.max(20 * dpr, Math.min((dialTop - yTop) / 4.6, W / 6));
  return { cx: W / 2, cy, S, yTop, dialTop };
}
function shapePresetZones() { return presetZonesAt(vhdPlane().yTop); }
function vhdPlayZone() {
  const dpr = devicePixelRatio;
  const p = vhdPlane();
  return { cx: 36 * dpr, cy: p.yTop + 24 * dpr, r: 15 * dpr };
}
// quadrature drive state: where along the boundary the signal currently is
let vhdT = 0, _vhdPlayLast = null, _vhdPlayActive = false;
let dragStartFold = 0, dragStartFoldX = 0;
let _lastBeamTheta = null, dragStartBeamA = 0, dragStartBeamB = 0;
const VHD_PERIOD = 12;   // seconds per lap of the boundary
// Two ATOMS at the bottom — (v₁ : h) and (v₂ : h) — and one shared REGISTER, h.
// h is not an atom: it is the aperture, the run both reads are taken against.
// It is drawn as a node between the two dials, plumbed into both, because it
// is one register bound into two atoms — changing it IS changing both reads.
// Click a dial to edit its numerator; click the h node to edit the aperture.
function vhdRegs() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const r = Math.min(64 * dpr, W / 10, H * 0.11);
  const cy = H - r - 48 * dpr;
  const gap = Math.min(W / 5, r * 3.2);
  return [
    { key: 'vVal',  glyph: 'v₁ : h', def: 0.45, type: 'atom', cx: W / 2 - gap, cy, r },

      ctx.beginPath(); ctx.arc(p.x, p.y, 1.8 * dpr, 0, 2 * Math.PI); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(242,180,95,0.55)'; ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4 * dpr, 0, 2 * Math.PI); ctx.stroke();
    }
  }

  // scrub track: four stations, two halvings, one free weld
  const ty = L.yBot + 16 * dpr;
  const sp = 34 * dpr;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(L.cx - 1.5 * sp, ty); ctx.lineTo(L.cx + 1.5 * sp, ty); ctx.stroke();
  const masses = ['2π', 'π', 'π/2', 'π/2'];
  for (let i = 0; i < 4; i++) {
    const x = L.cx + (i - 1.5) * sp;
    ctx.fillStyle = sig >= i - 0.02 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.30)';
    ctx.beginPath(); ctx.arc(x, ty, 3 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = i === 3 && sig > 2.9 ? 'rgba(224,82,82,0.85)' : 'rgba(255,255,255,0.45)';
    ctx.fillText(masses[i], x, ty + 16 * dpr);
  }
  ctx.fillStyle = '#f2b45f';
  ctx.beginPath(); ctx.arc(L.cx + (sig - 1.5) * sp, ty, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();

  // h readout
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('h', L.cx - 150 * dpr, ty + 2 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(hh.toFixed(3), L.cx - 150 * dpr, ty + 16 * dpr);

  // shape presets + play/pause — the same signal machinery as the other panes
  drawPresets(foldPresetZones(), dpr);
  {
    const z = foldPlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// The bridge — the sphere and the plane are ONE picture. The observer sits
// at the centre; every ray from the eye pierces the sphere at a pointing
// and continues to the plane held at distance h = 1. The piercing point is
// the sphere view; the landing point is the vhd plane, (v₁/h, v₂/h). This
// is the eye's own projection (the gnomonic one, the pinhole): the corner
// parallel lands exactly on the plane's unit circle; the horizon equator's
// rays run parallel to the plane and never land — the plane's infinity.
// ═════════════════════════════════════════════════════════════════════════
function bridgeLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 24 * dpr;
  const cy = yTop + (yBot - yTop) * 0.62;
  const S = Math.max(24 * dpr, Math.min((yBot - yTop) / 4.4, W / 6.5));
  return { cx: W / 2, cy, S, yTop, yBot };
}
function bridgePresetZones() { return presetZonesAt(bridgeLayout().yTop); }
function bridgePlayZone() { return playZoneAt(bridgeLayout().yTop); }
const BRIDGE_CLIP = 3.0;
function drawBridge(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = bridgeLayout();
  const hh = (state.hVal == null) ? 1.2 : state.hVal;
  const hSafe = (Math.abs(hh) < 1 / 64) ? (hh < 0 ? -1 / 64 : 1 / 64) : hh;
  const v1 = (state.vVal == null) ? 0.45 : state.vVal;
  const v2 = (state.v2Val == null) ? 1.8 : state.v2Val;
  const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';

  // the sphere (small, centred on the eye)
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.arc(L.cx, L.cy, L.S, 0, 2 * Math.PI); ctx.stroke();
  const ring = (rad, z) => {
    const pts = [];
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * 2 * Math.PI;
      pts.push({ x: rad * Math.cos(a), y: rad * Math.sin(a), z });
    }
    return pts;
  };
  sphStroke(ring(1, 0), L, 'rgba(100,200,255,0.50)', 'rgba(100,200,255,0.14)', 1.1, dpr);
  const rc = Math.SQRT1_2;
  sphStroke(ring(rc,  rc), L, 'rgba(242,180,95,0.45)', 'rgba(242,180,95,0.12)', 1, dpr, true);
  sphStroke(ring(rc, -rc), L, 'rgba(242,180,95,0.45)', 'rgba(242,180,95,0.12)', 1, dpr, true);

  // the plane, held at h = 1, touching the carrier at home
  const E = 2.2;
  const edge = (a, b) => {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      pts.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: 1 });
    }
    return pts;
  };
  const C = [{ x: -E, y: -E }, { x: E, y: -E }, { x: E, y: E }, { x: -E, y: E }];
  for (let i = 0; i < 4; i++) sphStroke(edge(C[i], C[(i + 1) % 4]), L, 'rgba(255,255,255,0.22)', 'rgba(255,255,255,0.10)', 1, dpr);
  // the corner's landing: the 45° parallel projects to the UNIT CIRCLE of the plane
  sphStroke(ring(1, 1), L, 'rgba(242,180,95,0.55)', 'rgba(242,180,95,0.20)', 1, dpr, true);
  // unit ticks on the plane's axes
  ctx.lineWidth = 1 * dpr;
  for (const m of [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]) {
    const P = sphProject({ x: m.x, y: m.y, z: 1 }, L);
    ctx.strokeStyle = P.front ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 1.6 * dpr, 0, 2 * Math.PI); ctx.stroke();
  }

  // the shape, twice — once as pointings on the carrier, once as landings on the plane
  const spts = [], ppts = [];
  for (let i = 0; i <= 240; i++) {
    const q = shp.f((i % 240) / 240);
    const p = sphNorm(q.x, q.y, hh);
    spts.push(p);
    const px = q.x / hSafe, py = q.y / hSafe;
    ppts.push((Math.abs(px) > BRIDGE_CLIP || Math.abs(py) > BRIDGE_CLIP) ? null : { x: px, y: py, z: 1 });
  }
  sphStroke(spts.filter(Boolean), L, 'rgba(242,180,95,0.80)', 'rgba(242,180,95,0.20)', 1.4, dpr);
  // plane curve, pen up where the landing runs past the clip toward infinity
  for (const pass of [0, 1]) {
    ctx.strokeStyle = pass ? 'rgba(242,180,95,0.75)' : 'rgba(242,180,95,0.22)';
    ctx.lineWidth = 1.4 * dpr;
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i < ppts.length - 1; i++) {
      if (!ppts[i] || !ppts[i + 1]) { pen = false; continue; }
      const a = sphProject(ppts[i], L), b = sphProject(ppts[i + 1], L);
      if ((a.front && b.front) === !!pass) {
        if (!pen) { ctx.moveTo(a.sx, a.sy); pen = true; }
        ctx.lineTo(b.sx, b.sy);
      } else pen = false;
    }
    ctx.stroke();
  }

  // the rays: from the eye, through the carrier, onto the plane
  const O = sphProject({ x: 0, y: 0, z: 0 }, L);
  for (let k = 0; k < 12; k++) {
    const q = shp.f((k * 20) / 240);
    const pl = { x: q.x / hSafe, y: q.y / hSafe, z: 1 };
    if (Math.abs(pl.x) > BRIDGE_CLIP || Math.abs(pl.y) > BRIDGE_CLIP) continue;
    const P = sphProject(pl, L);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(O.sx, O.sy); ctx.lineTo(P.sx, P.sy); ctx.stroke();
  }
  // the live pointing's ray, and its two incarnations
  {
    const pl = { x: v1 / hSafe, y: v2 / hSafe, z: 1 };
    const clipped = Math.abs(pl.x) > BRIDGE_CLIP || Math.abs(pl.y) > BRIDGE_CLIP;
    const ps = sphNorm(v1, v2, hh);
    if (!clipped) {
      const P = sphProject(pl, L);
      ctx.strokeStyle = 'rgba(242,180,95,0.45)';
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath(); ctx.moveTo(O.sx, O.sy); ctx.lineTo(P.sx, P.sy); ctx.stroke();
      ctx.fillStyle = '#f2b45f';
      ctx.beginPath(); ctx.arc(P.sx, P.sy, 5 * dpr, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = '#03040c';
      ctx.beginPath(); ctx.arc(P.sx, P.sy, 1.8 * dpr, 0, 2 * Math.PI); ctx.fill();
    }
    if (ps) {
      const P = sphProject(ps, L);
      ctx.fillStyle = P.front ? '#f2b45f' : 'rgba(242,180,95,0.5)';
      ctx.beginPath(); ctx.arc(P.sx, P.sy, 3.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    }
  }
  // the eye — the observer, whom every ray leaves
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(O.sx, O.sy, 2.6 * dpr, 0, 2 * Math.PI); ctx.fill();
  // home — where the observer's own axis pierces the carrier and meets the plane
  const HO = sphProject({ x: 0, y: 0, z: 1 }, L);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(HO.sx, HO.sy, 3 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('home', HO.sx - 34 * dpr, HO.sy - 4 * dpr);
  const aF = -state.sphYaw - 0.5;
  const eq = sphProject({ x: Math.cos(aF), y: Math.sin(aF), z: 0 }, L);
  ctx.fillStyle = 'rgba(100,200,255,0.75)';
  ctx.fillText('horizon', eq.sx + 30 * dpr, eq.sy + 14 * dpr);
  const co = sphProject({ x: Math.cos(aF), y: Math.sin(aF), z: 1 }, L);
  ctx.fillStyle = 'rgba(242,180,95,0.75)';
  ctx.fillText('corner', co.sx + 26 * dpr, co.sy - 8 * dpr);

  // h readout
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('h', L.cx, L.yBot + 2 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(hh.toFixed(3), L.cx, L.yBot + 16 * dpr);

  // presets + play/pause
  drawPresets(bridgePresetZones(), dpr);
  {
    const z = bridgePlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// Torus vs sphere — the two composition disciplines as two carriers.
// LEFT, interleaved: (v₁ : v₂ : h), one shared denominator. Carrier = sphere.
//   One home, one horizon (the equator), corner parallels between.
// RIGHT, tensor: (v₁ : h)(v₂ : h), two private brackets. Carrier =
//   circle × circle = torus. Each factor keeps its OWN landmarks, so the
//   torus pays TWO horizon circles — one per private ruler — crossing at
//   the double-crash point (∞, ∞), marked red. The grid lives here: its
//   "orthogonal, independent axes" are the two factor circles.
// Same signal drives both. χ(sphere) = 2, χ(torus) = 0: the price of
// sharing versus the price of independence, drawn.
// ═════════════════════════════════════════════════════════════════════════
const TOR_R0 = 0.9, TOR_r0 = 0.4;
function torusLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 44 * dpr;
  const cy = (yTop + yBot) / 2;
  const S = Math.max(24 * dpr, Math.min((yBot - yTop) / 2.9, W / 5.4));
  return { cxL: W * 0.29, cxR: W * 0.71, cy, S, yTop, yBot };
}
function torusPresetZones() { return presetZonesAt(torusLayout().yTop); }
function torusPlayZone() { return playZoneAt(torusLayout().yTop); }
function torP(u, w) {
  return { x: (TOR_R0 + TOR_r0 * Math.cos(w)) * Math.cos(u),
           y: (TOR_R0 + TOR_r0 * Math.cos(w)) * Math.sin(u),
           z: TOR_r0 * Math.sin(w) };
}
function torProject(p, cx, cy, S) {
  const cyw = Math.cos(state.sphYaw), syw = Math.sin(state.sphYaw);
  const cp = Math.cos(state.sphPitch), sp = Math.sin(state.sphPitch);
  const x1 = p.x * cyw - p.y * syw;
  const y1 = p.x * syw + p.y * cyw;
  return { sx: cx + x1 * S, sy: cy - (y1 * sp + p.z * cp) * S, d: y1 * cp - p.z * sp };
}
function torStroke(pts, cx, cy, S, rgb, aNear, aFar, lw, dpr, dash) {
  // depth-faded stroke: nearer segments brighter (no true occlusion — the
  // torus is drawn as a glass surface)
  ctx.lineWidth = lw * dpr;
  if (dash) ctx.setLineDash([4 * dpr, 4 * dpr]);
  for (let i = 0; i < pts.length - 1; i++) {
    const a = torProject(pts[i], cx, cy, S), b = torProject(pts[i + 1], cx, cy, S);
    const t = Math.max(0, Math.min(1, ((a.d + b.d) / 2 + 1.4) / 2.8));
    ctx.strokeStyle = `rgba(${rgb},${(aNear + (aFar - aNear) * t).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }
  if (dash) ctx.setLineDash([]);
}
function torRing(kind, c, n) {
  // kind 'u': tube ring at fixed u = c; kind 'w': ring around at fixed w = c
  const pts = [];
  for (let i = 0; i <= (n || 96); i++) {
    const a = (i / (n || 96)) * 2 * Math.PI;
    pts.push(kind === 'u' ? torP(c, a) : torP(a, c));
  }
  return pts;
}
function drawTorus(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = torusLayout();
  const hh = (state.hVal == null) ? 1.2 : state.hVal;
  const hSafe = (Math.abs(hh) < 1 / 64) ? (hh < 0 ? -1 / 64 : 1 / 64) : hh;
  const v1 = (state.vVal == null) ? 0.45 : state.vVal;
  const v2 = (state.v2Val == null) ? 1.8 : state.v2Val;
  const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';

  // ── LEFT: the sphere, one shared denominator ──
  const SL = { cx: L.cxL, cy: L.cy, S: L.S };
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.arc(SL.cx, SL.cy, SL.S, 0, 2 * Math.PI); ctx.stroke();
  const ring = (rad, z) => {
    const pts = [];
    for (let i = 0; i <= 96; i++) {
      const a = (i / 96) * 2 * Math.PI;
      pts.push({ x: rad * Math.cos(a), y: rad * Math.sin(a), z });
    }
    return pts;
  };
  sphStroke(ring(1, 0), SL, 'rgba(100,200,255,0.55)', 'rgba(100,200,255,0.16)', 1.2, dpr);
  const rc = Math.SQRT1_2;
  sphStroke(ring(rc,  rc), SL, 'rgba(242,180,95,0.45)', 'rgba(242,180,95,0.12)', 1, dpr, true);
  sphStroke(ring(rc, -rc), SL, 'rgba(242,180,95,0.45)', 'rgba(242,180,95,0.12)', 1, dpr, true);
  const sCurve = [];
  for (let i = 0; i <= 240; i++) {
    const q = shp.f((i % 240) / 240);
    const p = sphNorm(q.x, q.y, hh);
    if (p) sCurve.push(p);
  }
  sphStroke(sCurve, SL, 'rgba(242,180,95,0.80)', 'rgba(242,180,95,0.20)', 1.4, dpr);
  if (state.vhdPlay) {
    for (const seg of [[0.07, 0.95]]) {
      const pts = [];
      for (let i = 0; i <= 30; i++) {
        const t = vhdT - seg[0] + (seg[0] * i) / 30;
        const q = shp.f(((t % 1) + 1) % 1);
        const p = sphNorm(q.x, q.y, hh);
        if (p) pts.push(p);
      }
      sphStroke(pts, SL, `rgba(242,180,95,${seg[1]})`, `rgba(242,180,95,${seg[1] * 0.25})`, 2, dpr);
    }
  }
  {
    const P = sphProject({ x: 0, y: 0, z: 1 }, SL);
    ctx.fillStyle = P.front ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 3 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  const pp = sphNorm(v1, v2, hh);
  if (pp) {
    const P = sphProject(pp, SL);
    ctx.fillStyle = P.front ? '#f2b45f' : 'rgba(242,180,95,0.45)';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 1.8 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // ── RIGHT: the torus, two private brackets ──
  const cT = L.cxR, cyT = L.cy, ST = L.S * 0.72;
  // the two factor circles through home — the private dials themselves
  torStroke(torRing('w', 0), cT, cyT, ST, '255,255,255', 0.30, 0.08, 1, dpr);
  torStroke(torRing('u', 0), cT, cyT, ST, '255,255,255', 0.30, 0.08, 1, dpr);
  // faint graticule
  for (const u of [Math.PI / 3, 2 * Math.PI / 3, 4 * Math.PI / 3, 5 * Math.PI / 3]) {
    torStroke(torRing('u', u), cT, cyT, ST, '255,255,255', 0.10, 0.03, 1, dpr);
  }
  // corners: each bracket balances at its own ±45°
  for (const c of [Math.PI / 2, -Math.PI / 2]) {
    torStroke(torRing('u', c), cT, cyT, ST, '242,180,95', 0.40, 0.10, 1, dpr, true);
    torStroke(torRing('w', c), cT, cyT, ST, '242,180,95', 0.40, 0.10, 1, dpr, true);
  }
  // TWO horizons — one per private denominator
  torStroke(torRing('u', Math.PI), cT, cyT, ST, '100,200,255', 0.55, 0.14, 1.2, dpr);
  torStroke(torRing('w', Math.PI), cT, cyT, ST, '100,200,255', 0.55, 0.14, 1.2, dpr);
  // the double crash (∞, ∞) — where the two horizons cross
  {
    const P = torProject(torP(Math.PI, Math.PI), cT, cyT, ST);
    ctx.strokeStyle = 'rgba(224,82,82,0.9)'; ctx.lineWidth = 1.4 * dpr;
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 5 * dpr, 0, 2 * Math.PI); ctx.stroke();
  }
  // home: both brackets at rest
  {
    const P = torProject(torP(0, 0), cT, cyT, ST);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 3 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  // the same signal on the tensor carrier: (2·atan(v₁/h), 2·atan(v₂/h))
  const tCurve = [];
  for (let i = 0; i <= 240; i++) {
    const q = shp.f((i % 240) / 240);
    tCurve.push(torP(2 * Math.atan(q.x / hSafe), 2 * Math.atan(q.y / hSafe)));
  }
  torStroke(tCurve, cT, cyT, ST, '242,180,95', 0.80, 0.22, 1.4, dpr);
  if (state.vhdPlay) {
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const t = vhdT - 0.07 + (0.07 * i) / 30;
      const q = shp.f(((t % 1) + 1) % 1);
      pts.push(torP(2 * Math.atan(q.x / hSafe), 2 * Math.atan(q.y / hSafe)));
    }
    torStroke(pts, cT, cyT, ST, '242,180,95', 0.95, 0.30, 2, dpr);
  }
  {
    const P = torProject(torP(2 * Math.atan(v1 / hSafe), 2 * Math.atan(v2 / hSafe)), cT, cyT, ST);
    ctx.fillStyle = P.d < 0 ? '#f2b45f' : 'rgba(242,180,95,0.5)';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(P.sx, P.sy, 1.8 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // captions: the two disciplines, in their own notation
  ctx.fillStyle = 'rgba(242,180,95,0.9)';
  ctx.fillText('(v₁ : v₂ : h)', L.cxL, L.yBot + 6 * dpr);
  ctx.fillText('(v₁ : h)(v₂ : h)', L.cxR, L.yBot + 6 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('one horizon', L.cxL, L.yBot + 22 * dpr);
  ctx.fillText('two horizons', L.cxR, L.yBot + 22 * dpr);
  // h readout, centre — the register the left carrier shares and the right pretends not to
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('h', (L.cxL + L.cxR) / 2, L.yBot + 6 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(hh.toFixed(3), (L.cxL + L.cxR) / 2, L.yBot + 22 * dpr);

  // presets + play/pause
  drawPresets(torusPresetZones(), dpr);
  {
    const z = torusPlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// The scope — the same signal in the time domain. Two channels, one per
// atom: v₁(t) above, v₂(t) below, both read against the same h (the blue
// dashed rails at ±h). Segments are coloured by chart — amber inside the
// aperture (home), blue outside (horizon) — and the gold dots are corner
// crossings, |v| = |h|. CURVATURE IS PHASE: the circle is nothing but two
// atoms 90° out of step; the ellipse the same step with unequal gains; the
// lissajous a 2:1 argument between them. h never appears in the phase —
// it only moves the rails. The small plane at right is the synthesis.
// ═════════════════════════════════════════════════════════════════════════
function scopeLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 30 * dpr;
  const paneH = yBot - yTop;
  const P = Math.min(paneH * 0.62, W * 0.20);
  const planeCx = W - 66 * dpr - P / 2;
  const x0 = 64 * dpr;
  const x1 = planeCx - P / 2 - 34 * dpr;
  return { yTop, yBot, paneH, x0, x1,
           cy1: yTop + paneH * 0.26, cy2: yTop + paneH * 0.72,
           A: paneH * 0.185, planeCx, planeCy: (yTop + yBot) / 2, P };
}
function scopePresetZones() { return presetZonesAt(scopeLayout().yTop); }
function scopePlayZone() { return playZoneAt(scopeLayout().yTop, 6); }
function drawScope(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = scopeLayout();
  const hh = (state.hVal == null) ? 1.2 : state.hVal;
  const hSafe = (Math.abs(hh) < 1 / 64) ? (hh < 0 ? -1 / 64 : 1 / 64) : hh;
  const v1 = (state.vVal == null) ? 0.45 : state.vVal;
  const v2 = (state.v2Val == null) ? 1.8 : state.v2Val;
  const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;

  // shared vertical scale: the largest excursion or the rail, whichever is taller
  let amp = Math.abs(hh);
  const N = 240, xs = [], ys = [];
  for (let i = 0; i <= N; i++) {
    const q = shp.f((i % N) / N);
    xs.push(q.x); ys.push(q.y);
    amp = Math.max(amp, Math.abs(q.x), Math.abs(q.y));
  }
  const scale = amp * 1.18;
  const px = i => L.x0 + (L.x1 - L.x0) * (i / N);
  const py = (v, cyc) => cyc - (v / scale) * L.A;

  const channel = (vals, cyc, glyph) => {
    // home line (v = 0) and the aperture rails (v = ±h)
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(L.x0, cyc); ctx.lineTo(L.x1, cyc); ctx.stroke();
    ctx.strokeStyle = 'rgba(100,200,255,0.35)';
    ctx.setLineDash([4 * dpr, 4 * dpr]);
    for (const sgn of [1, -1]) {
      const yr = py(sgn * Math.abs(hh), cyc);
      ctx.beginPath(); ctx.moveTo(L.x0, yr); ctx.lineTo(L.x1, yr); ctx.stroke();
    }
    ctx.setLineDash([]);
    // the wave, coloured by chart
    ctx.lineWidth = 1.6 * dpr;
    for (let i = 0; i < N; i++) {
      const home = Math.abs(vals[i]) <= Math.abs(hh) && Math.abs(vals[i + 1]) <= Math.abs(hh);
      ctx.strokeStyle = home ? 'rgba(242,180,95,0.85)' : 'rgba(100,200,255,0.85)';
      ctx.beginPath();
      ctx.moveTo(px(i), py(vals[i], cyc));
      ctx.lineTo(px(i + 1), py(vals[i + 1], cyc));
      ctx.stroke();
    }
    // corner crossings: |v| = |h|
    ctx.fillStyle = '#f2b45f';
    for (let i = 0; i < N; i++) {
      const a = Math.abs(vals[i]) - Math.abs(hh), b = Math.abs(vals[i + 1]) - Math.abs(hh);
      if ((a <= 0 && b > 0) || (a > 0 && b <= 0)) {
        const f = Math.abs(a) / (Math.abs(a) + Math.abs(b) + 1e-12);
        const vv = vals[i] + (vals[i + 1] - vals[i]) * f;
        ctx.beginPath(); ctx.arc(px(i + f), py(vv, cyc), 2.6 * dpr, 0, 2 * Math.PI); ctx.fill();
      }
    }
    // channel glyph + live read
    const cur = vals === xs ? v1 : v2;
    const av = Math.abs(cur), ah = Math.abs(hh);
    const M = Math.max(av, ah);
    const m = (M === 0) ? 0 : Math.min(av, ah) / M;
    const home = av <= ah;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(242,180,95,0.95)';
    ctx.fillText(glyph, 14 * dpr, cyc - 8 * dpr);
    ctx.fillStyle = home ? 'rgba(242,180,95,0.85)' : 'rgba(100,200,255,0.85)';
    ctx.fillText(m.toFixed(3), 14 * dpr, cyc + 8 * dpr);
  };
  channel(xs, L.cy1, 'v₁');
  channel(ys, L.cy2, 'v₂');

  // the sweep — one instant, cut through both channels at once
  const sx = L.x0 + (L.x1 - L.x0) * vhdT;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(sx, L.yTop + 6 * dpr); ctx.lineTo(sx, L.yBot - 6 * dpr); ctx.stroke();
  for (const [v, cyc] of [[v1, L.cy1], [v2, L.cy2]]) {
    const home = Math.abs(v) <= Math.abs(hh);
    ctx.fillStyle = home ? '#f2b45f' : '#64c8ff';
    ctx.beginPath(); ctx.arc(sx, py(v, cyc), 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(sx, py(v, cyc), 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // the synthesis: the two channels crossed, divided by their shared h
  {
    const S = L.P / 2, pcx = L.planeCx, pcy = L.planeCy;
    const U = S / 2.6;   // one unit
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(pcx - S, pcy); ctx.lineTo(pcx + S, pcy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pcx, pcy - S); ctx.lineTo(pcx, pcy + S); ctx.stroke();
    // the corner: the unit circle
    ctx.strokeStyle = 'rgba(242,180,95,0.40)';
    ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.arc(pcx, pcy, U, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(242,180,95,0.75)'; ctx.lineWidth = 1.3 * dpr;
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i <= N; i++) {
      const ox = xs[i] / hSafe, oy = ys[i] / hSafe;
      if (Math.abs(ox) > 2.5 || Math.abs(oy) > 2.5) { pen = false; continue; }
      const X = pcx + ox * U, Y = pcy - oy * U;
      pen ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      pen = true;
    }
    ctx.stroke();
    const ox = v1 / hSafe, oy = v2 / hSafe;
    if (Math.abs(ox) <= 2.5 && Math.abs(oy) <= 2.5) {
      ctx.fillStyle = '#f2b45f';
      ctx.beginPath(); ctx.arc(pcx + ox * U, pcy - oy * U, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = '#03040c';
      ctx.beginPath(); ctx.arc(pcx + ox * U, pcy - oy * U, 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(100,200,255,0.9)';
    ctx.fillText('h', pcx, pcy + S + 16 * dpr);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(hh.toFixed(3), pcx, pcy + S + 30 * dpr);
  }

  // presets + play/pause
  ctx.textAlign = 'center';
  drawPresets(scopePresetZones(), dpr);
  {
    const z = scopePlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// The eight — a familiar shape drawn with the CLOSED atom. The open
// semicircle of directions has three special points: home at the apex and
// two horizon feet, one per arm, each reaching for its own infinity. Close
// each signed half (0 ≡ ∞, the atom's weld) and the two arms curl up and
// bite the apex: three points fuse into ONE junction, and the semicircle
// becomes two circles connected at home. Junction = 0 ≡ +∞ ≡ −∞ (the seam,
// scarred red); the lobes' far points are the corners ±1 — the ℤ₄ landmark
// walk laid out as a figure of eight. One sweep of the line traverses both
// lobes once.
// ═════════════════════════════════════════════════════════════════════════
function eightLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 30 * dpr;
  const rowH = (yBot - yTop) / 2;
  const cy1 = yTop + rowH * 0.52, cy2 = yTop + rowH * 1.52;
  const RD = Math.min(rowH * 0.36, W * 0.11);      // open-figure radius
  const rc = Math.min(rowH * 0.26, W * 0.075);     // eight lobe radius
  const rp = Math.min(rowH * 0.20, W * 0.055);     // clover petal radius
  return { yTop, yBot, cy1, cy2, cxL: W * 0.27, cxR: W * 0.70, RD, rc, rp };
}
function eightPlayZone() { return playZoneAt(eightLayout().yTop); }
function drawEight(R, cx, dpr, yTopIgnored) {
  const L = eightLayout();
  const th = Math.max(-Math.PI / 2 + 1e-6, Math.min(Math.PI / 2 - 1e-6, state.theta));
  const r = Math.tan(th);
  const home = Math.abs(r) <= 1;
  const ballCol = home ? '#f2b45f' : '#64c8ff';
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';

  // ═══ ROW 1: the SEMICIRCLE (2 atoms) → the EIGHT (2 lobes) ═══
  {
    const cxD = L.cxL, yBase = L.cy1 + L.RD * 0.55, RD = L.RD;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(cxD - RD * 1.7, yBase); ctx.lineTo(cxD + RD * 1.7, yBase); ctx.stroke();
    const seg = (t0, t1, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1.6 * dpr;
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const t = t0 + (t1 - t0) * (i / 40);
        const x = cxD + RD * Math.sin(t), y = yBase - RD * Math.cos(t);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    };
    seg(-Math.PI / 4, Math.PI / 4, 'rgba(242,180,95,0.75)');
    seg(Math.PI / 4, Math.PI / 2, 'rgba(100,200,255,0.75)');
    seg(-Math.PI / 2, -Math.PI / 4, 'rgba(100,200,255,0.75)');
    const put = (t, col, rad) => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cxD + RD * Math.sin(t), yBase - RD * Math.cos(t), rad * dpr, 0, 2 * Math.PI); ctx.fill();
    };
    put(0, 'rgba(255,255,255,0.95)', 3.2);
    put(Math.PI / 4, 'rgba(242,180,95,0.95)', 2.8);
    put(-Math.PI / 4, 'rgba(242,180,95,0.95)', 2.8);
    put(Math.PI / 2, 'rgba(100,200,255,0.95)', 2.8);
    put(-Math.PI / 2, 'rgba(100,200,255,0.95)', 2.8);
    ctx.fillStyle = 'rgba(100,200,255,0.7)';
    ctx.fillText('−∞', cxD - RD, yBase + 14 * dpr);
    ctx.fillText('+∞', cxD + RD, yBase + 14 * dpr);
    ctx.fillStyle = ballCol;
    ctx.beginPath(); ctx.arc(cxD + RD * Math.sin(th), yBase - RD * Math.cos(th), 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(cxD + RD * Math.sin(th), yBase - RD * Math.cos(th), 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();

    // the eight
    const rc2 = L.rc, cyE = L.cy1;
    const cR = { x: L.cxR + rc2, y: cyE }, cL = { x: L.cxR - rc2, y: cyE };
    const lobe = (c, mirror) => {
      const arc = (a0, a1, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 1.6 * dpr;
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const a = a0 + (a1 - a0) * (i / 60);
          const px = c.x + rc2 * Math.cos(mirror ? Math.PI - a : a);
          const py = c.y + rc2 * Math.sin(a);
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.stroke();
      };
      arc(Math.PI, 2 * Math.PI, 'rgba(242,180,95,0.75)');
      arc(0, Math.PI, 'rgba(100,200,255,0.75)');
    };
    lobe(cR, false);
    lobe(cL, true);
    ctx.fillStyle = 'rgba(242,180,95,0.95)';
    ctx.beginPath(); ctx.arc(cR.x + rc2, cyE, 2.8 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.beginPath(); ctx.arc(cL.x - rc2, cyE, 2.8 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(L.cxR, cyE, 3.2 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(224,82,82,0.9)'; ctx.lineWidth = 1.3 * dpr;
    ctx.beginPath(); ctx.arc(L.cxR, cyE, 6.5 * dpr, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('0 ≡ ±∞', L.cxR, cyE + rc2 + 16 * dpr);
    const a = Math.PI + 4 * Math.atan(Math.abs(r));
    const c = r >= 0 ? cR : cL;
    const px = c.x + rc2 * Math.cos(r >= 0 ? a : Math.PI - a);
    const py = c.y + rc2 * Math.sin(a);
    ctx.fillStyle = ballCol;
    ctx.beginPath(); ctx.arc(px, py, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(px, py, 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // ═══ ROW 2: the CIRCLE (4 atoms) → the CLOVER (4 petals, one junction) ═══
  {
    // φ = 2θ: one sweep of the line is one full turn of the circle (slopes
    // double-cover directions); the same sweep visits all four petals once.
    const phi = 2 * th;
    const RD = L.RD, cxC = L.cxL, cyC = L.cy2;
    // the open circle, chart-coloured per quadrant-atom: amber near the
    // home points (E, W), blue near the horizon points (N, S)
    const seg = (p0, p1, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1.6 * dpr;
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const p = p0 + (p1 - p0) * (i / 40);
        const x = cxC + RD * Math.cos(p), y = cyC - RD * Math.sin(p);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    };
    for (let q = 0; q < 4; q++) {
      const base = q * Math.PI / 2;
      const colA = (q % 2 === 0) ? 'rgba(242,180,95,0.75)' : 'rgba(100,200,255,0.75)';
      const colB = (q % 2 === 0) ? 'rgba(100,200,255,0.75)' : 'rgba(242,180,95,0.75)';
      seg(base, base + Math.PI / 4, colA);
      seg(base + Math.PI / 4, base + Math.PI / 2, colB);
    }
    // landmarks: E/W home (white), N/S horizon (blue), diagonals corner (gold)
    const putC = (p, col, rad) => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(cxC + RD * Math.cos(p), cyC - RD * Math.sin(p), rad * dpr, 0, 2 * Math.PI); ctx.fill();
    };
    putC(0, 'rgba(255,255,255,0.95)', 3.2); putC(Math.PI, 'rgba(255,255,255,0.95)', 3.2);
    putC(Math.PI / 2, 'rgba(100,200,255,0.95)', 2.8); putC(3 * Math.PI / 2, 'rgba(100,200,255,0.95)', 2.8);
    for (let q = 0; q < 4; q++) putC(Math.PI / 4 + q * Math.PI / 2, 'rgba(242,180,95,0.95)', 2.8);
    ctx.fillStyle = ballCol;
    ctx.beginPath(); ctx.arc(cxC + RD * Math.cos(phi), cyC - RD * Math.sin(phi), 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(cxC + RD * Math.cos(phi), cyC - RD * Math.sin(phi), 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();

    // the clover: four petals on the diagonals, all biting one junction.
    // Adjacent quadrants shared their endpoints, so the four fusions chain:
    // E≡N, N≡W, W≡S, S≡E — every landmark end at ONE address.
    const rp = L.rp, J = { x: L.cxR, y: L.cy2 };
    const petal = q => {
      const dir = Math.PI / 4 + q * Math.PI / 2;             // NE, NW, SW, SE
      const cx2 = J.x + rp * Math.cos(dir), cy2 = J.y - rp * Math.sin(dir);
      const a0 = Math.atan2(J.y - cy2, J.x - cx2);           // angle centre → junction
      const arc = (u0, u1, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 1.6 * dpr;
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const u = u0 + (u1 - u0) * (i / 60);
          const x = cx2 + rp * Math.cos(a0 + u), y = cy2 + rp * Math.sin(a0 + u);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      };
      arc(0, Math.PI, 'rgba(242,180,95,0.75)');              // home half: junction → tip
      arc(Math.PI, 2 * Math.PI, 'rgba(100,200,255,0.75)');   // horizon half: tip → junction
      // corner at the tip
      ctx.fillStyle = 'rgba(242,180,95,0.95)';
      ctx.beginPath(); ctx.arc(J.x + 2 * rp * Math.cos(dir), J.y - 2 * rp * Math.sin(dir), 2.8 * dpr, 0, 2 * Math.PI); ctx.fill();
      return { cx2, cy2, a0 };
    };
    const P4 = [petal(0), petal(1), petal(2), petal(3)];
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(J.x, J.y, 3.2 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(224,82,82,0.9)'; ctx.lineWidth = 1.3 * dpr;
    ctx.beginPath(); ctx.arc(J.x, J.y, 6.5 * dpr, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('0 ≡ ∞ ≡ 0 ≡ ∞', J.x, J.y + 26 * dpr);
    // the reading on the clover: quadrant picks the petal, the local slope
    // angle wraps it — α = 4 × (angle into the quadrant)
    const phiN = ((phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const q = Math.floor(phiN / (Math.PI / 2)) % 4;
    const alpha = 4 * (phiN - q * Math.PI / 2);
    const pt = P4[q];
    const bx = pt.cx2 + rp * Math.cos(pt.a0 + alpha), by = pt.cy2 + rp * Math.sin(pt.a0 + alpha);
    ctx.fillStyle = ballCol;
    ctx.beginPath(); ctx.arc(bx, by, 4.5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(bx, by, 1.6 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('open', L.cxL, L.yBot + 6 * dpr);
  ctx.fillText('closed', L.cxR, L.yBot + 6 * dpr);

  // play/pause
  {
    const z = eightPlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// The bouquet — the sphere drawn with the closed atom. The sphere's atoms
// are the OCTANTS (mass π/2 each); the skeleton between them — the three
// coordinate great circles with the six axis points — is the address set:
// at least one register empty everywhere on it. Collapse each octant's
// boundary (the 2D form of gluing the arc's two ends) and the shared edges
// chain every fusion into ONE throat: the sphere becomes a bouquet of
// EIGHT spheres, the eight full corners (±1,±1,±1)/√3 surviving as the
// balloons' far poles. 8 × π/2 = 4π conserved; the weld is measure-free.
// Crossing any coordinate plane in the closed drawing means passing
// through the observer.
// ═════════════════════════════════════════════════════════════════════════
function bouquetLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 44 * dpr;
  const cy = (yTop + yBot) / 2;
  const S = Math.max(24 * dpr, Math.min((yBot - yTop) / 2.6, W / 5.6));
  return { cxL: W * 0.28, cxR: W * 0.72, cy, S, yTop, yBot };
}
function bouquetPresetZones() { return presetZonesAt(bouquetLayout().yTop); }
function bouquetPlayZone() { return playZoneAt(bouquetLayout().yTop); }
const BQ_DIRS = (() => {
  const out = [];
  for (const sx of [1, -1]) for (const sy of [1, -1]) for (const sz of [1, -1]) {
    const n = Math.sqrt(3);
    const d = { x: sx / n, y: sy / n, z: sz / n };
    // orthonormal frame ⊥ d for the azimuth
    let e1 = { x: -d.y, y: d.x, z: 0 };
    const m = Math.hypot(e1.x, e1.y, e1.z);
    e1 = { x: e1.x / m, y: e1.y / m, z: e1.z / m };
    const e2 = { x: d.y * e1.z - d.z * e1.y, y: d.z * e1.x - d.x * e1.z, z: d.x * e1.y - d.y * e1.x };
    out.push({ d, e1, e2, sx, sy, sz });
  }
  return out;
})();
// map a unit pointing to its balloon-surface point (world coords, |J| = 0)
function bouquetPoint(p) {
  const k = BQ_DIRS.findIndex(b => b.sx === (p.x >= 0 ? 1 : -1) && b.sy === (p.y >= 0 ? 1 : -1) && b.sz === (p.z >= 0 ? 1 : -1));
  const b = BQ_DIRS[k];
  const m = Math.min(Math.abs(p.x), Math.abs(p.y), Math.abs(p.z)) * Math.sqrt(3);   // 0 at skeleton, 1 at corner
  const beta = Math.PI * Math.min(1, m);
  const dot = p.x * b.d.x + p.y * b.d.y + p.z * b.d.z;
  let w = { x: p.x - b.d.x * dot, y: p.y - b.d.y * dot, z: p.z - b.d.z * dot };
  const wm = Math.hypot(w.x, w.y, w.z);
  if (wm > 1e-9) w = { x: w.x / wm, y: w.y / wm, z: w.z / wm };
  else w = b.e1;
  const RB = 1.0;                                    // balloon radius (world)
  const cB = { x: b.d.x * RB, y: b.d.y * RB, z: b.d.z * RB };
