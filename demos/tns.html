// ═════════════════════════════════════════════════════════════════════════
// The S³ bouquet — the ultimate rung, and the one with no open panel.
// S³'s atoms are the SIXTEEN orthant cells of (v₁ : v₂ : v₃ : h); the

function drawS3(R, cx, dpr, yTopIgnored) {

  const v1 = (state.vVal == null) ? 0.45 : state.vVal;

// ═════════════════════════════════════════════════════════════════════════
// The aperture atom — h modelled as an atom, on the semicircle.
// A bare h is unreadable (a unary read reads nothing): the plain ruler was

// slot without regress or an external unit is the same register ONE ACT
// AGO: the change-atom (h_now : h_then). Its read is the ZOOM — the only
// fact about the aperture an observer can hold. Corner = stillness
// (h_now = h_then, self-certified: balance needs no ruler) — at the APEX.
// Home = shut (left foot). Horizon = blown open (right foot). Closed, the
// two feet would glue: the blink. The dashed ray returns legitimately —
// the aperture's ratio is a slope. Cost of the whole reading: one

    for (const off of [-3.5, 3.5]) {
      ctx.beginPath();
      ctx.moveTo(C.x + off * dpr, yW - 6 * dpr);
      ctx.lineTo(C.x + off * dpr, yW + 6 * dpr);
      ctx.stroke();
    }
    const apex = pos(Math.PI / 2);                 // the gate — the one open meeting of the charts
    ctx.strokeStyle = 'rgba(127,176,105,0.45)';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.arc(apex.x, apex.y, 9 * dpr, 0, 2 * Math.PI); ctx.stroke();
  }
  // the corner glows when the aperture is genuinely still
  const still = Math.abs(z - 1) < 0.004 && !blink;
  if (still) {
    ctx.fillStyle = 'rgba(242,180,95,0.20)';
    const ap = pos(Math.PI / 2);
    ctx.beginPath(); ctx.arc(ap.x, ap.y, 14 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  put(Math.PI / 2, 'rgba(242,180,95,0.95)', still ? 4.2 : 3.2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('shut', C.x - L.RA, C.y + 16 * dpr);
  ctx.fillStyle = 'rgba(242,180,95,0.8)';
  ctx.fillText('still', C.x, C.y - L.RA - 12 * dpr);
  ctx.fillStyle = 'rgba(100,200,255,0.8)';
  ctx.fillText('blown', C.x + L.RA, C.y + 16 * dpr);
  // a blink — h changed sign since the last act: the seam flashes at both feet
  if (blink) {
    ctx.strokeStyle = 'rgba(224,82,82,0.9)'; ctx.lineWidth = 1.4 * dpr;
    for (const phi of [0, Math.PI]) {
      const p = pos(phi);
      ctx.beginPath(); ctx.arc(p.x, p.y, 7 * dpr, 0, 2 * Math.PI); ctx.stroke();
    }
  }
  // the memory's sediment: recent acts as fading dots on the arc
  for (let i = 0; i < apTrail.length; i++) {
    const t = apTrail[i];
    const phi = 2 * Math.atan(t.z);
    const p = pos(phi);
    const a = 0.05 + 0.35 * (i / apTrail.length);
    ctx.fillStyle = t.blink ? `rgba(224,82,82,${a.toFixed(3)})` : `rgba(242,180,95,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2 * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  // the dashed ray — restored with full rights: the aperture's ratio IS a slope
  const phi = 2 * Math.atan(z);
  const B = pos(phi);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.setLineDash([5 * dpr, 5 * dpr]);
  ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(C.x, C.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  ctx.setLineDash([]);
  // the reading
  ctx.fillStyle = homeCh ? '#f2b45f' : '#64c8ff';
  ctx.beginPath(); ctx.arc(B.x, B.y, 5.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = '#03040c';
  ctx.beginPath(); ctx.arc(B.x, B.y, 1.9 * dpr, 0, 2 * Math.PI); ctx.fill();

  // readouts: the two courts, then the k-calculus dictionary — the aperture
  // atom IS Bondi's k-factor, and this view is single-axis SR (§8.7's
  // H-signature branch): corner = rest, feet = the light cone, drag = boost.
  const vOverC = (z * z - 1) / (z * z + 1);      // v/c = tanh(ln k)
  const gamma = (z + 1 / z) / 2;                 // γ  = cosh(ln k)
  ctx.fillStyle = 'rgba(100,200,255,0.9)';
  ctx.fillText('h  (surveyor)', C.x - L.RA * 1.3, L.yBot + 14 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(hNow.toFixed(3), C.x - L.RA * 1.3, L.yBot + 28 * dpr);
  ctx.fillStyle = 'rgba(242,180,95,0.9)';
  ctx.fillText('k = h· : h', C.x - L.RA * 0.5, L.yBot + 14 * dpr);
  ctx.fillStyle = homeCh ? 'rgba(242,180,95,0.85)' : 'rgba(100,200,255,0.85)';
  ctx.fillText(m.toFixed(3), C.x - L.RA * 0.5, L.yBot + 28 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('v/c', C.x + L.RA * 0.25, L.yBot + 14 * dpr);
  ctx.fillStyle = homeCh ? 'rgba(242,180,95,0.85)' : 'rgba(100,200,255,0.85)';
  ctx.fillText((vOverC >= 0 ? '+' : '−') + Math.abs(vOverC).toFixed(3), C.x + L.RA * 0.25, L.yBot + 28 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('γ', C.x + L.RA * 0.8, L.yBot + 14 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(gamma.toFixed(3), C.x + L.RA * 0.8, L.yBot + 28 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('M = 1', C.x + L.RA * 1.35, L.yBot + 14 * dpr);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText('one accumulator', C.x + L.RA * 1.35, L.yBot + 28 * dpr);
}

// ═════════════════════════════════════════════════════════════════════════
// The beam — the balance beam overlaid on the single atom's dial (gbo §1.08
// on top of §1.5). The beam supplies the human intuition for the TWO ZEROS
// (§3.5): A = 0 and B = 0 both read 0 — same number, same saturation, the
// dial's one seam address — but the beam shows them as OPPOSITE POSTURES,
// fully tipped one way versus fully tipped the other. The read is the
// number; which pan sank is the chart; the seam is one address with two
// arrivals, and the beam is the arrival made bodily. Level is the corner:
// the one state the instrument certifies by symmetry alone, for free.
// The line drives r = A/B (A = |tan θ|, B = 1): one sweep rocks the beam
// through zero–corner–zero while the dial marker passes the SAME seam
// point twice, once from each side.
// ═════════════════════════════════════════════════════════════════════════
function beamLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 56 * dpr;
  const cy = yTop + (yBot - yTop) * 0.46;
  const Rd = Math.max(40 * dpr, Math.min((yBot - yTop) * 0.40, W * 0.17));
  return { cx: W / 2, cy, Rd, yTop, yBot };
}
function beamPlayZone() { return playZoneAt(beamLayout().yTop); }
function drawBeam(R, cx, dpr, yTopIgnored) {
  // the line edits the RATIO (the read's own coordinate); it writes through
  // to A holding B — but A and B are otherwise free: drag a pan to load it,
  // drag the fulcrum to scale BOTH (the common mode the read cannot see).
  if (_lastBeamTheta === null) _lastBeamTheta = state.theta;
  if (state.theta !== _lastBeamTheta) {
    _lastBeamTheta = state.theta;
    const t = Math.max(-Math.PI / 2 + 1e-6, Math.min(Math.PI / 2 - 1e-6, state.theta));
    const Bref = (Math.abs(state.beamB) > 1 / 64) ? Math.abs(state.beamB) : 1;
    state.beamB = Bref;
    state.beamA = Math.abs(Math.tan(t)) * Bref;
  }
  const L = beamLayout();
  const A = Math.abs(state.beamA), B = Math.abs(state.beamB);
  const dead = (A === 0 && B === 0);
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';

  const m = dead ? 0 : Math.min(A, B) / Math.max(A, B);
  const home = A <= B;
  const c = dead ? 0 : (A - B) / (A + B);
  const level = !dead && Math.abs(c) < 0.02;

  // ── the dial: the STANDARD DIAL, the beam overlaid on it ──
  drawAtomDial(L.cx, L.cy, L.Rd, dpr, A, B, { markerR: 5.5, arrivals: true, spoke: false });

  // ── the beam ──
  const tmax = 28 * Math.PI / 180;
  const tau = c * tmax;
  const Lb = L.Rd * 0.78;
  const eL = { x: L.cx - Lb * Math.cos(tau), y: L.cy + Lb * Math.sin(tau) };
  const eR = { x: L.cx + Lb * Math.cos(tau), y: L.cy - Lb * Math.sin(tau) };
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.moveTo(L.cx, L.cy);
  ctx.lineTo(L.cx - 7 * dpr, L.cy + 14 * dpr);
  ctx.lineTo(L.cx + 7 * dpr, L.cy + 14 * dpr);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = dead ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2.2 * dpr;
  ctx.beginPath(); ctx.moveTo(eL.x, eL.y); ctx.lineTo(eR.x, eR.y); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(L.cx, L.cy, 2.6 * dpr, 0, 2 * Math.PI); ctx.fill();
  const st = L.Rd * 0.34;
  const tot = A + B;
  const fmt = v => v === 0 ? '0' : (v < 1000 ? v.toFixed(2) : '≫');
  const pan = (e, val, col, glyph) => {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x, e.y + st); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.6 * dpr;
    ctx.beginPath(); ctx.moveTo(e.x - 13 * dpr, e.y + st); ctx.lineTo(e.x + 13 * dpr, e.y + st); ctx.stroke();
    if (val > 0 && tot > 0) {
      const rad = (2.5 + 8.5 * Math.sqrt(val / tot)) * dpr;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(e.x, e.y + st - rad, rad, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.fillStyle = col;
    ctx.fillText(glyph, e.x, e.y + st + 16 * dpr);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(fmt(val), e.x, e.y + st + 30 * dpr);
  };
  pan(eL, A, 'rgba(242,180,95,0.9)', 'A');
  pan(eR, B, 'rgba(100,200,255,0.9)', 'B');

  // readouts
  if (dead) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('—', L.cx, L.cy + L.Rd + 24 * dpr);
    ctx.fillText('(0 : 0) — two empty pans, level, asserting nothing: no weighing', L.cx, L.yBot + 10 * dpr);
  } else {
    ctx.fillStyle = home ? 'rgba(242,180,95,0.85)' : 'rgba(100,200,255,0.85)';
    ctx.fillText(m.toFixed(3), L.cx, L.cy + L.Rd + 24 * dpr);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    if (dragging && dragMode === 'beamBoth') {
      ctx.fillText('common mode — both pans scaled together; the read cannot see this', L.cx, L.yBot + 10 * dpr);
    } else if (m < 0.035) {
      ctx.fillText(home ? 'zero: A empty — tipped right' : 'zero: B empty — tipped left', L.cx, L.yBot + 10 * dpr);
      ctx.fillText('same address, opposite posture', L.cx, L.yBot + 26 * dpr);
    } else if (level) {
      ctx.fillText('level — the corner certifies itself', L.cx, L.yBot + 10 * dpr);
    } else {
      ctx.fillText('the read is the number; the posture is the chart', L.cx, L.yBot + 10 * dpr);
    }
  }

  // play/pause
  {
    const z = beamPlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// The sequence — the Tangent Bridge as a toy. Each atom resolves to ONE
// number, so a shape IS a sequence of numbers: read the boundary at the
// N = 2^(d+1) leaf directions (odd multiples of π/N — at d = 1 these are
// the four corner diagonals), and the shape becomes its word. The kernel
// K_N(φ) = sin(Nφ/2)/(N·tan(φ/2)) presents the word back continuously —
// exact at the atoms, bounded between (R1–R3). The circle's word is four
// equal numbers: equality across the sequence IS roundness; deviation from
// equality IS shape. Refinement nests as INFORMATION, not seats: the
// odd-dyadic lattices at distinct depths are disjoint (every + reads at
// fresh directions), but V_N ⊂ V_2N — the coarse word is exactly
// recoverable from the fine one. Content persists; seats are memoryless.
// ═════════════════════════════════════════════════════════════════════════
function kernelKN2P(phi, N) {
  // 2π-period product form (closed loop). Renamed: this used to redeclare
  // kernelKN, and a duplicate function declaration silently wins for the
  // WHOLE scope — the π-period inside-view kernel (top of file) was being
  // shadowed for its own callers. Two kernels, two names, one lattice each.
  let p = ((phi % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  if (p > Math.PI) p -= 2 * Math.PI;
  const s2 = Math.sin(p / 2);
  if (Math.abs(s2) < 1e-9) return 1;
  return Math.sin(N * p / 2) * Math.cos(p / 2) / (N * s2);   // product form: K(±π) = 0
}
function seqLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R + 8 * dpr;
  const yBot = H - 24 * dpr;
  const stripH = 88 * dpr;
  const stripTop = yBot - stripH;
  const cy = (yTop + stripTop) / 2;
  const S = Math.max(24 * dpr, Math.min((stripTop - yTop) / 5.2, W / 6.5));
  return { yTop, yBot, stripTop, stripH, cx: W / 2, cy, S,
           x0: 90 * dpr, x1: W - 90 * dpr };
}
function seqPresetZones() { return presetZonesAt(seqLayout().yTop); }
function seqPlayZone() { return playZoneAt(seqLayout().yTop); }
function seqDepthZones() {
  const dpr = devicePixelRatio;
  const L = seqLayout();
  const cy = L.stripTop + L.stripH / 2;
  return [{ d: -1, cx: 44 * dpr, cy, r: 14 * dpr }, { d: +1, cx: canvas.width - 44 * dpr, cy, r: 14 * dpr }];
}
function drawSeq(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = seqLayout();
  const hh = (state.hVal == null) ? 1.2 : state.hVal;
  const hS = Math.max(Math.abs(hh), 1 / 64);
  const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
  const N = Math.pow(2, state.seqDepth + 1);
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';

  // dense boundary → radial table (nearest-angle read; the shape as ρ(θ))
  const SAMP = 720, angs = new Array(SAMP), rads = new Array(SAMP);
  for (let i = 0; i < SAMP; i++) {
    const q = shp.f(i / SAMP);
    angs[i] = Math.atan2(q.y, q.x);
    rads[i] = Math.hypot(q.x, q.y);
  }
  const radialAt = th => {
    let best = 1e9, r = 0;
    for (let i = 0; i < SAMP; i++) {
      let d = Math.abs(angs[i] - th) % (2 * Math.PI);
      if (d > Math.PI) d = 2 * Math.PI - d;
      if (d < best) { best = d; r = rads[i]; }
    }
    return r;
  };

  // the atoms at their leaf seats: θ_k = (2j+1)π/N, one read per seat
  const thK = [], rhoK = [], mK = [], homeK = [];
  for (let j = 0; j < N; j++) {
    const th = (2 * j + 1) * Math.PI / N;
    const rho = radialAt(th);
    thK.push(th); rhoK.push(rho);
    const M = Math.max(rho, hS);
    mK.push(M === 0 ? 0 : Math.min(rho, hS) / M);
    homeK.push(rho <= hS);
  }
  const recon = th => {
    let acc = 0;
    for (let j = 0; j < N; j++) acc += rhoK[j] * kernelKN2P(th - thK[j], N);
    return acc;
  };

  // ── the plane: unit ticks, the true shape (faint), the word made flesh ──
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(L.cx - L.S * 2.4, L.cy); ctx.lineTo(L.cx + L.S * 2.4, L.cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L.cx, L.yTop + 6 * dpr); ctx.lineTo(L.cx, L.stripTop - 6 * dpr); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  for (const sgn of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(L.cx + sgn * L.S, L.cy - 4 * dpr); ctx.lineTo(L.cx + sgn * L.S, L.cy + 4 * dpr); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L.cx - 4 * dpr, L.cy - sgn * L.S); ctx.lineTo(L.cx + 4 * dpr, L.cy - sgn * L.S); ctx.stroke();
  }
  // true boundary, observed (÷h) — what the sequence was read from
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath();
  for (let i = 0; i <= 240; i++) {
    const q = shp.f((i % 240) / 240);
    const px = L.cx + (q.x / hS) * L.S, py = L.cy - (q.y / hS) * L.S;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  // the kernel presentation of the word: exact at the atoms, bounded between
  ctx.strokeStyle = 'rgba(242,180,95,0.85)'; ctx.lineWidth = 1.5 * dpr;
  ctx.beginPath();
  for (let i = 0; i <= 360; i++) {
    const th = (i / 360) * 2 * Math.PI;
    const rr = recon(th) / hS;
    const px = L.cx + rr * Math.cos(th) * L.S, py = L.cy - rr * Math.sin(th) * L.S;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  // the atoms on the boundary — gold where the word was read
  for (let j = 0; j < N; j++) {
    const px = L.cx + (rhoK[j] / hS) * Math.cos(thK[j]) * L.S;
    const py = L.cy - (rhoK[j] / hS) * Math.sin(thK[j]) * L.S;
    ctx.fillStyle = 'rgba(242,180,95,0.95)';
    ctx.beginPath(); ctx.arc(px, py, (N <= 8 ? 3.4 : 2.4) * dpr, 0, 2 * Math.PI); ctx.fill();
  }
  // the sweep: a reader walking the presentation
  if (state.vhdPlay) {
    const th = 2 * Math.PI * vhdT;
    const rr = recon(th) / hS;
    const px = L.cx + rr * Math.cos(th) * L.S, py = L.cy - rr * Math.sin(th) * L.S;
    ctx.fillStyle = '#f2b45f';
    ctx.beginPath(); ctx.arc(px, py, 5 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(px, py, 1.8 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

  // ── the word, combined: the shape read ONCE — min over max of its own
  // reads, the primitive applied to its own output. Two registers carried
  // (smallest-so-far, largest-so-far), one resolution: circles land on the
  // corner (the only all-equal word), needles on the seam, every shape one
  // marker on the standard dial. Rotation-, scale-, and aperture-invariant:
  // one number per similarity class — all a scale-free observer may keep.
  {
    let mn = Infinity, mx = 0;
    for (const v of mK) { if (v < mn) mn = v; if (v > mx) mx = v; }
    const dr = Math.min(30 * dpr, L.S * 0.5);
    const dx = Math.max(58 * dpr, L.cx - L.S * 2.4 - dr - 30 * dpr);
    const rdS = drawAtomDial(dx, L.cy, dr, dpr, mn, mx, { markerR: 4 });
    ctx.font = `${11 * dpr}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('the word, read once', dx, L.cy + dr + 20 * dpr);
    ctx.fillStyle = rdS.m > 0.98 ? 'rgba(242,180,95,0.9)' : 'rgba(255,255,255,0.7)';
    ctx.fillText(rdS.m.toFixed(3), dx, L.cy + dr + 36 * dpr);
  }

  // ── the strip: the shape AS its word — N reads, one bar per atom ──
  {
    const x0 = L.x0, x1 = L.x1, w = (x1 - x0) / N;
    const base = L.stripTop + L.stripH - 26 * dpr;
    const hMax = L.stripH - 40 * dpr;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(x1, base); ctx.stroke();
    // corner line: read = 1 — the whole word of a circle at the aperture's scale
    ctx.strokeStyle = 'rgba(242,180,95,0.25)'; ctx.setLineDash([3 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.moveTo(x0, base - hMax); ctx.lineTo(x1, base - hMax); ctx.stroke();
    ctx.setLineDash([]);
    const sweepJ = state.vhdPlay ? Math.floor((vhdT * N)) % N : -1;
    for (let j = 0; j < N; j++) {
      const bx = x0 + (j + 0.5) * w;
      const bh = mK[j] * hMax;
      const col = homeK[j] ? '242,180,95' : '100,200,255';
      ctx.fillStyle = `rgba(${col},${j === sweepJ ? 0.95 : 0.6})`;
      ctx.fillRect(bx - Math.min(w * 0.32, 9 * dpr), base - bh, Math.min(w * 0.64, 18 * dpr), bh);
      if (N <= 8) {
        ctx.fillStyle = `rgba(${col},0.9)`;
        ctx.fillText(mK[j].toFixed(3), bx, base + 16 * dpr);
      }
    }
    for (const z of seqDepthZones()) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath(); ctx.arc(z.cx, z.cy, z.r, 0, 2 * Math.PI); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = `${14 * dpr}px 'Courier New', monospace`;
      ctx.fillText(z.d < 0 ? '−' : '+', z.cx, z.cy + 5 * dpr);
    }
    ctx.font = `${11 * dpr}px 'Courier New', monospace`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`N = ${N} — the shape, as ${N} resolved numbers`, L.cx, L.stripTop + 2 * dpr);
  }

  drawPresets(seqPresetZones(), dpr);
  {
    const z = seqPlayZone();
    drawPlayButton(z, dpr);
  }
}

// ═════════════════════════════════════════════════════════════════════════
// The number — what the shape's single read is COMPOSED OF, and how to
// change it. The fold keeps exactly two atoms of the word: the thinnest
// read and the fattest. The two rays show them; the beam weighs them; the
// dial resolves them. DRAG THE BOUNDARY to reshape: the number moves ONLY
// when an extreme moves — the middle is invisible to it (that is the
// pigeonhole, felt). Fill the thin direction and the number rises; fatten

  //                the beams do not tilt a degree, only the load changes.
  // Reading is not adding (§8.5): the sum is not the atom's read but the lift's
  // linear coordinate — what the fulcrum FEELS, not what the dial sees.
  // Signs restored: the RIGHT atom is the positive register, the LEFT the
  // negative one. Both registers are plain positive magnitudes; the signed
  // number is the DIFFERENCE A − B. Sign is an address (which atom holds the
  // testimony), not a property of any magnitude. The two ops are then the two
  // classical reads of a pair, each with its own blindness:
  //   ratio  A/B — blind to the multiplicative common mode (scale);
  //   signed A−B — blind to the additive common mode (A+k, B+k reads the same).
  // Line-drag preimages follow: ratio-drag counter-rotates (geometric mean
  // held); signed-drag counter-SHIFTS (A up, B down by d/2 — the additive
  // antisymmetric write). Zero is A = B: balance, not emptiness — every pair
  // (k, k) reads zero, the two-zeros ladder in the additive court.
  // The two atoms are DISCONNECTED objects, and one is selected at a time
  // (press a loop to select it). The top line is the selected atom's own
  // instrument: it shows THAT register's spot and a line-drag writes THAT
  // register alone — the vhd convention, one register under the hand. The
  // unselected atom's value still appears on the line as its own dot, at its
  // own spot. The combined verdicts (ratio, signed sum) live in the readout
  // and the beam — reads, never handles.
  if (_elDerivedTheta !== null && Math.abs(state.theta - _elDerivedTheta) > 1e-12) {

    if (state.elSel === 'B') state.beamB = want; else state.beamA = want;
  }

  const B = Math.max(1e-3, Math.min(1e3, state.beamB));
  const r = A / B, diff = A - B;
  // scale-free display: significant digits, not fixed decimals — fixed decimal
  // places privilege a scale (the grid's habit); ratios get equal significance
  // at every magnitude. Also keeps the printed equation self-consistent.
  const fm = v => parseFloat(v.toPrecision(4)).toString();
  const sel = state.elSel === 'B' ? B : A;
  state.theta = Math.atan(sel);
  _elDerivedTheta = state.theta;
  const home = r <= 1;
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';

  const cR = { x: L.cx + L.rc, y: L.cy }, cL = { x: L.cx - L.rc, y: L.cy };
  // Upper halves: the home chart (|r| ≤ 1), gold — one band, undivided.
  // Lower halves: the far chart drawn as the RUNG LADDER it is — each colored
  // segment is one rung, |r| ∈ [2^k, 2^{k+1}), the same band palette as the
  // number line above. The segments shrink toward the junction the way the
  // rungs crowd toward the horizon: infinitely many bands, finite arc — the
  // cascade laid onto the closed atom, dyadic walls as dots.
  const arcSeg = (c, mirror, a0, a1, col, lw) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw * dpr;
    ctx.beginPath();
    const steps = Math.max(6, Math.round(36 * Math.abs(a1 - a0) / Math.PI));
    for (let i = 0; i <= steps; i++) {

      const px = mirror ? c.x - L.rc * Math.cos(a) : c.x + L.rc * Math.cos(a);
      i ? ctx.lineTo(px, c.y + L.rc * Math.sin(a)) : ctx.moveTo(px, c.y + L.rc * Math.sin(a));

  };
  const NRUNG = 8;
  for (const mirror of [false, true]) {

    // One undivided segment: the home chart needs no ladder.
    arcSeg(c, mirror, Math.PI, 2 * Math.PI, `rgba(${bandColorRGB(0)},0.85)`, 2);
    // far chart rungs: rung k spans s = 4·atan(2^k) … 4·atan(2^{k+1})
    for (let k = 0; k < NRUNG; k++) {
      const s0 = 4 * Math.atan(Math.pow(2, k));
      const s1 = (k === NRUNG - 1) ? 2 * Math.PI - 0.015 : 4 * Math.atan(Math.pow(2, k + 1));
      arcSeg(c, mirror, Math.PI + s0, Math.PI + s1, `rgba(${bandColorRGB(k + 1)},0.85)`, 2);
      // rung wall: a dot at |r| = 2^k  (k+1 matches the top line's banding, whose
      // band 0 is |x| < 1 — the home chart — so rung 0 here wears the [1,2) color)
      const aw = Math.PI + s0;
      const wx = mirror ? c.x - L.rc * Math.cos(aw) : c.x + L.rc * Math.cos(aw);
      ctx.fillStyle = `rgba(${bandColorRGB(k + 1)},0.95)`;

  }

  // landmark dots, mirrored on both lobes: |r| = tan(s/4), s measured from the junction
  const putAt = (right, sVal, col, rad) => {

    const py = c.y + L.rc * Math.sin(a);

    putAt(right, 4 * Math.atan(0.5), 'rgba(255,255,255,0.35)', 1.8);         // |r| = 1/2 (the home chart's mirror wall)
  }

  ctx.fillText('1', cR.x + L.rc + 12 * dpr, cR.y + 4 * dpr);
  ctx.fillText('1', cL.x - L.rc - 12 * dpr, cL.y + 4 * dpr);
  {
    const selR = state.elSel !== 'B';
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 5 * dpr;
    ctx.beginPath();
    ctx.arc(selR ? cR.x : cL.x, L.cy, L.rc + 5 * dpr, 0, 2 * Math.PI); ctx.stroke();

    // variables: whichever atom currently holds the smaller value is min(a,b),
    // the other max(a,b) — the tags trade places live when the pair crosses balance
    ctx.font = `${11 * dpr}px 'Courier New', monospace`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(A <= B ? 'min(a,b)' : 'max(a,b)', cR.x, cR.y - L.rc - 34 * dpr);
    ctx.fillText(B <= A ? 'min(a,b)' : 'max(a,b)', cL.x, cL.y - L.rc - 34 * dpr);
    ctx.font = `${18 * dpr}px 'Courier New', monospace`;
    ctx.fillStyle = selR ? 'rgba(242,180,95,0.95)' : 'rgba(242,180,95,0.6)';
    ctx.fillText(fm(A), cR.x, cR.y - L.rc - 12 * dpr);
    ctx.fillStyle = !selR ? 'rgba(100,200,255,0.95)' : 'rgba(100,200,255,0.6)';
    ctx.fillText(fm(B), cL.x, cL.y - L.rc - 12 * dpr);
    ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  }

  // The inner square's image under closure. On the dome, the square's top side is
  // the keep chord between the two balance points (±1, the corners). Close the
  // atoms and the chord survives as this straight line, corner to corner — and its
  // MIDPOINT lands exactly on the seam: 0 is the midpoint of [−1, +1] on the open
  // line, and the junction is where 0 lives on the closed one. The square's other
  // sides — the ladders dropping toward the horizon — became the rung arcs above.

  ctx.beginPath();
  ctx.moveTo(cL.x - L.rc, L.cy); ctx.lineTo(cR.x + L.rc, L.cy);
  ctx.stroke();

  // The balance beam inside each atom: pans loaded rise (gold) against run
  // (band-0 blue), fulcrum standing on the keep chord. The beam tilts run-heavy
  // at home (0:1), passes LEVEL exactly at the corner (1:1 — the marker at the
  // lobe's far point), and tips rise-heavy climbing the ladder toward the seam.
  // Equilibrium and the corner are the same event, seen by two instruments.
  // THE balance beam — one, for the pair, because the pair is one act.
  // The fulcrum stands on the seam (where zero lives in the signed read); the
  // arms reach corner to corner, so at level the beam LIES ON the keep chord —
  // equilibrium and the keep interval are the same line. A hangs from the east
  // arm (gold), B from the west (blue); tilt is the bounded chart
  // (A−B)/(A+B), heavier atom dips, level exactly at A = B — ratio 1, signed 0,
  // the corner value — at any load.
  {

    // THE TRUE TILT, held as a SLOPE — no angles: bounded observers use slopes.
    // The beam's slope is (A − B)/(A + B), a ratio of register sums, and it is

    // way, the extremes reached only as a register vanishes. |slope| = 1 is the
    // corner slope — the beam physically cannot tilt past it: the keep window

    // computes an angle: direction comes from the held pair (1 : slope), one

    ctx.beginPath(); ctx.moveTo(eW.x, eW.y); ctx.lineTo(eE.x, eE.y); ctx.stroke();

    // one unit of run along the chord, (A−B)/(A+B) of rise up to the beam
    if (Math.abs(sl) > 0.02) {

      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.1 * dpr;
      ctx.beginPath(); ctx.moveTo(L.cx, L.cy); ctx.lineTo(L.cx + G, L.cy); ctx.stroke();       // run = 1
      ctx.strokeStyle = 'rgba(242,180,95,0.7)'; ctx.lineWidth = 1.3 * dpr;
      ctx.beginPath(); ctx.moveTo(L.cx + G, L.cy); ctx.lineTo(L.cx + G, L.cy - G * sl); ctx.stroke();  // rise = slope
    }

    for (const [e, v, col] of [[eW, B, '100,200,255'], [eE, A, '242,180,95']]) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1 * dpr;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x, e.y + 13 * dpr); ctx.stroke();

      ctx.fillStyle = `rgba(${col},0.9)`;

  // the junction: home AND horizon — one address, the seam
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.arc(L.cx, L.cy, 3.4 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(224,82,82,0.9)'; ctx.lineWidth = 1.4 * dpr;
  ctx.beginPath(); ctx.arc(L.cx, L.cy, 7 * dpr, 0, 2 * Math.PI); ctx.stroke();


  // two markers — one register per loop, each at 4·atan(value) up its own ladder
  for (const [right, v, col] of [[true, A, '#f2b45f'], [false, B, '#64c8ff']]) {
    const a = Math.PI + 4 * Math.atan(v);

  // dome (it IS the line's value); the other appears at its own spot, offset by
  // the difference of the registers in line units. Two atoms, two addresses.
  {
    const chordY = 80 * dpr;
    const W = canvas.width;
    for (const [v, col, isSel] of [[A, '242,180,95', state.elSel !== 'B'], [B, '100,200,255', state.elSel === 'B']]) {

    ctx.strokeStyle = 'rgba(242,180,95,0.45)'; ctx.lineWidth = 1.2 * dpr;
    ctx.beginPath(); ctx.arc(L.cx, L.cy + 6 * dpr, 11 * dpr, 0, 2 * Math.PI); ctx.stroke();

  // the result, beneath the fulcrum — the atom's canonical read: min/max ∈ [0, 1]
  {
    ctx.textAlign = 'center';
    ctx.font = `${17 * dpr}px 'Courier New', monospace`;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';

    // it is always min-tagged / max-tagged, whichever sides they sit on.

  // The quotient is a resolved pointing, and a resolved pointing has the full
  // anatomy: home/seam, corner, ladder. So the read is drawn as a third closed
  // atom beneath the fulcrum — the recursion as a generation: registers → read,
  // reads → registers of the read above. It has NO handle anywhere: reads are

          : ctx.moveTo(cc.x + r2 * Math.cos(a), cc.y + r2 * Math.sin(a));

    };

    // down the east side (band 0), the rung ladder climbing home up the west
    seg(-Math.PI / 2, Math.PI / 2, `rgba(${bandColorRGB(0)},0.8)`, 1.8);
    for (let k = 0; k < 8; k++) {
      const s0 = 4 * Math.atan(Math.pow(2, k));
      const s1 = (k === 7) ? 2 * Math.PI - 0.015 : 4 * Math.atan(Math.pow(2, k + 1));
      seg(-Math.PI / 2 + s0, -Math.PI / 2 + s1, `rgba(${bandColorRGB(k + 1)},0.85)`, 1.8);
    }
    // corner (1) at the bottom, seam at the top
    ctx.fillStyle = 'rgba(242,180,95,0.95)';
    ctx.beginPath(); ctx.arc(cc.x, cc.y + r2, 2.4 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(cc.x, cc.y - r2, 2.6 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(224,82,82,0.9)'; ctx.lineWidth = 1.2 * dpr;
    ctx.beginPath(); ctx.arc(cc.x, cc.y - r2, 5.5 * dpr, 0, 2 * Math.PI); ctx.stroke();

    ctx.fillStyle = v <= 1 ? '#f2b45f' : '#64c8ff';
    ctx.beginPath(); ctx.arc(mx2, my2, 4.2 * dpr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#03040c';
    ctx.beginPath(); ctx.arc(mx2, my2, 1.5 * dpr, 0, 2 * Math.PI); ctx.fill();
  }

}

// ═══ THE SKY — the celestial sphere under boost: the full group's entrance. ═══
// The carrier is the horizon of the 3-pointing (gbo §12.10): pure directions, no
// depth. A boost acts on it by ONE Möbius map — the classical Penrose fact — and
// this pane shows it live: the top line holds RAPIDITY ζ (the log chart, the
// additive coordinate), β = tanh ζ, and every star's bearing μ = cos∠(star, axis)
// flows by μ' = (μ+β)/(1+βμ). Forward crowding is aberration; the tint is the
// per-direction Doppler 1/(γ(1−βμ)); the ring constellations stay CIRCLES at any
// ζ — Möbius maps take circles to circles — which is §6.6's Terrell clause drawn:

  }

    const pts = [];
    for (let m = 0; m < 40; m++) {
      const t = m / 40 * 2 * Math.PI, cs = Math.cos(rho), sn = Math.sin(rho);
      pts.push([ c[0] * cs + sn * (u[0] * Math.cos(t) + v[0] * Math.sin(t)),
                 c[1] * cs + sn * (u[1] * Math.cos(t) + v[1] * Math.sin(t)),

}
function skyLayout() {

function drawSky(R, cx, dpr, yTopIgnored) {

  };
  // faint sphere shell
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.arc(L.cx, L.cy, L.S, 0, 2 * Math.PI); ctx.stroke();
  // ring constellations — circles in, circles out, at every ζ
  ctx.lineWidth = 1.2 * dpr;
  for (const ring of _skyRings) {
    ctx.beginPath();
    let started = false;
    for (const q of ring) {
      const p = proj(aber(q));
      if (p.Z < -0.15) { started = false; continue; }     // cull the far side for legibility
      if (!started) { ctx.moveTo(p.px, p.py); started = true; }
      else ctx.lineTo(p.px, p.py);
    }
    ctx.strokeStyle = 'rgba(180,190,220,0.35)';
    ctx.stroke();
  }
  // stars, Doppler-tinted: blue fore (D>1), red aft (D<1)
  for (const st of _skyStars) {
    const w = aber(st);
    const p = proj(w);
    if (p.Z < -0.15) continue;
    const D = dopp(st);
    const t = Math.max(-1, Math.min(1, Math.log(D) * 1.6));
    let rC, gC, bC;
    if (t >= 0) { rC = 255 - 130 * t; gC = 225 - 40 * t; bC = 180 + 75 * t; }
    else { rC = 255; gC = 225 + 60 * t; bC = 180 + 110 * t; }
    const zNorm = Math.max(0, Math.min(1, (p.Z + 1) / 2));
    const alpha = st[3] * (0.35 + 0.6 * zNorm);
    ctx.fillStyle = `rgba(${rC | 0},${gC | 0},${bC | 0},${alpha.toFixed(3)})`;
    const rad = (0.9 + 1.5 * st[3] * (0.5 + 0.5 * zNorm)) * dpr * (D > 1 ? Math.min(1.6, Math.sqrt(D)) : 1);
    ctx.beginPath(); ctx.arc(p.px, p.py, rad, 0, 2 * Math.PI); ctx.fill();
  }
  // the boost's two fixed points — fore (gold, glowing with ζ) and aft (the drain)
  for (const [dir, col, glow] of [[[1, 0, 0], 'rgba(242,180,95,0.95)', true], [[-1, 0, 0], 'rgba(120,140,200,0.8)', false]]) {
    const p = proj(dir);
    if (p.Z < -0.15) continue;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.px, p.py, 3.2 * dpr, 0, 2 * Math.PI); ctx.fill();
    if (glow && Math.abs(zeta) > 0.02) {
      ctx.strokeStyle = 'rgba(242,180,95,0.35)'; ctx.lineWidth = 1 * dpr;
      ctx.beginPath(); ctx.arc(p.px, p.py, (6 + 3 * Math.abs(beta)) * dpr, 0, 2 * Math.PI); ctx.stroke();
    }
  }
  // ── the synthesis witness: one k, two readings (sr §9.1) ──
  // A ring of directions at half-angle t0 about each fixed point, drawn at rest
  // (dashed) and under the boost (solid). In the tan-half-angle chart the map is
  // tan(θ'/2) = e^∓ζ tan(θ/2), so the fore ring closes by EXACTLY 1/k and the
  // aft ring opens by EXACTLY k, at any t0 — the k-factor of the one-axis
  // exchange (§7) is the multiplier of the sky flow at its fixed points.
  const t0 = 0.24, kfac = Math.exp(zeta);
  const ringDirs = (sgn, th) => {
    const pts = [];
    for (let j = 0; j <= 48; j++) {
      const ph = 2 * Math.PI * j / 48;
      pts.push([sgn * Math.cos(th), Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph)]);
    }
    return pts;
  };
  for (const sgn of [1, -1]) {
    const col = sgn > 0 ? '242,180,95' : '120,140,200';
    ctx.setLineDash([3 * dpr, 4 * dpr]);                 // the resting ring — the reference
    ctx.strokeStyle = `rgba(${col},0.30)`; ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); let stW = false;
    for (const q of ringDirs(sgn, t0)) {
      const p = proj(q);
      if (p.Z < -0.15) { stW = false; continue; }
      if (!stW) { ctx.moveTo(p.px, p.py); stW = true; } else ctx.lineTo(p.px, p.py);
    }
    ctx.stroke();
    ctx.setLineDash([]);                                 // its image under the boost
    ctx.strokeStyle = `rgba(${col},0.85)`; ctx.lineWidth = 1.4 * dpr;
    ctx.beginPath(); stW = false;
    for (const q of ringDirs(sgn, t0)) {
      const p = proj(aber(q));
      if (p.Z < -0.15) { stW = false; continue; }
      if (!stW) { ctx.moveTo(p.px, p.py); stW = true; } else ctx.lineTo(p.px, p.py);
    }
    ctx.stroke();
    // the measured multiplier, read off the sky itself (tan-half-angle, exact)
    const mu0 = sgn * Math.cos(t0);
    const mu1 = (mu0 + beta) / (1 + beta * mu0);
    const thIm = Math.acos(Math.max(-1, Math.min(1, sgn * mu1)));
    const mult = Math.tan(thIm / 2) / Math.tan(t0 / 2);
    const fp = proj([sgn, 0, 0]);
    if (fp.Z >= -0.15 && Math.abs(zeta) > 0.02) {
      ctx.font = `${10.5 * dpr}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(${col},0.9)`;
      ctx.fillText('×' + mult.toFixed(3) + (sgn > 0 ? ' = 1/k' : ' = k'),
                   fp.px, fp.py + (Math.sin(t0) * L.S + 16 * dpr));
    }
  }
  // readouts
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('ζ ' + zeta.toFixed(2) + ' · β ' + beta.toFixed(3) + ' · γ ' + gam.toFixed(3) + ' · k ' + kfac.toFixed(3) + ' · 1/k ' + (1 / kfac).toFixed(3), 24 * dpr, L.yTop + 18 * dpr);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('the sky under boost — one Möbius map moves every star; the rings stay circles', L.cx, L.yBot + 12 * dpr);
  ctx.fillText('one k, two readings: the line holds ζ (k = e^ζ) · the fixed rings close ×1/k fore, open ×k aft', L.cx, L.yBot + 28 * dpr);
}

// ═══ THE RADAR PAIR — sr §10's witness ═══════════════════════════════════
// One act of radar is a held pair (t₁ : t₂): pulse out at t₁, echo at t₂,
// everything in units of t₁ (scale-free — the pair is a ratio). The
// MULTIPLICATIVE structure is a read: t₂/t₁ = k², t₁·t₂ = τ² (the interval:
// in null coordinates the metric is the product, and the shaded cell is that
// product as an area). The ADDITIVE structure is a convention: the assigned
// time t₁ + ε(t₂−t₁) slides with ε while ratio and product stand still.
// B's own clock at the bounce is the GEOMETRIC mean √(t₁t₂); Einstein's
// assignment (ε = ½) is the ARITHMETIC mean; AM/GM = γ exactly — time
// dilation as the price of asking an additive question of a multiplicative
// hold, equality only at the corner k = 1.
let _radarMap = null;
function radarLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  return { yTop: 80 * dpr + 2 * R + 8 * dpr, yBot: H - 46 * dpr, W };
}
function drawRadar(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = radarLayout();
  if (state.radarEps == null) state.radarEps = 0.5;
  const fm = v => parseFloat(v.toPrecision(4)).toString();
  const zeta = Math.max(-2.2, Math.min(2.2, (state.hVal == null) ? 0 : state.hVal));
  const az = Math.abs(zeta), sgn = zeta < 0 ? -1 : 1;
  const b = Math.tanh(az), k = Math.exp(az), gam = Math.cosh(az);
  const t1 = 1, t2 = k * k * t1;
  const tauB = Math.sqrt(t1 * t2);                   // = k · t₁ — B's clock at the bounce
  const am = (t1 + t2) / 2;                          // the ε = ½ assignment
  const eps = state.radarEps;
  const tEps = t1 + eps * (t2 - t1);
  const T = Math.max(t2 * 1.14, 2.4);
  const u = (L.yBot - L.yTop - 26 * dpr) / T;        // px per unit t AND per unit x: light stays 45°
  const xA = L.W * 0.32;
  const X = xw => xA + sgn * xw * u;
  const Y = t => L.yBot - t * u;
  _radarMap = { u, yBot: L.yBot, xA, t1, t2 };
  const xe = (t2 - t1) / 2, te = (t1 + t2) / 2;      // the reflection event E, on B's worldline

  // ground line (t = 0)
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1 * dpr;
  ctx.beginPath(); ctx.moveTo(24 * dpr, Y(0)); ctx.lineTo(L.W - 24 * dpr, Y(0)); ctx.stroke();

  // the null cell [0,t₁]×[0,t₂] in (u,v) — the PRODUCT drawn as an area
  ctx.beginPath();
  ctx.moveTo(X(0), Y(0));
  ctx.lineTo(X(-t1 / 2), Y(t1 / 2));
  ctx.lineTo(X(xe), Y(te));
  ctx.lineTo(X(t2 / 2), Y(t2 / 2));
  ctx.closePath();
  ctx.fillStyle = 'rgba(212,160,82,0.055)'; ctx.fill();
  ctx.strokeStyle = 'rgba(212,160,82,0.20)'; ctx.lineWidth = 1 * dpr; ctx.stroke();

  // B's worldline (blue), out of the shared origin
  ctx.strokeStyle = 'rgba(120,150,220,0.85)'; ctx.lineWidth = 1.6 * dpr;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(b * T), Y(T)); ctx.stroke();

  // A's worldline (gold)
  ctx.strokeStyle = 'rgba(242,180,95,0.9)'; ctx.lineWidth = 1.6 * dpr;
  ctx.beginPath(); ctx.moveTo(xA, Y(0)); ctx.lineTo(xA, L.yTop + 6 * dpr); ctx.stroke();

  // the pulse: out at t₁ (this line IS u = t₁), back to t₂ (v = t₂)
  ctx.setLineDash([5 * dpr, 5 * dpr]);
  ctx.strokeStyle = 'rgba(235,235,240,0.75)'; ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.moveTo(xA, Y(t1)); ctx.lineTo(X(xe), Y(te)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(xe), Y(te)); ctx.lineTo(xA, Y(t2)); ctx.stroke();
  ctx.setLineDash([]);

  // the now-line: assigned event → E; horizontal exactly at ε = ½
  ctx.setLineDash([3 * dpr, 4 * dpr]);
  ctx.strokeStyle = 'rgba(165,133,196,0.8)'; ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.moveTo(xA, Y(tEps)); ctx.lineTo(X(xe), Y(te)); ctx.stroke();
  ctx.setLineDash([]);

  // marks on A: t₁, t₂ (solid), AM (tick), ε (hollow ring — the one handle)
  ctx.fillStyle = 'rgba(242,180,95,0.95)';
  for (const t of [t1, t2]){ ctx.beginPath(); ctx.arc(xA, Y(t), 3.2 * dpr, 0, 2 * Math.PI); ctx.fill(); }
  ctx.strokeStyle = 'rgba(242,180,95,0.9)'; ctx.lineWidth = 1.6 * dpr;
  ctx.beginPath(); ctx.moveTo(xA - 7 * dpr, Y(am)); ctx.lineTo(xA + 7 * dpr, Y(am)); ctx.stroke();
  ctx.strokeStyle = 'rgba(165,133,196,0.95)'; ctx.lineWidth = 1.8 * dpr;
  ctx.beginPath(); ctx.arc(xA, Y(tEps), 6 * dpr, 0, 2 * Math.PI); ctx.stroke();

  // E on B's worldline, wearing B's own clock (the geometric mean)
  ctx.fillStyle = 'rgba(120,150,220,0.95)';
  ctx.beginPath(); ctx.arc(X(xe), Y(te), 3.4 * dpr, 0, 2 * Math.PI); ctx.fill();

  // values beside the marks (numbers only — the readout strip carries the law)
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = sgn > 0 ? 'right' : 'left';
  const vx = xA - sgn * 10 * dpr;
  ctx.fillStyle = 'rgba(242,180,95,0.9)';
  ctx.fillText(fm(t1), vx, Y(t1) + 4 * dpr);
  ctx.fillText(fm(t2), vx, Y(t2) + 4 * dpr);
  ctx.fillText(fm(am), vx, Y(am) + 4 * dpr);
  ctx.fillStyle = 'rgba(165,133,196,0.95)';
  ctx.fillText(fm(tEps), vx, Y(tEps) - 9 * dpr);
  ctx.textAlign = sgn > 0 ? 'left' : 'right';
  ctx.fillStyle = 'rgba(120,150,220,0.95)';
  ctx.fillText(fm(tauB), X(xe) + sgn * 10 * dpr, Y(te) + 4 * dpr);

  // readouts
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('ζ ' + zeta.toFixed(2) + ' · β ' + (sgn * b).toFixed(3) + ' · k ' + fm(k), 24 * dpr, L.yTop + 18 * dpr);
  ctx.fillText('t₂/t₁ ' + fm(t2 / t1) + ' = k² · t₁·t₂ ' + fm(t1 * t2) + ' = τ² · √(t₁t₂) ' + fm(tauB), 24 * dpr, L.yTop + 34 * dpr);
  ctx.fillText('(t₁+t₂)/2 ' + fm(am) + ' · AM/GM ' + fm(am / tauB) + ' = γ · ε ' + eps.toFixed(2), 24 * dpr, L.yTop + 50 * dpr);

  // captions
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('the radar pair (t₁ : t₂) — the ratio k² and the product τ² are reads; the split is the convention', L.W / 2, L.yBot + 14 * dpr);
  ctx.fillText('line holds ζ · drag the hollow ring: ε slides the assigned now, the reads stand still · ½ = arithmetic mean · B\u2019s clock = geometric mean · the gap is γ', L.W / 2, L.yBot + 30 * dpr);
}

// ═══ THE TRIT — sr §6.1's witness ═══════════════════════════════════════
// One composition law, x ⊕ s = (x + s) / (1 − λ·x·s), and the whole
// signature fork is the SIGN of λ (rescaling absorbs its magnitude).
// λ = +1: tangent addition — the folded dial; the orbit runs away and
// wraps through the seam. λ = −1: velocity addition — horizons at ±1;
// the orbit crowds and never arrives. λ = 0: plain addition — Galileo,
// the wall between the settings, occupiable only as this slider position.
let _tritMap = null;
function tritLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  return { yTop: 80 * dpr + 2 * R + 8 * dpr, yBot: H - 46 * dpr, W };
}
function drawTrit(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = tritLayout();
  if (state.tritLam == null) state.tritLam = -1;
  const fm = v => parseFloat(v.toPrecision(4)).toString();
  const lam = state.tritLam;
  const zeta = Math.max(-2.5, Math.min(2.5, (state.hVal == null) ? 0.7 : state.hVal));
  const s = Math.tanh(zeta);                       // the step, bounded — one velocity-sized nudge
  // the orbit: start at home, apply the SAME step, watch the law decide the world
  const N = 28, orbit = [0];
  let x = 0;
  for (let n = 0; n < N; n++) {
    const d = 1 - lam * x * s;
    x = Math.abs(d) < 1e-9 ? 1e9 : (x + s) / d;
    if (!isFinite(x)) x = 1e9;
    orbit.push(x);
  }
  // display chart: bounded, X = (2/π)·atan(x) — horizons land at ±½, the seam at ±1
  const XD = v => (2 / Math.PI) * Math.atan(v);
  const yStrip = L.yTop + (L.yBot - L.yTop) * 0.42;
  const halfW = L.W * 0.40, xc = L.W / 2;
  const px = v => xc + XD(v) * halfW;

  // the strip
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.moveTo(xc - halfW, yStrip); ctx.lineTo(xc + halfW, yStrip); ctx.stroke();
  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  // home tick
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.moveTo(xc, yStrip - 6 * dpr); ctx.lineTo(xc, yStrip + 6 * dpr); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillText('0', xc, yStrip + 20 * dpr);
  // the would-be horizons at x = ±1: solid walls at λ = −1, gone at 0, plain interior at +1
  const wallA = Math.max(0, -lam);
  for (const sgn of [1, -1]) {
    const wx = px(sgn * 1);
    ctx.strokeStyle = `rgba(217,110,91,${(0.15 + 0.75 * wallA).toFixed(3)})`;
    ctx.lineWidth = (1 + 1.6 * wallA) * dpr;
    ctx.beginPath(); ctx.moveTo(wx, yStrip - 10 * dpr); ctx.lineTo(wx, yStrip + 10 * dpr); ctx.stroke();
    ctx.fillStyle = `rgba(217,110,91,${(0.25 + 0.6 * wallA).toFixed(3)})`;
    ctx.fillText(sgn > 0 ? '+1' : '−1', wx, yStrip + 20 * dpr);
  }
  // the seam at the ends (x = ±∞, one address): a passage ONLY when λ > 0
  const glue = Math.max(0, lam);
  for (const sgn of [1, -1]) {
    const wx = xc + sgn * halfW;
    ctx.strokeStyle = `rgba(242,180,95,${(0.2 + 0.65 * glue).toFixed(3)})`;
    ctx.lineWidth = 1.4 * dpr;
    ctx.beginPath(); ctx.moveTo(wx, yStrip - 8 * dpr); ctx.lineTo(wx, yStrip + 8 * dpr); ctx.stroke();
  }
  // the orbit — same step every time; the world is the law's choice
  for (let n = 0; n < orbit.length; n++) {
    const t = n / (orbit.length - 1);
    const rC = Math.round(242 - 122 * t), gC = Math.round(180 - 30 * t), bC = Math.round(95 + 125 * t);
    ctx.fillStyle = `rgba(${rC},${gC},${bC},${(0.9 - 0.25 * t).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(px(orbit[n]), yStrip - 14 * dpr - 6 * dpr * Math.sin(t * Math.PI), (3.4 - 1.2 * t) * dpr, 0, 2 * Math.PI);
    ctx.fill();
  }

  // λ slider — the pane's one handle
  const sy = L.yTop + (L.yBot - L.yTop) * 0.78;
  const sHalf = L.W * 0.26;
  _tritMap = { sy, sHalf, xc };
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.moveTo(xc - sHalf, sy); ctx.lineTo(xc + sHalf, sy); ctx.stroke();
  for (const [lv, lab] of [[-1, '−1'], [0, '0'], [1, '+1']]) {
    const tx = xc + lv * sHalf;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.moveTo(tx, sy - 6 * dpr); ctx.lineTo(tx, sy + 6 * dpr); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(lab, tx, sy + 22 * dpr);
  }
  ctx.fillStyle = 'rgba(127,176,105,0.95)';
  ctx.beginPath(); ctx.arc(xc + lam * sHalf, sy, 6 * dpr, 0, 2 * Math.PI); ctx.fill();

  // readouts + the law, live
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('λ ' + lam.toFixed(2) + ' · s ' + fm(s) + ' (= tanh ζ, ζ ' + zeta.toFixed(2) + ')', 24 * dpr, L.yTop + 18 * dpr);
  ctx.fillText('x ⊕ s = (x + s) / (1 − λ·x·s)', 24 * dpr, L.yTop + 34 * dpr);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('one law, three worlds — the sign of λ is the signature; zero is the wall between the settings', L.W / 2, L.yBot + 14 * dpr);
  ctx.fillText('line holds the step · drag λ: −1 the walls at ±1 are horizons · 0 the free run · +1 the ends glue and the orbit wraps', L.W / 2, L.yBot + 30 * dpr);
}

// ═══ THREE GAPS — the second paper's Tier-2 witness (Exhibits 1·2·3) ══════
// Hold a step α (the line's own read) and a hold K: the K marks at the
// residues of i·α on the closed dial show at most THREE gap lengths — the
// two one-sided champions δp, δq and their mediant-difference δp+δq —
// and never a fourth. The champions are stations of the Stern–Brocot walk
// of α (the best approximations, Exhibit 1); grow K past p+q and the
// mediant takes over on one side: the hand-off IS the walk, read off the
// dial (Exhibit 3). Two handles: the line holds the step; K grows the hold.
let _gapsMap = null;
function gapsLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  return { yTop: 80 * dpr + 2 * R + 8 * dpr, yBot: H - 46 * dpr, W };
}
function drawGaps(R, cx, dpr, yTopIgnored) {
  syncHFromLine();
  const L = gapsLayout();
  if (state.gapsK == null) state.gapsK = 12;
  const K = Math.max(1, Math.round(state.gapsK));
  const frac = v => v - Math.floor(v);
  // the line holds the step: the canonical read, min/max ∈ [0,1]
  const tt = Math.abs(Math.tan(state.theta));
  let alpha = (tt <= 1) ? tt : (tt > 0 ? 1 / tt : 0);
  if (!isFinite(alpha)) alpha = 0;

  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'left';

  // degenerate step: α = 0 or 1 — every mark lands on the seam's address
  if (alpha < 1e-9 || alpha > 1 - 1e-9) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('degenerate step (α = 0 or 1): all K marks share one address — no gaps to show', 24 * dpr, L.yTop + 24 * dpr);
    ctx.fillText('drag the line off the corner to hold a step', 24 * dpr, L.yTop + 40 * dpr);
    _gapsMap = null;
    return;
  }

  // residues under the fold, and the two one-sided champions
  const xs = [];
  let dp = 2, p = 0, dq = 2, q = 0;
  for (let i = 1; i <= K; i++) {
    const r = frac(i * alpha);
    xs.push([r, i]);
    if (r > 1e-12 && r < dp) { dp = r; p = i; }
    const lft = 1 - r;
    if (lft > 1e-12 && lft < dq) { dq = lft; q = i; }
  }
  xs.sort((u, v) => u[0] - v[0]);

  const CLS = [
    { v: dp,      col: '#64c8ff', name: 'δp   ' },
    { v: dq,      col: '#7fb069', name: 'δq   ' },
    { v: dp + dq, col: '#f2b45f', name: 'δp+δq' },
  ];
  const counts = [0, 0, 0]; let fourth = 0;

  // ── the closed dial: gap arcs colored by class, marks on top ──
  const cxD = L.W * 0.30, cyD = (L.yTop + L.yBot) / 2 + 6 * dpr;
  const rr = Math.min((L.yBot - L.yTop) * 0.33, L.W * 0.16);
  const ang = x => -Math.PI / 2 + 2 * Math.PI * x;      // seam (0 ≡ 1) at top
  for (let j = 0; j < xs.length; j++) {
    const a1 = xs[j], a2 = xs[(j + 1) % xs.length];
    let g = a2[0] - a1[0]; if (j === xs.length - 1) g += 1;
    let ci = -1, best = 1;
    for (let c = 0; c < 3; c++) {
      const d = Math.abs(g - CLS[c].v);
      if (d < best) { best = d; ci = c; }
    }
    const ok = ci >= 0 && best < 1e-7 * Math.max(1, K);
    if (ok) counts[ci]++; else fourth++;
    ctx.strokeStyle = ok ? CLS[ci].col : '#d96e5b';
    ctx.lineWidth = 5 * dpr;
    const pad = Math.min(0.008, g * Math.PI * 0.3);
    ctx.beginPath();
    ctx.arc(cxD, cyD, rr, ang(a1[0]) + pad, ang(a1[0] + g) - pad);
    ctx.stroke();
  }
  // seam tick — one address, the fold's
  ctx.strokeStyle = 'rgba(242,180,95,0.8)'; ctx.lineWidth = 1.4 * dpr;
  ctx.beginPath(); ctx.moveTo(cxD - 2.5 * dpr, cyD - rr - 9 * dpr); ctx.lineTo(cxD - 2.5 * dpr, cyD - rr + 9 * dpr); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cxD + 2.5 * dpr, cyD - rr - 9 * dpr); ctx.lineTo(cxD + 2.5 * dpr, cyD - rr + 9 * dpr); ctx.stroke();
  // marks
  for (const [x, i] of xs) {
    const px = cxD + rr * Math.cos(ang(x)), py = cyD + rr * Math.sin(ang(x));
    const isP = (i === p), isQ = (i === q);
    ctx.fillStyle = isP ? '#64c8ff' : isQ ? '#7fb069' : 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(px, py, (isP || isQ ? 3.6 : 2.1) * dpr, 0, 2 * Math.PI); ctx.fill();
    if (isP || isQ) {
      const lx = cxD + (rr + 16 * dpr) * Math.cos(ang(x)), ly = cyD + (rr + 16 * dpr) * Math.sin(ang(x));
      ctx.textAlign = 'center'; ctx.fillText(isP ? 'p·α' : 'q·α', lx, ly + 4 * dpr);
    }
  }

  // ── readouts and legend ──
  const fm6 = v => v.toFixed(6);
  const n1 = Math.floor(p * alpha), n2 = Math.floor(q * alpha) + 1;
  const det = n2 * p - n1 * q;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('step α ' + alpha.toFixed(7) + ' (the line’s read, min/max) · hold K ' + K, 24 * dpr, L.yTop + 18 * dpr);
  ctx.fillText('champions p ' + p + ' · q ' + q + ' — the two least one-sided residues', 24 * dpr, L.yTop + 34 * dpr);
  ctx.fillText('enclosing pair ' + n1 + '/' + p + ' < α < ' + n2 + '/' + q + ' · det ' + det + (det === 1 ? ' ✓ unimodular' : '') + ' · next hand-off K = ' + (p + q), 24 * dpr, L.yTop + 50 * dpr);
  const budget = q * dp + p * dq;
  ctx.fillText('budget q·δp + p·δq = ' + budget.toFixed(6) + (Math.abs(budget - 1) < 1e-6 ? ' ✓ (census closed)' : ''), 24 * dpr, L.yTop + 66 * dpr);
  let ly0 = L.yTop + 90 * dpr;
  for (let c = 0; c < 3; c++) {
    ctx.fillStyle = CLS[c].col;
    ctx.fillRect(24 * dpr, ly0 - 8 * dpr, 10 * dpr, 10 * dpr);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(CLS[c].name + ' ' + fm6(CLS[c].v) + '  × ' + counts[c], 40 * dpr, ly0);
    ly0 += 16 * dpr;
  }
  ctx.fillStyle = fourth > 0 ? '#d96e5b' : 'rgba(255,255,255,0.4)';
  ctx.fillText(fourth > 0 ? ('FOURTH LENGTH: ' + fourth + ' — should never happen') : 'three colors, never a fourth', 24 * dpr, ly0);

  // ── the Stern–Brocot ladder: the walk of α, champions boxed, hand-off ghosted ──
  let lo = [0, 1], hi = [1, 1];
  const nodes = [{ n: 0, d: 1, side: 'L' }, { n: 1, d: 1, side: 'U' }];
  for (let s = 0; s < 400; s++) {
    const m = [lo[0] + hi[0], lo[1] + hi[1]];
    if (m[1] > 200000 || nodes.length > 220) break;
    const mv = m[0] / m[1];
    nodes.push({ n: m[0], d: m[1], side: (mv <= alpha) ? 'L' : 'U' });
    if (Math.abs(mv - alpha) < 1e-13) break;
    if (mv < alpha) lo = m; else hi = m;
  }
  let gi = nodes.findIndex(nd => nd.d > K);
  if (gi < 0) gi = nodes.length - 1;
  const start = Math.max(0, gi - 9);
  let ny = L.yTop + 26 * dpr;
  const nx = L.W * 0.56;
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('the Stern–Brocot walk of α' + (start > 0 ? '   (… ' + start + ' earlier stations)' : ''), nx, ny);
  ny += 18 * dpr;
  for (let s2 = start; s2 <= gi; s2++) {
    const nd = nodes[s2];
    const ghost = (nd.d > K);
    const champ = !ghost && ((nd.side === 'L' && nd.d === p && nd.n === n1) || (nd.side === 'U' && nd.d === q && nd.n === n2));
    ctx.fillStyle = ghost ? 'rgba(242,180,95,0.75)'
      : nd.side === 'L' ? ('rgba(100,200,255,' + (champ ? '1' : '0.55') + ')')
      : ('rgba(127,176,105,' + (champ ? '1' : '0.55') + ')');
    const tag = ghost ? '○' : nd.side === 'L' ? '▲' : '▼';
    ctx.fillText(tag + '  ' + nd.n + '/' + nd.d
      + (champ ? '   ← champion (denominator ' + (nd.side === 'L' ? 'p' : 'q') + ')' : '')
      + (ghost ? '   next mediant — arrives at K = ' + nd.d : ''), nx, ny);
    if (champ) {
      const w = ctx.measureText(tag + '  ' + nd.n + '/' + nd.d).width;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1 * dpr;
      ctx.strokeRect(nx - 5 * dpr, ny - 11 * dpr, w + 10 * dpr, 15 * dpr);
    }
    ny += 16 * dpr;
  }

  // ── K slider — the pane's second handle ──
  const sy = L.yBot - 34 * dpr;
  const sHalf = L.W * 0.20, xc = L.W * 0.70;
  _gapsMap = { sy, sHalf, xc, Kmin: 1, Kmax: 120 };
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2 * dpr;
  ctx.beginPath(); ctx.moveTo(xc - sHalf, sy); ctx.lineTo(xc + sHalf, sy); ctx.stroke();
  ctx.textAlign = 'center';
  for (const kv of [1, 40, 80, 120]) {
    const tx = xc + ((kv - 1) / 119 * 2 - 1) * sHalf;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.moveTo(tx, sy - 5 * dpr); ctx.lineTo(tx, sy + 5 * dpr); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(String(kv), tx, sy + 18 * dpr);
  }
  ctx.fillStyle = 'rgba(127,176,105,0.95)';
  ctx.beginPath(); ctx.arc(xc + ((K - 1) / 119 * 2 - 1) * sHalf, sy, 6 * dpr, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('K', xc - sHalf - 16 * dpr, sy + 4 * dpr);

  // captions
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('at most three gap lengths — the two champions and their mediant-difference; the largest is the sum of the other two', L.W / 2, L.yBot + 14 * dpr);
  ctx.fillText('line holds the step · drag K: each mark splits a sum-gap; each hand-off is a subtractive-Euclid step on (δp, δq)', L.W / 2, L.yBot + 30 * dpr);
}

// ═══ ?(x) — the chart between the two walks (Tier-3 Exhibit 4) ════════════
// Minkowski's question mark, drawn as what it is: the order-isomorphism
// carrying the MEDIANT walk (x-axis, Farey cells, width 1/(b₁b₂)) onto the
// DYADIC walk (y-axis, halvings, width 2^-N), rung for rung. One word of
// L/R steps, two ledgers. The line holds the target; the slider walks
// deeper; the two cells never refine in step — the imbalance (2^N vs b₁b₂)
// is the chart's slope, and it runs to a horizon on every word: friction.
let _qmMap = null;
function qmarkLayout() {
  const dpr = devicePixelRatio, W = canvas.width, H = canvas.height;
  const R = currentR();
  return { yTop: 80 * dpr + 2 * R + 8 * dpr, yBot: H - 46 * dpr, W };
}
function qmarkOf(x) {          // ?(x) on [0,1] by the walk — display arithmetic

function drawQmark(R, cx, dpr, yTopIgnored) {
  syncHFromLine();

  if (state.qmN == null) state.qmN = 8;
  const N = Math.max(1, Math.min(30, Math.round(state.qmN)));
  const tt = Math.abs(Math.tan(state.theta));
  let alpha = (tt <= 1) ? tt : (tt > 0 ? 1 / tt : 0);

  ctx.font = `${11 * dpr}px 'Courier New', monospace`;
  ctx.textAlign = 'left';
  if (alpha < 1e-9 || alpha > 1 - 1e-9) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('degenerate target (α = 0 or 1): the walk has nowhere to go — drag the line off the corner', 24 * dpr, L.yTop + 24 * dpr);
    _qmMap = null;
    return;
  }

  // ── the square: mediant line across, dyadic line up ──
  const side = Math.min((L.yBot - L.yTop) * 0.80, L.W * 0.34);
  const x0 = L.W * 0.06, yB = (L.yTop + L.yBot) / 2 + side / 2;

  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2 * dpr;
  ctx.strokeRect(x0, yB - side, side, side);
  ctx.fillStyle = 'rgba(100,200,255,0.7)';
  ctx.fillText('mediant line →', x0, yB + 16 * dpr);
  ctx.save();
  ctx.translate(x0 - 8 * dpr, yB); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = 'rgba(127,176,105,0.8)';
  ctx.fillText('dyadic line →', 0, 0);
  ctx.restore();

  // ── the walk to depth N: enclosing pair on one axis, halvings on the other ──
  let a1 = 0, b1 = 1, a2 = 1, b2 = 1;      // the mediant observer's cell
  let ulo = 0, uhi = 1;                     // the dyadic observer's cell
  let word = '', exact = false;
  for (let s = 0; s < N; s++) {
    const m = (a1 + a2) / (b1 + b2), um = (ulo + uhi) / 2;
    if (Math.abs(alpha - m) < 1e-15) { exact = true; break; }
    if (alpha > m) { a1 += a2; b1 += b2; ulo = um; word += 'R'; }
    else { a2 += a1; b2 += b1; uhi = um; word += 'L'; }
  }
  const lo = a1 / b1, hi = a2 / b2;
  const cellF = b1 * b2, cellD = Math.pow(2, word.length);

  // cell bands: the two observers' current holds
  ctx.fillStyle = 'rgba(100,200,255,0.10)';
  ctx.fillRect(X(lo), yB - side, Math.max(1.5 * dpr, (hi - lo) * side), side);
  ctx.fillStyle = 'rgba(127,176,105,0.12)';
  ctx.fillRect(x0, Y(uhi), side, Math.max(1.5 * dpr, (uhi - ulo) * side));
  // the shared cell, corner to corner
  ctx.strokeStyle = 'rgba(242,180,95,0.85)'; ctx.lineWidth = 1.4 * dpr;
  ctx.strokeRect(X(lo), Y(uhi), Math.max(1.5 * dpr, (hi - lo) * side), Math.max(1.5 * dpr, (uhi - ulo) * side));

  // ── the curve ──
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6 * dpr;
  ctx.beginPath();
  const steps = 380;
  for (let i = 0; i <= steps; i++) {
    const xv = i / steps, yv = qmarkOf(xv);
    if (i === 0) ctx.moveTo(X(xv), Y(yv)); else ctx.lineTo(X(xv), Y(yv));
  }
  ctx.stroke();

  // the target and its two shadows
  const qa = qmarkOf(alpha);
  ctx.strokeStyle = 'rgba(242,180,95,0.5)'; ctx.lineWidth = 1 * dpr;
  ctx.setLineDash([3 * dpr, 3 * dpr]);
  ctx.beginPath(); ctx.moveTo(X(alpha), yB); ctx.lineTo(X(alpha), Y(qa)); ctx.lineTo(x0, Y(qa)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f2b45f';
  ctx.beginPath(); ctx.arc(X(alpha), Y(qa), 3.5 * dpr, 0, 2 * Math.PI); ctx.fill();

  // ── readouts ──
  const rx = L.W * 0.50;
  let ry = L.yTop + 18 * dpr;
  const put = (txt, col) => { ctx.fillStyle = col || 'rgba(255,255,255,0.6)'; ctx.fillText(txt, rx, ry); ry += 16 * dpr; };
  put('target α ' + alpha.toFixed(9) + ' (the line’s read)   ·   ?(α) ' + qa.toFixed(9) + (exact ? '  — exact (walk terminated)' : ''));
  put('steps N ' + word.length + (exact ? ' (target hit — final 1 appended)' : '') + '   ·   word ' + (word || '—') + '   (L→0, R→1: the word IS the binary of ?(α))');
  put('mediant cell  ' + a1 + '/' + b1 + ' … ' + a2 + '/' + b2 + '   width 1/(b₁·b₂) = 1/' + cellF, 'rgba(100,200,255,0.85)');
  put('dyadic cell   width 2^−N = 1/' + cellD, 'rgba(127,176,105,0.9)');
  const ahead = cellF > cellD;
  put('exchange rate (2^N : b₁b₂) = (' + cellD + ' : ' + cellF + ')');
  put(ahead ? '→ mediant observer ahead — the chart steepens here (alternation-heavy word)'
