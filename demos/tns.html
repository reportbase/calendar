      }
    }
    const L = torusLayout();
    if (yInCanvas > L.yTop) {
      dragMode = 'orbit';
      lastDragX = clientX;
      lastDragY = clientY;
      lastDragT = performance.now();
      return;
    }
    dragMode = 'apDirect';               // centered standard line: the hand drives the pointer
    dragStartTheta = state.theta;
    dragStartX = clientX;
    return;
  }

  if (state.viewMode === 'bridge') {
    const xpx = (clientX - rect.left) * devicePixelRatio;
    {
      const z = bridgePlayZone();
      if (Math.hypot(xpx - z.cx, yInCanvas - z.cy) <= z.r + 6 * devicePixelRatio) {
        state.vhdPlay = !state.vhdPlay;
        dragging = false; dragMode = null;
        ensureVhdPlay();
        draw();
        return;
      }
    }
    for (const z of bridgePresetZones()) {
      if (Math.hypot(xpx - z.cx, yInCanvas - z.cy) <= z.r + 6 * devicePixelRatio) {
        state.shapeIdx = z.i;
        dragging = false; dragMode = null;
        draw();
        return;
      }
    }
    const L = bridgeLayout();
    if (yInCanvas > L.yTop) {
      dragMode = 'orbit';
      lastDragX = clientX;
      lastDragY = clientY;
      lastDragT = performance.now();
      return;
    }
    dragMode = 'apDirect';               // centered standard line: the hand drives the pointer
    dragStartTheta = state.theta;
    dragStartX = clientX;
    return;
  }

  if (state.viewMode === 'fold') {
    const xpx = (clientX - rect.left) * devicePixelRatio;
    {
      const z = foldPlayZone();
      if (Math.hypot(xpx - z.cx, yInCanvas - z.cy) <= z.r + 6 * devicePixelRatio) {
        state.vhdPlay = !state.vhdPlay;
        dragging = false; dragMode = null;
        ensureVhdPlay();
        draw();
        return;
      }
    }
    for (const z of foldPresetZones()) {
      if (Math.hypot(xpx - z.cx, yInCanvas - z.cy) <= z.r + 6 * devicePixelRatio) {
        state.shapeIdx = z.i;
        dragging = false; dragMode = null;
        draw();
        return;
      }
    }
    const L = foldLayout();
    if (yInCanvas > L.yTop) {
      dragMode = 'foldScrub';        // dragging right performs the quotients;
      dragStartFold = state.foldT;   // dragging left un-forgets the bits
      dragStartFoldX = clientX;
      lastDragT = performance.now();
      return;
    }
    dragMode = 'focal';              // the line above holds h
    dragStartTan = Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, state.theta)));
    dragStartTheta = state.theta;
    dragStartWavePan = state.wavePan || 0;
    return;
  }

  if (wavePanned(state.viewMode)) {
    // FULL-PAGE PAN: for the wave / slope / bridge charts, dragging anywhere —
    // the top number line OR the bottom chart — pans the whole apparatus
    // together (the top line and bottom chart move as one).
    dragMode = 'focal';
    dragStartX = clientX;
    dragStartTan = Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, state.theta)));
    dragStartTheta = state.theta;
    dragStartWavePan = state.wavePan || 0;
  } else if (yInCanvas < H / 2) {
    // the standard line is centered, so the hand drives the pointer directly
    dragMode = 'apDirect';
    dragStartX = clientX;
    dragStartTan = Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, state.theta)));
    dragStartTheta = state.theta;
    dragStartWavePan = state.wavePan || 0;
  } else {
    dragMode = 'pending';   // resolved on first motion in updateDrag
    dragStartTan = Math.tan(Math.max(-SAFE_LOCAL, Math.min(SAFE_LOCAL, state.theta)));
    dragStartTheta = state.theta;
    dragStartWavePan = state.wavePan || 0;
    dragStartCascadeAngle = state.cascadeAngle;
  }
}

// v/d·h/d view: pointer → image-plane coordinates → (h, v), i.e. (θ, dial angle).
// h is the focal itself, so dragging the aim horizontally pans the number line above.
function updateAim(clientX, clientY) {
  const dpr = devicePixelRatio;
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * dpr, y = (clientY - rect.top) * dpr;
  const W = canvas.width, H = canvas.height;
  const R = currentR();
  const yTop = 80 * dpr + 2 * R;
  const padB = 16 * dpr;
  const availH = (H - padB) - yTop;
  const side = Math.min(availH - 56 * dpr, W * 0.38);
  const cyv = yTop + availH / 2;
  const S = side / 4;
  const hImg = Math.max(-12, Math.min(12, (x - W / 2) / S));
  const vImg = Math.max(-12, Math.min(12, (cyv - y) / S));
  state.hVal = hImg;
  state.vVal = vImg;
  draw();
}

function updateDrag(clientX, clientY) {
  if (!dragging) return;
  const dpr = devicePixelRatio;
  const now = performance.now();
  const dt = (now - lastDragT) / 1000;

  if (dragMode === 'vh3') {
    const rect2 = canvas.getBoundingClientRect();
    const px = (clientX - rect2.left) * dpr, py = (clientY - rect2.top) * dpr;
    const R2 = currentR(), cxc = canvas.width / 2, cy_arc = 80 * dpr + R2;
    const key = state._vh3;
    if (key === 'pt') {
      const PL = window._vh3plane, h2 = (state.hVal == null) ? 1.2 : state.hVal;
      if (PL) {
        const rs = Math.hypot(px - PL.pcx, py - PL.pcy);
        const rr = Math.tan(Math.min(0.985, rs / PL.planeR) * Math.PI / 2);   // inverse fisheye
        const ux = rs > 1e-6 ? (px - PL.pcx) / rs : 0, uy = rs > 1e-6 ? (PL.pcy - py) / rs : 0;
        state.vVal  = _clampVal(ux * rr, -40, 40) * h2;    // signed → the dot goes all around
        state.v2Val = _clampVal(uy * rr, -40, 40) * h2;
      }
      lastDragX = clientX; lastDragT = now; draw(); return;
    }
    if (_vh3LP && Math.hypot(clientX - _vh3downX, clientY - _vh3downY) > 6) { clearTimeout(_vh3LP); _vh3LP = null; }
    let th = Math.atan2(px - cxc, cy_arc - py);            // arc angle; v = tan(th)
    th = Math.max(-(Math.PI / 2 - 0.02), Math.min(Math.PI / 2 - 0.02, th));
    if (key === 'h') {                                     // h swings the full dome too, but 0 is the seam
      let hv = Math.tan(th);
      if (Math.abs(hv) < 0.05) hv = (hv < 0 ? -0.05 : 0.05);   // never sit exactly on the seam (÷0)
      state.hVal = _clampVal(hv, -20, 20);
    } else if (state.vh3lock && state._vh3lk) {            // linked: slide BOTH rises rigidly
      const lk = state._vh3lk, CL = Math.PI / 2 - 0.02;
      const d = th - (lk.key === 'v1' ? lk.t1 : lk.t2);
      state.vVal  = _clampVal(Math.tan(Math.max(-CL, Math.min(CL, lk.t1 + d))), -30, 30);
      state.v2Val = _clampVal(Math.tan(Math.max(-CL, Math.min(CL, lk.t2 + d))), -30, 30);
    } else {                                               // v₁, v₂ independent
      const v = _clampVal(Math.tan(th), -30, 30);
      if (key === 'v1') state.vVal = v; else if (key === 'v2') state.v2Val = v;
    }
    lastDragX = clientX; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'trace') {
    // tracing the shape: the boundary WRITES the registers — the world hands
    // the observer its coordinates, and the atoms read them against h.
    const rect2 = canvas.getBoundingClientRect();
    const xpx = (clientX - rect2.left) * dpr, ypx = (clientY - rect2.top) * dpr;
    const P = vhdPlane();
    const ux = (xpx - P.cx) / P.S, uy = (P.cy - ypx) / P.S;
    const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
    const hh0 = (state.hVal == null) ? 1.2 : state.hVal;
    const hS = (Math.abs(hh0) < 1 / 64) ? (hh0 < 0 ? -1 / 64 : 1 / 64) : hh0;
    let best = null, bd = 1e9;
    for (let i = 0; i < 240; i++) {
      const q = shp.f(i / 240);
      const dx = q.x / hS - ux, dy = q.y / hS - uy;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = q; }
    }
    state.vVal = best.x;
    state.v2Val = best.y;
    if (state.curAtom === 'vVal' || state.curAtom === 'v2Val') {
      state.theta = Math.atan(state[state.curAtom]);   // the line follows the traced coordinate
      _lastVhdTheta = state.theta;
    }
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'scopeScrub') {
    const rect2 = canvas.getBoundingClientRect();
    const xpx = (clientX - rect2.left) * dpr;
    const Ls = scopeLayout();
    vhdT = Math.max(0, Math.min(0.999999, (xpx - Ls.x0) / (Ls.x1 - Ls.x0)));
    const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
    const q = shp.f(vhdT);
    state.vVal = q.x;
    state.v2Val = q.y;
    lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'beamA' || dragMode === 'beamB' || dragMode === 'beamBoth') {
    const f = Math.pow(2, (clientY - dragStartY) / 110);   // drag DOWN loads the pan
    const clampv = v => (v < 1 / 64 ? 0 : Math.min(v, 4096));
    if (dragMode !== 'beamB') state.beamA = clampv(dragStartBeamA === 0 ? (1 / 60) * (f > 1 ? f : 0) : dragStartBeamA * f);
    if (dragMode !== 'beamA') state.beamB = clampv(dragStartBeamB === 0 ? (1 / 60) * (f > 1 ? f : 0) : dragStartBeamB * f);
    const A2 = Math.abs(state.beamA), B2 = Math.abs(state.beamB);
    if (A2 > 0 || B2 > 0) {                                // the line follows the ratio
      const r2 = (B2 === 0) ? 1e6 : A2 / B2;
      state.theta = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, Math.atan(r2)));
      _lastBeamTheta = state.theta;
    }
    lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'numShape') {
    const rect2 = canvas.getBoundingClientRect();
    const xpx = (clientX - rect2.left) * dpr, ypx = (clientY - rect2.top) * dpr;
    const Ln = numLayout();
    const hh2 = Math.max(Math.abs((state.hVal == null) ? 1.2 : state.hVal), 1 / 64);
    const dx = (xpx - Ln.cx) / Ln.S, dy = (Ln.cy - ypx) / Ln.S;
    const thP = Math.atan2(dy, dx);
    const rT = Math.max(0.05, Math.hypot(dx, dy) * hh2);   // target radius at the pointer
    // sculpt: pull the deformation bins near θP toward the pointer's radius
    const shp2 = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
    for (let i = 0; i < 128; i++) {
      const th = (i / 128) * 2 * Math.PI;
      let d = Math.abs(th - (((thP % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)));
      if (d > Math.PI) d = 2 * Math.PI - d;
      const w = Math.exp(-(d * d) / (2 * 0.30 * 0.30));
      if (w < 0.01) continue;
      // base radius at this bin (coarse: nearest of 180 boundary samples)
      let best = 1e9, rb = 0;
      for (let k = 0; k < 180; k++) {
        const q = shp2.f(k / 180);
        let dd = Math.abs(Math.atan2(q.y, q.x) - th) % (2 * Math.PI);
        if (dd > Math.PI) dd = 2 * Math.PI - dd;
        if (dd < best) { best = dd; rb = Math.hypot(q.x, q.y); }
      }
      const want = rT - rb;
      _numDef[i] += (want - _numDef[i]) * w * 0.5;
    }
    lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'apDirect') {
    const R = currentR();
    const dxPx = (clientX - dragStartX) * dpr;
    const U_SENS = 1.0;
    // GRAB semantics for the PANNING line: the ruler follows the hand. Drag
    // right → the ruler slides right → the value under the dome DECREASES,
    // so u moves opposite the pointer. (When the line was pinned and only the
    // dot moved, +dx was correct; the pannable default flipped what the hand
    // is holding — it holds the paper now, not the marker.)
    const uStart = Math.asinh(Math.tan(Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, dragStartTheta))));
    const u = uStart - (dxPx / R) * U_SENS;
    state.theta = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, Math.atan(Math.sinh(u))));
    // flick physics: same chart, same sign as the grab
    if (dt > 1e-3) {
      const dxRecent = (clientX - lastDragX) * dpr;
      const vNew = (-(dxRecent / R) * U_SENS) / dt;
      focalVelocity = 0.7 * vNew + 0.3 * focalVelocity;
    }
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'foldScrub') {
    state.foldT = Math.max(0, Math.min(3, dragStartFold + (clientX - dragStartFoldX) / 120));
    lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'orbit') {
    state.sphYaw += (clientX - lastDragX) * 0.008;
    state.sphPitch = Math.max(-1.35, Math.min(1.35, state.sphPitch + (clientY - lastDragY) * 0.008));
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'stOrbit') {
    state.stYaw += (clientX - lastDragX) * 0.008;
    state.stPitch = Math.max(-1.35, Math.min(1.35, state.stPitch + (clientY - lastDragY) * 0.008));
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'eightNav') {
    const L = elineLayout();
    const rect2 = canvas.getBoundingClientRect();
    const px = (clientX - rect2.left) * devicePixelRatio;
    const py = (clientY - rect2.top) * devicePixelRatio;
    // RELATIVE, seam-pinned scrub on the lobe grabbed at press (side locked).
    // The value advances by the pointer's angular travel around the loop —
    // never by teleport. Approaching the junction from either side pins at
    // the asymptotic wall: home and horizon are approached, not occupied,
    // and the only road between them runs the long way, through the corner.
    const right = _elNavSide;
    const c = right ? { x: L.cx + L.rc, y: L.cy } : { x: L.cx - L.rc, y: L.cy };
    const dx = right ? (px - c.x) : (c.x - px);
    const ang = Math.atan2(py - c.y, dx);
    const sP = ((ang - Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    let ds = sP - _elNavPrevS;
    if (ds > Math.PI) ds -= 2 * Math.PI;
    if (ds < -Math.PI) ds += 2 * Math.PI;
    _elNavPrevS = sP;
    const key = right ? 'beamA' : 'beamB';
    const sCur = 4 * Math.atan(Math.max(1e-3, Math.min(1e3, state[key])));
    const sNew = Math.max(0.05, Math.min(2 * Math.PI - 0.05, sCur + ds));
    state[key] = Math.tan(sNew / 4);
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'skyOrbit') {
    state.skyYaw += (clientX - lastDragX) * 0.008;
    state.skyPitch = Math.max(-1.35, Math.min(1.35, state.skyPitch + (clientY - lastDragY) * 0.008));
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    draw();
    return;
  }
  if (dragMode === 'radarEps') {
    if (_radarMap) {
      const r2 = canvas.getBoundingClientRect();
      const ypx = (clientY - r2.top) * devicePixelRatio;
      const m = _radarMap;
      const t = (m.yBot - ypx) / m.u;
      let e2 = Math.max(0, Math.min(1, (t - m.t1) / Math.max(1e-9, m.t2 - m.t1)));
      if (Math.abs(e2 - 0.5) < 0.018) e2 = 0.5;    // soft snap onto Einstein's split
      state.radarEps = e2;
      draw();
    }
    return;
  }
  if (dragMode === 'gapsK') {
    if (_gapsMap) {
      const r2 = canvas.getBoundingClientRect();
      const xpx = (clientX - r2.left) * devicePixelRatio;
      const t2 = Math.max(-1, Math.min(1, (xpx - _gapsMap.xc) / _gapsMap.sHalf));
      state.gapsK = Math.round(_gapsMap.Kmin + (t2 + 1) / 2 * (_gapsMap.Kmax - _gapsMap.Kmin));
      draw();
    }
    return;
  }
  if (dragMode === 'qmN') {
    if (_qmMap) {
      const r2 = canvas.getBoundingClientRect();
      const xpx = (clientX - r2.left) * devicePixelRatio;
      const t2 = Math.max(-1, Math.min(1, (xpx - _qmMap.xc) / _qmMap.sHalf));
      state.qmN = Math.round(_qmMap.Nmin + (t2 + 1) / 2 * (_qmMap.Nmax - _qmMap.Nmin));
      draw();
    }
    return;
  }
  if (dragMode === 'tritLam') {
    if (_tritMap) {
      const r2 = canvas.getBoundingClientRect();
      const xpx = (clientX - r2.left) * devicePixelRatio;
      let lv = Math.max(-1, Math.min(1, (xpx - _tritMap.xc) / _tritMap.sHalf));
      for (const snap of [-1, 0, 1]) if (Math.abs(lv - snap) < 0.05) lv = snap;
      state.tritLam = lv;
      draw();
    }
    return;
  }
  if (dragMode === 'wgW') {
    if (_wgMap) {
      const r2 = canvas.getBoundingClientRect();
      const xpx = (clientX - r2.left) * devicePixelRatio;
      const ypx = (clientY - r2.top) * devicePixelRatio;
      const r = Math.min(0.97, Math.hypot(xpx - _wgMap.cx, ypx - _wgMap.cy) / _wgMap.S);
      const an = Math.atan2(-(ypx - _wgMap.cy), xpx - _wgMap.cx);
      state.wgW = { x: r * Math.cos(an), y: r * Math.sin(an) };
      draw();
    }
    return;
  }
  if (dragMode === 'aim') {
    updateAim(clientX, clientY);
    lastDragX = clientX; lastDragY = clientY; lastDragT = now;
    return;
  }


  // Resolve a pending (bottom-half) drag once motion exceeds a small threshold:
  // horizontal-dominant → focal pan (same as the top), vertical-dominant → dial.
  if (dragMode === 'pending') {
    const dx = Math.abs(clientX - dragStartX);
    const dy = Math.abs(clientY - dragStartY);
    if (dx > 4 || dy > 4) {
      dragMode = (dx >= dy) ? 'focal' : 'dial';
    } else {
      lastDragX = clientX; lastDragY = clientY; lastDragT = now;
      return;
    }
  }

  if (dragMode === 'focal') {
    const R = currentR();
    const dxPx = (clientX - dragStartX) * dpr;
    if (wavePanned(state.viewMode)) {
      // Wave view: gaze frozen; horizontal drag pans the wave,
      // with momentum tracked so a flick coasts (same physics as the focal).
      state.wavePan = dragStartWavePan + dxPx / R;
      if (dt > 1e-3) {
        const dxRecent = (clientX - lastDragX) * dpr;
        const vNew = (dxRecent / R) / dt;
        wavePanVelocity = 0.7 * vNew + 0.3 * wavePanVelocity;
      }
    } else {
      // Every other view: horizontal drag moves the focal — panned in
      // u = asinh(tan θ) (the inverse Gudermannian), the LOGARITHMIC chart of
      // the number line. Near 0 asinh is linear (center feel unchanged); far
      // out it is log (each equal drag MULTIPLIES the value by a constant
      // factor), so the line no longer accelerates hyperbolically toward the
      // horizon: 1→10, 10→100, 100→1000 each cost the same drag distance.
      const U_SENS = 1.0;   // e-folds of value per R pixels of drag (the dial). 1.0 ≈ the old near-center feel; each R of drag multiplies the value by e ≈ 2.7.
      const uStart = Math.asinh(Math.tan(Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, dragStartTheta))));
      const u = uStart - (dxPx / R) * U_SENS;
      state.theta = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, Math.atan(Math.sinh(u))));
      if (dt > 1e-3) {
        const dxRecent = (clientX - lastDragX) * dpr;
        const vNew = -(dxRecent / R) * U_SENS / dt;   // u/s — momentum lives in the log chart too
        focalVelocity = 0.7 * vNew + 0.3 * focalVelocity;
      }
    }
  } else if (dragMode === 'dial') {
    const dyPx = (clientY - dragStartY) * dpr;
    const sens = dialAnglePerPixel(dpr);
    state.cascadeAngle = dragStartCascadeAngle + dyPx * sens;
    if (dt > 1e-3) {
      const dyRecent = (clientY - lastDragY) * dpr;
      const vNew = (dyRecent * sens) / dt;  // rad per second
      dialVelocity = 0.7 * vNew + 0.3 * dialVelocity;
    }
  }
  if (dt > 1e-3) {
    lastDragX = clientX;
    lastDragY = clientY;
    lastDragT = now;
  }
  draw();
}

function endDrag() {
  if (_vh3LP) { clearTimeout(_vh3LP); _vh3LP = null; }
  if (!dragging) return;
  const wasMode = dragMode;
  dragging = false;
  dragMode = null;
  const now = performance.now();
  if (now - lastDragT > 120) return;  // stale, no fling
  if (wasMode === 'focal' && wavePanned(state.viewMode) && Math.abs(wavePanVelocity) > WAVE_MIN_V) {
    inertiaActive = true;
    inertiaMode = 'wave';
    inertiaLastT = now;
    requestAnimationFrame(stepInertia);
  } else if (wasMode === 'focal' && !wavePanned(state.viewMode) && Math.abs(focalVelocity) > FOCAL_MIN_V) {
    inertiaActive = true;
    inertiaMode = 'focal';
    inertiaLastT = now;
    requestAnimationFrame(stepInertia);
  } else if (wasMode === 'apDirect' && Math.abs(focalVelocity) > FOCAL_MIN_V) {
    inertiaActive = true;
    inertiaMode = 'focal';         // same coasting chart: u = asinh(tan θ), friction identical
    inertiaLastT = now;
    requestAnimationFrame(stepInertia);
  } else if (wasMode === 'dial' && Math.abs(dialVelocity) > DIAL_MIN_V) {
    inertiaActive = true;
    inertiaMode = 'dial';
    inertiaLastT = now;
    requestAnimationFrame(stepInertia);
  }
}

function stepInertia(t) {
  if (!inertiaActive) return;
  const dt = (t - inertiaLastT) / 1000;
  inertiaLastT = t;
  if (inertiaMode === 'focal') {
    // Coast in the same log chart the drag uses: u = asinh(tan θ), so a flick
    // glides at a constant MULTIPLICATIVE rate along the line, not hyperbolic.
    let u = Math.asinh(Math.tan(Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, state.theta))));
    u += focalVelocity * dt;
    state.theta = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, Math.atan(Math.sinh(u))));
    focalVelocity *= Math.exp(-FOCAL_FRICTION * dt);
    draw();
    if (Math.abs(focalVelocity) < FOCAL_MIN_V ||
        Math.abs(state.theta) >= PAN_LIMIT - 1e-6) {
      inertiaActive = false;
      return;
    }
  } else if (inertiaMode === 'wave') {
    state.wavePan += wavePanVelocity * dt;
    wavePanVelocity *= Math.exp(-WAVE_FRICTION * dt);
    draw();
    if (Math.abs(wavePanVelocity) < WAVE_MIN_V) {
      inertiaActive = false;
      return;
    }
  } else if (inertiaMode === 'dial') {
    state.cascadeAngle += dialVelocity * dt;
    dialVelocity *= Math.exp(-DIAL_FRICTION * dt);
    draw();
    if (Math.abs(dialVelocity) < DIAL_MIN_V) {
      inertiaActive = false;
      return;
    }
  }
  requestAnimationFrame(stepInertia);
}

// ── quadrature drive: the shape is a SIGNAL. Advancing t moves v₁ and v₂
// together — cos-like against sin-like — and that differential motion is what
// buys curvature. h is common mode: by itself it can only draw straight rays.
function stepVhdPlay(ts) {
  const PLAY_VIEWS = ['vhd', 'sphere', 'fold', 'bridge', 'torus', 'scope', 'eight', 'bouquet', 's3', 'beam', 'seq'];
  if (!state.vhdPlay || PLAY_VIEWS.indexOf(state.viewMode) < 0) { _vhdPlayActive = false; _vhdPlayLast = null; return; }
  if (_vhdPlayLast == null) _vhdPlayLast = ts;
  const dt = Math.min(0.1, (ts - _vhdPlayLast) / 1000);
  _vhdPlayLast = ts;
  vhdT = (vhdT + dt / VHD_PERIOD) % 1;
  if (state.viewMode === 'eight' || state.viewMode === 'beam') {
    // sweep the whole line once per lap — both lobes / both zeros in one pass
    state.theta = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, Math.PI * (vhdT - 0.5)));
    draw();
    requestAnimationFrame(stepVhdPlay);
    return;
  }
  const shp = SHAPES2D[state.shapeIdx] || SHAPES2D[0];
  const q = shp.f(vhdT);
  state.vVal = q.x;
  state.v2Val = q.y;
  if (state.viewMode === 'vhd' && (state.curAtom === 'vVal' || state.curAtom === 'v2Val')) {
    state.theta = Math.atan(state[state.curAtom]);   // the line rides its register
    _lastVhdTheta = state.theta;
  }
  draw();
  requestAnimationFrame(stepVhdPlay);
}
function ensureVhdPlay() {
  ensureApLoop();
  if (['vhd', 'sphere', 'fold', 'bridge', 'torus', 'scope', 'eight', 'bouquet', 's3', 'beam', 'seq'].indexOf(state.viewMode) >= 0 && state.vhdPlay && !_vhdPlayActive) {
    _vhdPlayActive = true;
    _vhdPlayLast = null;
    requestAnimationFrame(stepVhdPlay);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Continuous auto-motion — a steady self-pan. Space toggles it, Esc stops it,
// and the menu button starts/pauses it. On the wave / slope / bridge charts it
// drifts the pan (wavePan); elsewhere it glides the focal along the line.
// ═══════════════════════════════════════════════════════════════════════════
let _autoActive = false, _autoLastT = null;
const AUTO_WAVE_RATE = 0.8;   // value units per second (wave/slope/bridge pan)
const AUTO_FOCAL_RATE = 0.5;  // u = asinh(tan θ) per second (other views)
function stepAutoMotion(ts) {
  if (!state.autoMotion) { _autoActive = false; _autoLastT = null; return; }
  if (_autoLastT == null) _autoLastT = ts;
  const dt = Math.min(0.1, (ts - _autoLastT) / 1000);
  _autoLastT = ts;
  if (wavePanned(state.viewMode)) {
    state.wavePan = (state.wavePan || 0) + AUTO_WAVE_RATE * dt;
  } else {
    let u = Math.asinh(Math.tan(Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, state.theta))));
    u += AUTO_FOCAL_RATE * dt;
    state.theta = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, Math.atan(Math.sinh(u))));
  }
  draw();
  requestAnimationFrame(stepAutoMotion);
}
function setAutoMotion(on) {
  state.autoMotion = !!on;
  syncAutoBtn();
  if (state.autoMotion) {
    stopInertia();
    if (!_autoActive) { _autoActive = true; _autoLastT = null; requestAnimationFrame(stepAutoMotion); }
  }
}
function toggleAutoMotion() { setAutoMotion(!state.autoMotion); }
function syncAutoBtn() {
  const btn = document.getElementById('sAuto');
  if (!btn) return;
  const on = state.autoMotion;
  btn.textContent = on ? '⏸ pause motion' : '▶ auto motion';
  btn.style.borderColor = on ? 'rgba(127,176,105,0.8)' : 'rgba(255,255,255,0.18)';
  btn.style.color = on ? '#7fb069' : 'rgba(255,255,255,0.8)';
}

canvas.addEventListener('contextmenu', e => e.preventDefault());   // no right-click menu over the canvas
canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', e => updateDrag(e.clientX, e.clientY));
window.addEventListener('mouseup', endDrag);
// v/d·h/d view: two-finger pinch is depth, at twice the finger log-ratio —
// spread by σ and d moves by σ² (PINCH_DEPTH_GAIN = 2). Spread = closer.
let pinchActive = false, pinchDist0 = 0, pinchDepth0 = 1;
const PINCH_DEPTH_GAIN = 4;
function pinchDist(e) {
  return Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY);
}
canvas.addEventListener('touchstart', e => {
  if (state.viewMode === 'vhd' && e.touches.length >= 2) {
    dragging = false; dragMode = null;     // a second finger converts the gesture: marker → shared run
    pinchActive = true;
    pinchDist0 = Math.max(1, pinchDist(e));
    { const atoms = vhdRegs(); const cur = atoms.find(a => a.key === state.curAtom) || atoms[0];
      pinchDepth0 = (state[cur.key] == null) ? cur.def : state[cur.key]; }   // current atom's value at pinch start
    e.preventDefault();
    return;
  }
  startDrag(e.touches[0].clientX, e.touches[0].clientY);
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchmove', e => {
  if (pinchActive && e.touches.length >= 2) {
    const s = Math.max(pinchDist(e) / pinchDist0, 1e-3);
    const atoms = vhdRegs();
    const cur = atoms.find(a => a.key === state.curAtom) || atoms[0];
    const sign = pinchDepth0 < 0 ? -1 : 1;
    let mag = Math.max(Math.abs(pinchDepth0), 1 / 64) * Math.pow(s, PINCH_DEPTH_GAIN);
    mag = Math.max(1 / 64, Math.min(64, mag));
    state[cur.key] = sign * mag;               // spread = grow the current value
    state.theta = Math.atan(state[cur.key]);
    _lastVhdTheta = state.theta;
    if (cur.key === 'hVal') {
      const sl = document.getElementById('sDepth');
      sl.value = Math.max(-4, Math.min(4, Math.log2(mag)));
      document.getElementById('vDepth').textContent = state.hVal.toFixed(2);
    }
    draw();
    e.preventDefault();
    return;
  }

  if (dragging) {
    updateDrag(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
}, { passive: false });
window.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinchActive = false;
  endDrag();
});

// v/d·h/d view: the wheel is depth — up brings the aim closer (d shrinks, the
// readings run out the ray toward the horizon), down pushes it deeper (d grows,
// everything collapses toward home). Kept in sync with the menu slider.
canvas.addEventListener('wheel', e => {
  if (['vhd', 'sphere', 'fold', 'bridge', 'torus', 'scope', 'bouquet', 's3', 'aperture', 'seq', 'num', 'stance', 'sky', 'radar', 'trit', 'wigner'].indexOf(state.viewMode) < 0) return;
  e.preventDefault();
  // The wheel scales the CURRENT atom's value multiplicatively; the number
  // line follows, since the line always shows the current atom.
  // (On the sphere the current register is always h — the aperture.)
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  const gain = e.ctrlKey ? 0.04 : 0.006;
  const atoms = vhdRegs();
  const cur = (state.viewMode !== 'vhd') ? { key: 'hVal', def: 1.2 }
            : (atoms.find(a => a.key === state.curAtom) || atoms[0]);
  if (state.viewMode === 'vhd' && cur.key !== 'hVal') state.vhdPlay = false;
  const v = (state[cur.key] == null) ? cur.def : state[cur.key];
  const sign = v < 0 ? -1 : 1;
  let mag = Math.max(Math.abs(v), 1 / 64);
  mag = Math.max(1 / 64, Math.min(64, mag * Math.pow(2, dy * gain)));
  state[cur.key] = sign * mag;
  state.theta = Math.atan(state[cur.key]);
  _lastVhdTheta = state.theta;
  _lastSphTheta = state.theta;
  if (cur.key === 'hVal') {
    const s = document.getElementById('sDepth');
    s.value = Math.max(-4, Math.min(4, Math.log2(mag)));
    document.getElementById('vDepth').textContent = state.hVal.toFixed(2);
  }
  draw();
}, { passive: false });

// Home button: return the focal to θ = 0 (the centre/origin).
document.getElementById('homeButton').addEventListener('click', () => {
  stopInertia();
  state.theta = 0;
  draw();
});

// Menu toggle
document.getElementById('menuToggle').addEventListener('click', () => {
  const m = document.getElementById('menu');
  m.style.display = (m.style.display === 'none') ? 'block' : 'none';
});

// Leaves slider: number of leaf samples N
document.getElementById('sLeaves').addEventListener('input', (e) => {
  state.N = +e.target.value;
  document.getElementById('vLeaves').textContent = state.N;
  draw();
});

// Bottom-view selector
function syncViewBtns() {
  document.querySelectorAll('#viewBtns .vbtn').forEach(b => {
    const on = b.dataset.view === state.viewMode;
    b.style.borderColor = on ? 'rgba(127,176,105,0.8)' : 'rgba(255,255,255,0.18)';
    b.style.color = on ? '#7fb069' : 'rgba(255,255,255,0.8)';
  });
  if (typeof refreshCurveUI === 'function') refreshCurveUI();   // swap the curve/wave dropdown to match the panel
}
document.querySelectorAll('#viewBtns .vbtn').forEach(b => {
  b.addEventListener('click', () => {
    state.viewMode = b.dataset.view;
    // Reset the number line to 0 on every panel switch (the views below that hold
    // a register on the line override this immediately afterward).
    state.theta = 0; state.wavePan = 0; focalVelocity = 0; wavePanVelocity = 0;
    // The slope-chart variants are the same bottom with a preset TOP glyph.
    const tg = { tangent:'dome', tangentAtom:'atom', tangentDial:'dial', tangentTwoDial:'twodial' }[state.viewMode];
    if (tg) { state.topGlyph = tg; syncTopGlyphBtns(); }
    if (state.viewMode === 'vhd') {
      const val = state[state.curAtom];
      if (val != null) { state.theta = Math.atan(val); _lastVhdTheta = state.theta; }
    } else if (['sphere', 'fold', 'bridge', 'torus', 'scope', 'bouquet', 's3', 'aperture', 'seq', 'num', 'stance', 'sky', 'radar', 'trit', 'wigner'].indexOf(state.viewMode) >= 0) {
      state.theta = Math.atan((state.hVal == null) ? 1.2 : state.hVal);
      _lastSphTheta = state.theta;
    }
    syncViewBtns(); ensureVhdPlay(); draw();
  });
});

// Keyboard on the number line:
//   1 = slope (v:h atom triangle) · 2 = dome · 3 = dial · 4 = 2 dials  (the TOP)
//   BOTTOM chart: t = slope/wave · w = continuous wave · b = bridge theorem ·
//                 f = fisheye circle · c = cauchy · u = uniform circle
//   0 = reset the line to home (0)
//   ← / → = move the number line, with the same coasting physics as a drag-fling
const KEY_GLYPH = { '1': 'atom', '2': 'dome', '3': 'dial', '4': 'twodial' };
const GLYPH_SLOPE_VIEW = { atom: 'tangentAtom', dome: 'tangent', dial: 'tangentDial', twodial: 'tangentTwoDial' };
function resetNumberLine() {
  state.theta = 0; state.wavePan = 0; focalVelocity = 0; wavePanVelocity = 0; stopInertia();
}
const SLOPE_VIEWS = ['tangent', 'tangentAtom', 'tangentDial', 'tangentTwoDial'];
// The slope-chart panels now render the continuous wave on the bottom and pan it
// like the dedicated wave view: horizontal pan slides the wave (state.wavePan),
// and the wave's height under the center line drives the number-line value.
function wavePanned(v) { return v === 'wave' || v === 'bridgethm' || SLOPE_VIEWS.indexOf(v) >= 0; }

// Pan is remembered PER CHART GROUP so switching bottom charts never disturbs
// another one: the wave + slope panels share one pan; the bridge theorem has its
// own. Hopping wave → bridge → wave returns the wave exactly where you left it.
function panGroup(v) { return v === 'bridgethm' ? 'bridge' : 'wave'; }
const PAN_BY_GROUP = { wave: 0, bridge: 0 };
function switchBottom(nextView) {
  stopInertia();
  PAN_BY_GROUP[panGroup(state.viewMode)] = state.wavePan || 0;   // save the outgoing chart's pan
  state.viewMode = nextView;
  state.wavePan = PAN_BY_GROUP[panGroup(nextView)] || 0;         // restore the incoming chart's own pan
  syncViewBtns(); syncTopGlyphBtns(); ensureVhdPlay(); draw();
}
window.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;   // don't hijack text / slider controls
  // If the curve dropdown has focus, blur it so a shortcut key (w/b/t/…) switches
  // the chart instead of the browser's native <select> type-ahead silently
  // changing the selected curve. Our shortcut branches below preventDefault,
  // which cancels that type-ahead for this keystroke.
  if (tag === 'SELECT') e.target.blur();

  // Space toggles continuous auto-motion; Escape stops it.
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); toggleAutoMotion(); return; }
  if (e.key === 'Escape') { e.preventDefault(); setAutoMotion(false); return; }

  // 1–4: choose the TOP glyph ONLY — the bottom chart never changes.
  if (KEY_GLYPH[e.key]) {
    e.preventDefault();
    state.topGlyph = KEY_GLYPH[e.key];
    // On a slope bottom, keep the menu label in sync (all four are the slope
    // bottom, so this does NOT change the bottom chart).
    if (SLOPE_VIEWS.indexOf(state.viewMode) >= 0) state.viewMode = GLYPH_SLOPE_VIEW[state.topGlyph];
    syncViewBtns(); syncTopGlyphBtns(); draw();
    return;
  }
  // t/w/f/c/u: switch the BOTTOM chart ONLY, keeping the current top glyph.
  //   t = tangent slope · w = wave · f = fisheye · c = cauchy · u = uniform circle
  {
    const bottom = { t: GLYPH_SLOPE_VIEW[state.topGlyph], w: 'wave', b: 'bridgethm', f: 'vcf', c: 'cauchy', u: 'vcu' }[e.key.length === 1 ? e.key.toLowerCase() : ''];
    if (bottom) {
      e.preventDefault();
      switchBottom(bottom);
      return;
    }
  }
  if (e.key === '0') {
    e.preventDefault();
    resetNumberLine(); draw();
    return;
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && state.viewMode !== 'stance') {
    e.preventDefault();
    const dir = (e.key === 'ArrowRight') ? 1 : -1;    // → moves right along the line (value up)
    if (wavePanned(state.viewMode)) {
      wavePanVelocity = Math.max(-8, Math.min(8, wavePanVelocity - dir * 3));
      inertiaMode = 'wave';
    } else {
      focalVelocity = Math.max(-5, Math.min(5, focalVelocity + dir * 1.8));   // u/s, same chart as the drag
      inertiaMode = 'focal';
    }
    if (!inertiaActive) { inertiaActive = true; inertiaLastT = performance.now(); requestAnimationFrame(stepInertia); }
    return;
  }
});

// Top-line glyph selector: semicircle dome vs the bare v:h atom triangle
function syncTopGlyphBtns() {
  document.querySelectorAll('#topGlyphBtns .tgbtn').forEach(b => {
    const on = b.dataset.glyph === state.topGlyph;
    b.style.borderColor = on ? 'rgba(127,176,105,0.8)' : 'rgba(255,255,255,0.18)';
    b.style.color = on ? '#7fb069' : 'rgba(255,255,255,0.8)';
  });
}
document.querySelectorAll('#topGlyphBtns .tgbtn').forEach(b => {
  b.addEventListener('click', () => {
    state.topGlyph = b.dataset.glyph;
    // On a slope bottom, keep the menu label in sync (bottom unchanged).
    if (SLOPE_VIEWS.indexOf(state.viewMode) >= 0) { state.viewMode = GLYPH_SLOPE_VIEW[state.topGlyph]; syncViewBtns(); }
    syncTopGlyphBtns(); draw();
  });
});
syncTopGlyphBtns();
// ═══ STANCE: axis-pure register writes on the picked leaf. The pointer can
// only write pairs; the keyboard's axes come pre-separated — one register
// per key pair, the write the write-model names differential mode. ═══
window.addEventListener('keydown', e => {
  if (state.viewMode !== 'stance' || state.stSel < 0 || !_stV1) return;
  const k = state.stSel, step = 0.05;
  let hit = true;
  if (e.key === 'ArrowLeft') _stV1[k] -= step;
  else if (e.key === 'ArrowRight') _stV1[k] += step;
  else if (e.key === 'ArrowUp') { if (e.shiftKey) _stV3[k] += step; else _stV2[k] += step; }
  else if (e.key === 'ArrowDown') { if (e.shiftKey) _stV3[k] -= step; else _stV2[k] -= step; }
  else hit = false;
  if (hit) { e.preventDefault(); draw(); }
});

if (location.hash.length > 1) {
  const parts = location.hash.slice(1).split(':');
  const hv = parts[0];
  if (document.querySelector(`#viewBtns .vbtn[data-view="${hv}"]`)) state.viewMode = hv;
  if (parts[1]) {
    const m = { v1: 'vVal', v2: 'v2Val', h: 'hVal' }[parts[1]];
    if (m) {
      state.curAtom = m;
      if (parts[2] && isFinite(+parts[2])) state[m] = +parts[2];
      const val = state[m];
      if (val != null) state.theta = Math.atan(val);
    }
  }
}
if (['sphere', 'fold', 'bridge', 'torus', 'scope', 'bouquet', 's3', 'aperture', 'seq', 'num', 'stance', 'sky', 'radar', 'trit', 'wigner'].indexOf(state.viewMode) >= 0) {
  state.theta = Math.atan((state.hVal == null) ? 1.2 : state.hVal);
  _lastSphTheta = state.theta;
}
syncViewBtns();
ensureVhdPlay();

// Fisheye window slider
document.getElementById('sFishL').addEventListener('input', (e) => {
  state.fishL = +e.target.value;
  document.getElementById('vFishL').textContent = state.fishL;
  if (state.viewMode !== 'vcf') { state.viewMode = 'vcf'; syncViewBtns(); }
  draw();
});

// Shared-run slider (2D view): sets |h| = 2^value, sign kept from the marker
document.getElementById('sDepth').addEventListener('input', (e) => {
  const sign = (((state.hVal == null) ? 1.2 : state.hVal) < 0) ? -1 : 1;
  state.hVal = sign * Math.pow(2, +e.target.value);
  document.getElementById('vDepth').textContent = state.hVal.toFixed(2);
  if (['sphere', 'fold', 'bridge', 'torus', 'scope', 'bouquet', 's3', 'aperture', 'seq', 'num', 'stance', 'sky', 'radar', 'trit', 'wigner'].indexOf(state.viewMode) >= 0) {
    state.theta = Math.atan(state.hVal); _lastSphTheta = state.theta;
  } else {
    if (state.curAtom === 'hVal') { state.theta = Math.atan(state.hVal); _lastVhdTheta = state.theta; }
    if (state.viewMode !== 'vhd') { state.viewMode = 'vhd'; syncViewBtns(); }
  }
  draw();
});

// One unified function dropdown — the SAME list for the wave/slope panels and
// the bridge theorem (they share state.fnIdx). 'w' draws the function plainly;
// 'b' overlays its bridge reconstruction. The parameter slider shows only for
// functions that carry a parameter. (WAVE_LABELS/UNIFIED_FNS are defined up next
// to WAVE_FNS so they're initialized before any early refreshCurveUI() call.)
function curveUIContext() {
  if (state.viewMode === 'bridgethm') return 'bridge';
  if (state.viewMode === 'wave' || SLOPE_VIEWS.indexOf(state.viewMode) >= 0) return 'wave';
  return null;
}
function refreshCurveUI() {
  const ctl = document.getElementById('curveCtl');
  const sel = document.getElementById('sCurveWave');
  const lab = document.getElementById('curveLabel');
  const pw  = document.getElementById('paramWrap');
  const pv  = document.getElementById('vParam');
  if (!sel || !ctl) return;
  const ctx = curveUIContext();
  if (!ctx) { ctl.style.display = 'none'; return; }   // panel has no function — hide it
  ctl.style.display = '';
  lab.textContent = 'function'; lab.style.color = '#f2b45f';
  // rebuild only when the option set changed (keeps the open dropdown stable)
  if (sel.options.length !== UNIFIED_FNS.length) {
    sel.innerHTML = '';
    let grp = null, host = sel;
    UNIFIED_FNS.forEach((e, i) => {
      if (e.group !== grp) { grp = e.group; host = document.createElement('optgroup'); host.label = grp; sel.appendChild(host); }
      const o = document.createElement('option');
      o.value = i; o.textContent = e.label; host.appendChild(o);
    });
  }
  sel.value = String(state.fnIdx);
  // parameter slider — only for functions that carry one
  const p = currentFn().param;
  if (pw) pw.style.display = p ? '' : 'none';
  if (p && pv) pv.textContent = (p.fmt ? p.fmt(currentParamVal()) : currentParamVal().toFixed(2));
}
document.getElementById('sCurveWave').addEventListener('change', e => {
  state.fnIdx = +e.target.value;                 // ONE selection, shared by wave + bridge
  refreshCurveUI();                              // show/hide the parameter slider for the new function
  // Hand focus back to the page so the next w/b/t/… keystroke switches charts
  // instead of being eaten by the select's native type-ahead (which would jump
  // the option and look like the selection "switching" on its own).
  e.target.blur();
  draw();
});
{
  const par = document.getElementById('sParam'), parV = document.getElementById('vParam');
  if (par) par.addEventListener('input', e => {
    state.paramT = +e.target.value;
    const p = currentFn().param;
    if (parV) parV.textContent = p && p.fmt ? p.fmt(currentParamVal()) : (+e.target.value).toFixed(2);
    draw();
  });
}

document.getElementById('sAuto').addEventListener('click', () => { toggleAutoMotion(); });
syncAutoBtn();
refreshCurveUI();
resize();
