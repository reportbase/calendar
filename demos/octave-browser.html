<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octave Browser</title>
<!-- THE OCTAVE BROWSER. A reader browsing time back from now, the way Serial, Parallel and Nowhere says a
     situated reader holds a reading (§3.3, §3.5, R167, Proposition 3.8), with every octal built alike.

     EVERY OCTAL HAS A FRONT AND A BACK, SPLIT BY ITS CORNER. The reader's own octal is R167's: one octave,
     two facings, ½h to 2h, the corner h in the middle; before it v in terms of h (the front), past it h in
     terms of v (the back). Every octal is built the same way round its own corner c: ½c to c the front,
     c to 2c the back. Laid end to end they meet at their edges: octal +1 is 2h to 8h round 4h, octal −1
     is ⅛h to ½h round ¼h, so each is two doublings wide and the corners go 4× apart. Inside each half the
     reading is plain proportion of the share (v/c in front, c/v behind), t = 2·share − 1, 0 at the octal's
     edge and 1 at its corner.

     THE LADDER. The home octal is drawn widest; each octal out is half as wide as the one inside it,
     halvings toward home (now) on the left, doublings toward the horizon (the far past) on the right.

     LEAVE THE HOME OCTAL AND IT CARRIES. Take the reading out of the home octal and the view slides one
     octal: h goes ×4 or ÷4 and the octal entered becomes home, proportional again. Hold the hand past
     the edge and it keeps carrying. Nothing at any rung is special (Proposition 3.7): every home octal
     looks the same; only the labels change.

     Hands: drag the ruler (or the marker) to place the reading · wheel or ← → step it · Home: the corner. -->
<style>
  :root{--bg:#0b0d12;--panel:#12151c;--line:#2b2e36;--gold:#e8c86a;--teal:#1D9E75;--blue:#6aa8e8;--ink:#c9c7be;--hi:#f1efe6;--dim:#8a909b;
        --mono:"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:ew-resize}
</style>
</head>
<body>
<canvas id="cv" aria-label="The octave browser. Drag to place the reading; leaving the home octal carries the view one octal."></canvas>
<script>
const GOLD = '#e8c86a', TEAL = '#1D9E75', BLUE = '#6aa8e8', INK = '#c9c7be', HI = '#f1efe6', DIM = '#8a909b', BG = '#0b0d12', LINE = '#2b2e36';
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const VMIN = 0.25, VMAX = 100 * 365.25 * 864e2;                   // a quarter second to a century, in seconds
let R = 0.5;                                                     // each octal out is half as wide as the one inside it (0.4 on a phone)
const T_NOW = Date.now();

// ── THE STATE: the reading v, and the rung m (h = 2^m seconds); mu is the drawn rung, sliding to m ─────
let v = 864e2, m = 2 * Math.round(Math.log2(v) / 2), mu = m, last = 0, dragging = false;   // m even: corners 4× apart
const carryTarget = () => {                                      // the octal the reading is in becomes home: h ×4 or ÷4
  const s = v / 2 ** m; if (s >= 2) m += 2; else if (s < 0.5) m -= 2; };

// ── THE READING: (octal n, side, share t) round the octal's own corner c = 4^n (in units of h) ─────────
function readingOf(sv){
  const n = Math.floor((Math.log2(sv) + 1) / 2), c = 4 ** n;
  if (Math.abs(sv / c - 1) < 1e-12) return { n, c, side: 'corner', t: 1, share: 1 };
  const front = sv < c, share = front ? sv / c : c / sv;
  return { n, c, side: front ? 'front' : 'back', share, t: 2 * share - 1 };
}
// ── THE LADDER LAID ON THE SCREEN. Octal 0 has halves of width w0 either side of the main corner;
// octal j ≥ 1 is 2·w0·R^j wide, starting at start(j) from the main corner. Its inner half (nearer the
// main corner) runs from its edge to its own corner, its outer half from its corner to its far edge. ──
let W = 0, H = 0, D = 0, cx = 0, y0 = 0, w0 = 100;
const start = j => j === 0 ? -w0 : w0 + 2 * w0 * R * (1 - R ** (j - 1)) / (1 - R);
const side = () => w0 * (1 + 2 * R / (1 - R));
const half = j => j === 0 ? w0 : w0 * R ** j;
function xOf(val, hd){
  const r = readingOf(val / hd), j = Math.abs(r.n);
  const sideSign = r.n > 0 || (r.n === 0 && r.side !== 'front') ? 1 : -1;
  const inner = j > 0 && ((r.n > 0) === (r.side === 'front'));   // right: front is inner; left: back is inner
  const off = inner ? start(j) + half(j) * r.t : start(j) + half(j) + half(j) * (1 - r.t);
  return cx + sideSign * off;
}
function valOf(x, hd){
  const right = x >= cx, off = Math.abs(x - cx);
  if (off < w0) { const t = 1 - off / w0; return hd * (right ? 2 / (t + 1) : (t + 1) / 2); }
  let j = 1; while (start(j + 1) <= off && j < 40) j++;
  const n = right ? j : -j, c = 4 ** n, loc = off - start(j), hw = half(j);
  const inner = loc < hw, t = clamp(inner ? loc / hw : 1 - (loc - hw) / hw, 0, 1);
  const front = right ? inner : !inner;
  return hd * c * (front ? (t + 1) / 2 : 2 / (t + 1));
}

// ── WORDS FOR DURATIONS AND DATES ────────────────────────────────────────────────────────────────────
const UNITS = [[365.25 * 864e2, 'year'], [30.4375 * 864e2, 'month'], [7 * 864e2, 'week'], [864e2, 'day'], [36e2, 'hour'], [60, 'minute'], [1, 'second']];
function dur(sec, short){
  for (const [u, n] of UNITS) if (sec >= u * 0.999) { const x = sec / u, t = x < 10 ? x.toFixed(1).replace(/\.0$/, '') : String(Math.round(x));
    return t + (short ? ' ' + n[0] + (n === 'month' ? 'o' : n === 'minute' ? 'in' : '') : ' ' + n + (t === '1' ? '' : 's')); }
  return (sec * 1000).toPrecision(2) + (short ? ' ms' : ' milliseconds');
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], p2 = n => String(n).padStart(2, '0');
function when(sec){ const d = new Date(T_NOW - sec * 1000);
  return WD[d.getDay()] + ' ' + p2(d.getDate()) + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear() + ', ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }

// ── DRAWING: only when something moved ───────────────────────────────────────────────────────────────
const cv = document.getElementById('cv'), vis = cv.getContext('2d'), back = document.createElement('canvas'), ctx = back.getContext('2d');
let lastKey = '', force = true;
function draw(){
  const w = Math.round(cv.clientWidth), h = Math.round(cv.clientHeight), d = Math.min(2, devicePixelRatio || 1);
  if (!w || !h) return;
  if (Math.abs(w - W) > 1 || Math.abs(h - H) > 1 || d !== D) { W = w; H = h; D = d; cv.width = back.width = W * D; cv.height = back.height = H * D; force = true; }
  const key = [v.toPrecision(9), mu.toFixed(5), m].join();
  if (key === lastKey && !force) return; lastKey = key; force = false;
  cx = W / 2; y0 = H * 0.46; R = W < 700 ? 0.4 : 0.5; w0 = Math.min(W * 0.47, 780) / (1 + 2 * R / (1 - R));   // a side: the home octal's half w0, then the octals beyond
  const hd = 2 ** mu;
  ctx.setTransform(D, 0, 0, D, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // the home octal, shaded: proportional ground
  const xa = xOf(hd / 2, hd), xb = xOf(hd * 2, hd);
  ctx.fillStyle = 'rgba(232,200,106,.07)'; ctx.fillRect(xa, y0 - 46, xb - xa, 92);
  ctx.strokeStyle = 'rgba(201,199,190,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - side() - 8, y0); ctx.lineTo(cx + side() + 8, y0); ctx.stroke();
  // every octal: its two edges, its own corner in the middle, and equal steps of the share in each half
  ctx.font = '11px ' + MONO;
  for (const side of [-1, 1]) for (let j = 0; j < 40; j++) {
    const n = side * j, hw = half(j); if (j > 0 && hw < 1.5) break;
    if (j === 0 && side < 0) continue;                           // octal 0 drawn once
    const c = hd * 4 ** n, xc = xOf(c, hd), outer = c * (n < 0 ? 0.5 : 2), xo = xOf(outer, hd);
    const sub = hw > 120 ? 8 : hw > 50 ? 4 : hw > 18 ? 2 : 1;
    ctx.strokeStyle = 'rgba(201,199,190,.32)'; ctx.lineWidth = 1;
    for (const f of [true, false]) for (let i = 1; i < sub; i++) {   // the share inside each half, in equal steps
      const t = i / sub, share = (t + 1) / 2, xs = xOf(c * (f ? share : 1 / share), hd);
      ctx.beginPath(); ctx.moveTo(xs, y0 - 5); ctx.lineTo(xs, y0 + 5); ctx.stroke(); }
    if (j > 0) {                                                 // the octal's own corner: its front and back meet here
      ctx.strokeStyle = n < 0 ? 'rgba(29,158,117,.9)' : 'rgba(232,200,106,.8)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(xc, y0 - 12); ctx.lineTo(xc, y0 + 12); ctx.stroke();
      if (hw > 30) { ctx.fillStyle = n < 0 ? TEAL : GOLD; ctx.fillText(dur(c, true), xc, y0 - 18); }
    }
    ctx.strokeStyle = 'rgba(201,199,190,.6)'; ctx.lineWidth = 1;   // the octal's outer edge, where the next one starts
    ctx.beginPath(); ctx.moveTo(xo, y0 - 16); ctx.lineTo(xo, y0 + 16); ctx.stroke();
    if (j === 0) { const xi = xOf(c / 2, hd); ctx.beginPath(); ctx.moveTo(xi, y0 - 16); ctx.lineTo(xi, y0 + 16); ctx.stroke(); }
    if (hw > 36 || j === 0) { ctx.fillStyle = DIM; ctx.fillText(dur(outer, true), xo, y0 + 30);
      if (j === 0) ctx.fillText(dur(c / 2, true), xOf(c / 2, hd), y0 + 30); }
  }
  // the corner, h
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx, y0 - 22); ctx.lineTo(cx, y0 + 22); ctx.stroke();
  ctx.fillStyle = GOLD; ctx.font = '12px ' + MONO; ctx.fillText('h = ' + dur(hd), cx, y0 + 46);   // below the ruler, clear of the reading
  ctx.fillStyle = DIM; ctx.font = '11px ' + MONO;
  const narrow = W < 700;                                        // a phone: the ends on one row, the facings on the next
  ctx.textAlign = 'left'; ctx.fillText(narrow ? '◀ now' : '◀ home: now', cx - side() - 8, y0 - (narrow ? 74 : 56));
  ctx.textAlign = 'right'; ctx.fillText(narrow ? 'far past ▶' : 'the horizon: the far past ▶', cx + side() + 8, y0 - (narrow ? 74 : 56));
  ctx.textAlign = 'center'; ctx.fillText(narrow ? 'front' : 'front: v in terms of h', (xa + cx) / 2, y0 - 56); ctx.fillText(narrow ? 'back' : 'back: h in terms of v', (xb + cx) / 2, y0 - 56);
  // the reading
  const xv = xOf(v, hd), rd = readingOf(v / hd), col = rd.side === 'front' ? TEAL : rd.side === 'back' ? GOLD : HI;
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(xv, y0 - 34); ctx.lineTo(xv, y0 + 24); ctx.stroke();
  ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(xv, y0, 6, 0, 2 * Math.PI); ctx.fill();
  // the payload, and the reading in the paper's form
  const ty = Math.min(H - 90, y0 + 104);
  ctx.textAlign = 'center'; ctx.fillStyle = HI; ctx.font = '22px ' + MONO; ctx.fillText(dur(v) + ' ago', cx, ty);
  ctx.fillStyle = BLUE; ctx.font = '15px ' + MONO; ctx.fillText(when(v), cx, ty + 26);
  ctx.font = '13px ' + MONO; ctx.fillStyle = col;
  const nTxt = 'octal ' + (rd.n > 0 ? '+' : rd.n < 0 ? '−' : '') + Math.abs(rd.n);
  ctx.fillText(rd.side === 'corner' ? nTxt + ' · its corner · share 1' : nTxt + ' · ' + rd.side + ' · t ' + rd.t.toFixed(2) + ' · share ' + rd.share.toFixed(3), cx, ty + 50);
  ctx.fillStyle = DIM; ctx.font = '11px ' + MONO;
  const foot = ['h = 2^' + m + ' s · corners 4× apart', 'leave the shaded octal and the view carries one octal'];
  if (ctx.measureText(foot.join(' · ')).width < W - 24) ctx.fillText(foot.join(' · '), cx, ty + 72);
  else { ctx.fillText(foot[0], cx, ty + 72); ctx.fillText(foot[1], cx, ty + 88); }
  vis.globalCompositeOperation = 'copy'; vis.drawImage(back, 0, 0);
}
function step(now){
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  if (dragging && grabX !== null) v = clamp(valOf(grabX, 2 ** mu), VMIN, VMAX);   // a hand held past the edge keeps carrying
  carryTarget();
  mu += (m - mu) * (1 - Math.exp(-dt / 0.35));                     // the slide: a held hand carries an octal or two a second
  if (Math.abs(m - mu) < 1e-4) mu = m;
  draw(); requestAnimationFrame(step);
}

// ── HANDS ────────────────────────────────────────────────────────────────────────────────────────────
let grabX = null;
const local = e => e.clientX - cv.getBoundingClientRect().left;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); dragging = true; grabX = local(e); });
cv.addEventListener('pointermove', e => { if (dragging) grabX = local(e); });
const up = () => { dragging = false; grabX = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { const f = e.deltaMode === 1 ? 16 : 1, dd = (e.deltaX || e.deltaY) * f;
  v = clamp(v * 2 ** (dd / 800), VMIN, VMAX); e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { v = clamp(v * 2 ** ((e.key === 'ArrowRight' ? 1 : -1) / 16), VMIN, VMAX); e.preventDefault(); }
  if (e.key === 'Home') { v = 2 ** m; e.preventDefault(); }
});
addEventListener('resize', () => { force = true; });
requestAnimationFrame(step);
</script>
</body>
</html>
