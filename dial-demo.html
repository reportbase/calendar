<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The dial, reused</title>
<!-- THE DIAL, REUSED (7 Nov 2026; Tom: "move the dial into a javacript class so that it an be reused."). The whole page is
     dial.js's Dial.mount over a list of 2^53 − 1 numbered records: no figure, no readout, only what a page reusing the
     dial has to write itself, a count and how to show a record. Press and drag sideways to move, wheel or pinch for the
     window, ← → ↑ ↓ and h on the keys. -->
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;overscroll-behavior:none;touch-action:none;
            user-select:none;-webkit-user-select:none;--mono:"SF Mono",Menlo,Consolas,monospace}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
</style>
</head>
<body>
<canvas id="cv" aria-label="A navigation dial over 2^53 − 1 records"></canvas>
<script src="dial.js"></script>
<script>
// a record as its digits in groups of three, each group coloured by the step it names (1, 1000, 1000², …)
function digits(i){
  const s = String(Math.round(i)), parts = [];
  for (let e = 0, end = s.length; end > 0; e += 3, end -= 3) parts.unshift([s.slice(Math.max(0, end - 3), end) + (e ? ',' : ''), 1000 ** e]);
  return [parts, [['record of ' + Number.MAX_SAFE_INTEGER.toLocaleString('en'), Infinity]]];
}
window.__dial = Dial.mount(document.getElementById('cv'), { count: Number.MAX_SAFE_INTEGER, index: 2 ** 52, reach: 0.4, label: digits, fonts: [19, 12] });
</script>
</body>
</html>
