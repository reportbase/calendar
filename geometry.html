<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The dial's geometry</title>
<!-- THE DIAL AND ITS FIGURE, SIDE BY SIDE. The dial is the navigation dial of city-dial.html (gold
     needle pushes, blue needle points, the radius sets the window) on dial.html's list, a century of
     milliseconds. Beside it, drawn from the same state, is the figure the dial is made of: a centre O,
     a unit circle, the tangent line at its apex A, and the unit hyperbola that touches the same line.

       P  the blue needle's tip on the circle, at angle θ from the apex       (cos θ, sin θ)
       T  where the needle's line meets the tangent: tan θ, the VALUE        (1, tan θ)
       H  the hyperbola point level with T: ζ is what the gold has pushed    (cosh ζ, sinh ζ)
       S  where the line O–H meets the tangent, level with P                 (1, tanh ζ)

     so sin θ = tanh ζ and tan θ = sinh ζ: θ = gd(ζ), the gudermannian. The shaded sectors are the two
     angles as areas — an angle is twice its sector's area, on the circle (θ) and the hyperbola (ζ) alike.

     g IS THE SWEEP (Serial, Parallel and Nowhere §3.5, R170). The needle's angle from the apex is the
     sweep, and g is that angle as a share of the quarter turn: g = θ ÷ 90° = (2/π)·gd(ζ). g = 0 is home,
     the apex, all h and no v, no breadth expressed; g = ½ is the corner, v = h, the 45° unit; g = 1 is the
     horizon, the breadth fully expressed. The reading is s = v/h = tan θ, which T marks. The flip s ↦ 1/s
     is g ↦ 1 − g, the mirror in the 45° line (P′). The octaves run both ways from the corner, doublings
     past it and halvings before it, and both are marked. g = 0 IS THE UNIT CIRCLE AND g = 1 THE SHAPE
     FULLY EXPRESSED: at turn t the circle's point P = (cos t, sin t) carries the shape's point
     Q = (cos t, b·sin t), v's breadth expressed by sin t, nothing at g = 0 and all of it at g = 1
     (Kepler's auxiliary circle). The ray to Q reads b·tan t, the circle's reading slid log₂ b octaves,
     which on the dial is a move of the radius. On this dial h runs up the axis and v runs sideways; the
     paper draws h across and v up.

     VOCABULARY (GEOMETRY.md): geometry names first, other fields' names in brackets. θ is the circular
     angle [latitude; the angle whose sine is v/c]. ζ is the hyperbolic angle [rapidity; Mercator height].
     tan θ = sinh ζ is the tangent [proper velocity; gnomonic distance]. The horizon is θ = 90°
     [speed of light; the pole; the vanishing point]. The radius is a logarithm of scale [exponent].

     HANDS. On the dial: pan away from the hub and the gold needle's angle adds ζ at tan(gold) · 0.4 a
     second; letting go springs the gold home and rests the window on the record reached. Wheel or
     pinch: the radius. On the figure: drag P, T, H or S and everything follows; the blue stays where
     the figure leaves it. Wheel over the figure zooms the figure only.
     Keys: ← → push the gold at 45° · ↑ ↓ radius · h blue home · t today · n readout · [ ] the shape's b. -->
<style>
  :root{--bg:#0b0d12;--panel:#12151c;--gold:#e8c86a;--teal:#1D9E75;--blue:#6aa8e8;--ink:#c9c7be;--dim:#7f8590;
        --mono:"SF Mono",Menlo,Consolas,monospace}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
            overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  /* THE READOUT IS A PANEL THAT OPENS AND CLOSES, closed to begin with: the button in the corner
     opens it; a tap anywhere on it, its ✕, Escape or 'n' closes it, and the dial takes back the room it used. */
  #nums{position:fixed;z-index:2;padding:10px 12px;background:rgba(18,21,28,.92);border:0.5px solid rgba(232,200,106,.28);
        border-radius:10px;font:12px/1.5 var(--mono);box-shadow:0 12px 32px rgba(0,0,0,.45);
        max-height:calc(100% - 28px);box-sizing:border-box;overflow:auto;touch-action:pan-y;overscroll-behavior:contain}
  #nums[hidden], #numsBtn[hidden]{display:none}
  #numsBody{display:grid;grid-template-columns:auto auto 1fr;column-gap:12px}
  #numsHead{position:sticky;top:-10px;display:flex;justify-content:space-between;align-items:center;gap:12px;
        margin:-10px -12px 6px;padding:8px 8px 8px 12px;background:var(--panel);border-bottom:0.5px solid rgba(232,200,106,.18);
        color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
  #numsClose, #numsBtn{font:12px/1 var(--mono);color:var(--dim);background:var(--panel);cursor:pointer;
        border:0.5px solid rgba(232,200,106,.28);border-radius:6px}
  #numsClose{padding:7px 10px;color:var(--ink);text-transform:none;letter-spacing:0}
  #nums{cursor:pointer}
  #numsBtn{position:fixed;z-index:2;padding:7px 10px;letter-spacing:.08em}
  #numsClose:hover, #numsBtn:hover{color:var(--ink);border-color:var(--gold)}
  #numsClose:focus-visible, #numsBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #nums .k{color:var(--gold);white-space:nowrap} #nums .v{color:#f1efe6;text-align:right;white-space:nowrap}
  #nums .o{color:var(--dim)} #nums .hd{grid-column:1/-1;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px;margin-top:4px}
  #nums .hd:first-child{margin-top:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="numsBtn" type="button" aria-expanded="false" aria-controls="nums">readout</button>
<div id="nums" hidden><div id="numsHead"><span>readout</span><button id="numsClose" type="button" aria-label="Close the readout">close ✕</button></div><div id="numsBody"></div></div>
<script src="dial-core.js"></script>
<script>
const PI = Math.PI, K = 5;                                                      // the window's end: the K-th corner, tan θ = 2^K
const T0 = Date.UTC(2000, 0, 1), N = 3155760000000;                              // the list: a century of milliseconds
const { BG, GOLD, TEAL, BLUE, INK } = Dial.COLORS, DIM = '#7f8590', SHAPE = '#e0876a', clamp = Dial.clamp;

// ── THE STATE: the shared dial (dial-core.js) — a record, a window round it, and ζ between them ──
const dial = Dial.create({ N, K, index: Date.now() - T0, reach: 0.45 });
let figZoom = 1;
let b = 2;                                                     // the shape's breadth ratio: v breadth over h breadth
const theta = () => dial.theta(), sweepG = () => dial.sweep();
const shareOf = s => s <= 1 ? s : 1 / s;                       // the smaller part over the larger: v/h before the corner, h/v past it
function octaveOf(share){                                      // the share as (count of octaves from the corner, share t within one)
  if (share <= 0) return null;
  const x = -Math.log2(share), k = x <= 0 ? 0 : Math.ceil(x) - 1;
  return [k, 2 ** (k + 1) * share - 1];
}

// ── LAYOUT: the dial and the figure share the screen ─────────────────────────────────────────────
const cv = document.getElementById('cv'), surf = Dial.surface(cv, render), ctx = surf.ctx;   // drawn only when something moved
const nums = document.getElementById('nums'), numsBody = document.getElementById('numsBody'), numsBtn = document.getElementById('numsBtn');
let W = 0, H = 0, Lay = null;
function setNums(on){                                         // open or close the readout; the dial re-lays itself either way
  nums.hidden = !on; numsBtn.hidden = on; numsBtn.setAttribute('aria-expanded', String(on));
  updateNums(); surf.invalidate();
}
numsBtn.addEventListener('click', () => setNums(true));
nums.addEventListener('click', () => setNums(false));                   // a tap anywhere on the panel closes it, the ✕ included
addEventListener('keydown', e => { if (e.key === 'Escape' && !nums.hidden) setNums(false); });
function layout(){
  const land = W >= H * 1.05;
  const disc = land ? { x: 0, y: 0, w: W / 2, h: H } : { x: 0, y: H * 0.5, w: W, h: H * 0.5 };
  const fig  = land ? { x: W / 2, y: 0, w: W / 2, h: H } : { x: 0, y: 0, w: W, h: H * 0.5 };
  // the button sits in the dial's corner; the open panel takes the top of the screen, never more than
  // the screen, and scrolls inside itself when it is longer. Only beside the dial does it push the dial down.
  nums.style.left = numsBtn.style.left = (disc.x + 14) + 'px'; numsBtn.style.top = (disc.y + 14) + 'px';
  nums.style.top = '14px'; nums.style.maxWidth = Math.max(200, (land ? disc.w : W) - 28) + 'px';
  const top = (land && !nums.hidden) ? nums.offsetHeight + 40 : 40;
  disc.cx = disc.x + disc.w / 2; disc.cy = disc.y + disc.h - 104;
  disc.R = Math.max(40, Math.min(disc.w * 0.44, disc.cy - disc.y - top));
  fig.ox = fig.x + fig.w / 2; fig.oy = fig.y + fig.h - 46;
  fig.L = Math.max(10, Math.min(fig.w / 3.4, (fig.h - 90) / 3.2)) * figZoom;
  Lay = { dial: disc, fig };
}
const inBox = (b, x, y) => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h;

// ── THE READOUT: the record's fields, coloured by what this radius reaches ───────────────────────
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = (v, n) => String(v).padStart(n, '0');
function fields(i){ const d = new Date(T0 + Math.round(i));
  return [[[pad(d.getUTCDate(), 2) + ' ', 864e5], [MON[d.getUTCMonth()] + ' ', 26298e5], [String(d.getUTCFullYear()), 315576e5]],
          [[pad(d.getUTCHours(), 2) + ':', 36e5], [pad(d.getUTCMinutes(), 2) + ':', 6e4],
           [pad(d.getUTCSeconds(), 2) + '.', 1e3], [pad(d.getUTCMilliseconds(), 3), 1]]]; }
const band = mag => { const s = dial.span(); return mag <= dial.unit(s) ? TEAL : mag <= s / 2 ? BLUE : GOLD; };   // within a unit · within the window · out of reach
function fmtDur(ms){
  if (ms < 1) return ms.toPrecision(2) + ' ms';
  for (const [u, n] of [[315576e5, 'y'], [864e5, 'd'], [36e5, 'h'], [6e4, 'min'], [1e3, 's'], [1, 'ms']])
    if (ms >= u) { const v = ms / u; return v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2) + ' ' + n; }
}
function line(parts, cx, y){
  const w = parts.reduce((t, [s]) => t + ctx.measureText(s).width, 0); let x = cx - w / 2;
  for (const [s, mag] of parts) { ctx.fillStyle = band(mag); ctx.fillText(s, x, y); x += ctx.measureText(s).width; }
}

// ── THE DIAL ─────────────────────────────────────────────────────────────────────────────────────
function drawDial(g){
  const { cx, cy, R } = Lay.dial;
  Dial.drawRim(ctx, dial, { cx, cy, R, ring: Math.max(8, R * dial.reach) });   // the ring sits where the radius is
  Dial.drawNeedles(ctx, dial, { cx, cy, R, gold: g, drop: true });
  const [date, time] = fields(dial.index), s = dial.span(), mono = getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '19px ' + mono; line(date, cx, cy + 30);
  ctx.font = '15px ' + mono; line(time, cx, cy + 52);
  ctx.font = '12px ' + mono; ctx.fillStyle = DIM; ctx.textAlign = 'center';
  Dial.drawReading(ctx, dial, { cx, y: cy + 74, font: mono });                // the reading: side · octave · t · g
  ctx.font = '12px ' + mono; ctx.fillStyle = DIM;                              // the rung: which h counts as one (pinch, wheel, ↑ ↓)
  const rung = 'h = ' + fmtDur(dial.unit(s)) + ', the corner · window ' + fmtDur(s), tip = ' · pinch slides the rung';
  ctx.fillText(ctx.measureText(rung + tip).width < Lay.dial.w - 16 ? rung + tip : rung, cx, cy + 92);   // the hint only where it fits
}

// ── THE FIGURE: centre, circle, tangent, hyperbola — the dial's own geometry ──────────────────────
const fp = (u, v) => [Lay.fig.ox + Lay.fig.L * v, Lay.fig.oy - Lay.fig.L * u];   // (u along the axis, v sideways) → screen
function handles(){ const th = theta(), z = dial.zeta;
  return { P: fp(Math.cos(th), Math.sin(th)), T: fp(1, Math.tan(th)), H: fp(Math.cosh(z), Math.sinh(z)), S: fp(1, Math.tanh(z)) }; }
function drawFigure(){
  const f = Lay.fig, s = f.L, th = theta(), z = dial.zeta, [ox, oy] = [f.ox, f.oy], mono = getComputedStyle(document.body).getPropertyValue('--mono');
  ctx.save(); ctx.beginPath(); ctx.rect(f.x, f.y, f.w, f.h); ctx.clip();
  // THE TWO ANGLES AS AREAS: θ is twice the circular sector O-A-P, ζ twice the hyperbolic sector O-A-H
  ctx.fillStyle = 'rgba(106,168,232,.16)'; ctx.beginPath(); ctx.moveTo(ox, oy);
  ctx.arc(ox, oy, s, -PI / 2, -PI / 2 + th, th < 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(29,158,117,.16)'; ctx.beginPath(); ctx.moveTo(ox, oy);
  for (let i = 0; i <= 80; i++) { const t = z * i / 80; ctx.lineTo(...fp(Math.cosh(t), Math.sinh(t))); }
  ctx.closePath(); ctx.fill();
  ctx.lineCap = 'round';
  ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(127,133,144,.6)'; ctx.lineWidth = 1;   // the axis, through the apex
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, f.y); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(232,200,106,.55)'; ctx.lineWidth = 1.5;               // the tangent line at the apex
  ctx.beginPath(); ctx.moveTo(f.x, oy - s); ctx.lineTo(f.x + f.w, oy - s); ctx.stroke();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(ox, oy, s, -PI, 0); ctx.stroke();   // the circle: addresses, no breadth expressed
  ctx.setLineDash([2, 6]); ctx.strokeStyle = 'rgba(232,200,106,.45)'; ctx.lineWidth = 1;   // the corner, v = h, both sides
  ctx.beginPath(); ctx.moveTo(...fp(2.2, -2.2)); ctx.lineTo(ox, oy); ctx.lineTo(...fp(2.2, 2.2)); ctx.stroke(); ctx.setLineDash([]);
  // g = 0 IS THE UNIT CIRCLE, g = 1 THE SHAPE FULLY EXPRESSED. The sweep carries the circle into the
  // shape: at turn t the circle's point is P = (cos t, sin t) and the shape's is Q = (cos t, b·sin t),
  // P with v's breadth expressed. At g = 0 they coincide at A; at g = 1, Q = (0, b). The gap between
  // them is (b − 1)·sin t, the bar's own vertical part, so the sweep alone sets how much is expressed.
  // (Kepler's auxiliary circle, t the eccentric anomaly.) The path Q has traced is the shape so far.
  if (th) {
    const sg = th < 0 ? -1 : 1, a = Math.abs(th), Q = t => fp(Math.cos(t), sg * b * Math.sin(t));
    ctx.beginPath(); ctx.moveTo(ox, oy);
    for (let i = 0; i <= 90; i++) ctx.lineTo(...Q(a * i / 90));
    ctx.closePath(); ctx.fillStyle = 'rgba(224,135,106,.10)'; ctx.fill();
    ctx.beginPath();
    for (let i = 0; i <= 90; i++) { const [x, y] = Q(a * i / 90); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = SHAPE; ctx.lineWidth = 2.5; ctx.stroke();
  }
  const tMax = Math.asinh((f.w / 2) / s + 1);                                   // the hyperbola, as far as the figure shows
  ctx.strokeStyle = TEAL; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let i = 0; i <= 160; i++) { const t = -tMax + 2 * tMax * i / 160; const [x, y] = fp(Math.cosh(t), Math.sinh(t)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.font = '11px ' + mono; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const FR = ['', '½', '¼', '⅛'];
  for (let k = -K; k <= K; k++) for (const sg of [-1, 1]) {                    // the octave edges on the tangent: s = 2^k, both ways
    const [x, y] = fp(1, sg * 2 ** k), c = k >= 0 ? 'rgba(232,200,106,.7)' : 'rgba(29,158,117,.85)';
    ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke();
    const lab = k >= 0 ? String(2 ** k) : FR[-k];
    if (lab && (k >= 0 || s * 2 ** k > 22)) { ctx.fillStyle = c; ctx.fillText((sg < 0 ? '−' : '') + lab, x, y + 9); }
  }
  ctx.font = 'italic 14px ' + mono; ctx.fillStyle = DIM; ctx.textBaseline = 'middle';   // which way h and v run here
  ctx.textAlign = 'left'; ctx.fillText('h', ox + 8, f.y + 18); ctx.fillText('v →', f.x + f.w - 44, oy - s - 14);
  const h = handles();
  ctx.strokeStyle = BLUE; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(...h.T); ctx.stroke();   // the needle's line, O–P–T
  ctx.setLineDash([7, 6]); ctx.strokeStyle = TEAL; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(...h.H); ctx.stroke();
  ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(201,199,190,.6)'; ctx.lineWidth = 1;   // the two levels: P with S, T with H
  ctx.beginPath(); ctx.moveTo(...h.P); ctx.lineTo(...h.S); ctx.moveTo(...h.T); ctx.lineTo(...h.H); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(106,168,232,.8)'; ctx.lineWidth = 1.5;               // θ at the centre
  ctx.beginPath(); ctx.arc(ox, oy, s * 0.22, -PI / 2, -PI / 2 + th, th < 0); ctx.stroke();
  const dot = ([x, y], c, r, label, dx, dy) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill();
    if (label) { ctx.font = '600 15px ' + mono; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + dx, y + dy); } };
  const side = dial.zeta < 0 ? -1 : 1;
  if (th) {                                                     // Q, the expression P → Q, and the reading through the shape, b · tan t
    const q = fp(Math.cos(th), b * Math.sin(th)), tb = fp(1, b * Math.tan(th));
    ctx.strokeStyle = 'rgba(224,135,106,.85)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(...h.P); ctx.lineTo(...q); ctx.stroke();
    ctx.strokeStyle = 'rgba(224,135,106,.45)'; ctx.lineWidth = 1; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(...tb); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = SHAPE; ctx.beginPath(); ctx.arc(...q, 6, 0, 2 * PI); ctx.fill();
    ctx.strokeStyle = SHAPE; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(...tb, 5, 0, 2 * PI); ctx.stroke();
    ctx.font = '600 15px ' + mono; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Q', q[0] + 16 * side, q[1] - 10);
  }
  if (th) {                                                     // the flip: s ↦ 1/s, g ↦ 1 − g, the mirror in the corner line
    const tf = side * (PI / 2 - Math.abs(th)), Pf = fp(Math.cos(tf), Math.sin(tf)), Tf = fp(1, Math.tan(tf));
    ctx.strokeStyle = 'rgba(106,168,232,.5)'; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(...Tf); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = BLUE; ctx.beginPath(); ctx.arc(...Pf, 5.5, 0, 2 * PI); ctx.stroke();
    ctx.strokeStyle = GOLD; ctx.beginPath(); ctx.arc(...Tf, 5.5, 0, 2 * PI); ctx.stroke();
    ctx.font = '600 13px ' + mono; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = BLUE; ctx.fillText('P′', Pf[0] + 16 * side, Pf[1] + 4);
    ctx.fillStyle = GOLD; ctx.fillText('T′', Tf[0] + 2 * side, Tf[1] - 16);
  }
  ctx.font = '13px ' + mono; ctx.fillStyle = BLUE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';   // g beside θ's arc
  if (th) ctx.fillText('g ' + sweepG().toFixed(3), ox + side * s * 0.36, oy - s * 0.3);
  dot(fp(1, 0), GOLD, 3.5, 'A', -14 * side, -12);
  dot([ox, oy], '#f1efe6', 4, 'O', -14, 10);
  dot(h.S, TEAL, 5, 'S', -14 * side, -14);
  dot(h.P, BLUE, 6, 'P', -16 * side, 6);
  dot(h.T, GOLD, 6, 'T', 16 * side, 14);
  dot(h.H, TEAL, 6, 'H', 16 * side, -6);
  ctx.font = '12px ' + mono; ctx.fillStyle = DIM; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const hint = 'drag P, T, H or S · wheel zooms the figure · [ ] the shape’s breadth b = ' + b.toFixed(2);
  ctx.fillText(ctx.measureText(hint).width < f.w - 16 ? hint : 'drag P, T, H, S · b = ' + b.toFixed(2), ox, f.y + f.h - 12);
  ctx.restore();
}

// ── THE NUMBERS: geometry names first, other fields' names after ─────────────────────────────────
function gRows(sAbs){                                          // the paper's reading of the same state (Serial, Parallel and Nowhere §3)
  const row = (k, v, o) => '<span class="k">' + k + '</span><span class="v">' + v + '</span><span class="o">' + o + '</span>';
  const g = sweepG(), share = shareOf(sAbs), oct = octaveOf(share);
  const side = sAbs === 0 ? 'home' : Math.abs(sAbs - 1) < 1e-9 ? 'corner' : sAbs < 1 ? 'front' : 'back';
  return '<span class="hd">the sweep · [Serial, Parallel and Nowhere]</span>' +
    row('g = θ ÷ 90°', g.toFixed(4), '0 home, no breadth · ½ the corner · 1 the horizon, fully expressed') +
    row('s = v/h', sAbs.toPrecision(4), 'the reading = tan θ = T') +
    row('side', side, sAbs < 1 ? 'v in terms of h: plain proportion' : 'h in terms of v: octaves, a share in each') +
    row('share', share.toFixed(4), 'min(v,h) / max(v,h) · 1 at the corner') +
    row('octave, t', oct ? oct[0] + ', ' + oct[1].toFixed(3) : '—', 'octaves out from the corner · share within one') +
    row('flip', (1 - g).toFixed(4), 's ↦ 1/s is g ↦ 1 − g · P′, T′') +
    row('b', b.toFixed(2), 'the shape: v breadth over h · [ ] to change') +
    row('sin t', Math.abs(Math.sin(theta())).toFixed(4), 'P carried toward Q, the gap (b − 1)·sin t · the breadth met is the path Q has traced (R170: expressed is met)') +
    row('b · s', (b * sAbs).toPrecision(4), 'the reading through the shape = the radius slid ' + Math.log2(b).toFixed(2) + ' octaves');
}
function updateNums(){
  if (nums.hidden) return;
  const th = theta(), z = dial.zeta, t = Math.sinh(z), s = dial.span(), f = (x, d) => (Math.abs(x) < 5e-13 ? 0 : x).toFixed(d);
  const row = (k, v, o) => '<span class="k">' + k + '</span><span class="v">' + v + '</span><span class="o">' + o + '</span>';
  numsBody.innerHTML =
    '<span class="hd">the two angles</span>' +
    row('θ', f(th * 180 / PI, 2) + '°', 'circular angle · P · [latitude; the angle whose sine is v/c]') +
    row('ζ', f(z, 4), 'hyperbolic angle · H · [rapidity; Mercator height]') +
    '<span class="hd">their ratios, one figure</span>' +
    row('tan θ = sinh ζ', f(t, 4), 'T · the value, in units · [proper velocity; gnomonic distance]') +
    row('sin θ = tanh ζ', f(Math.tanh(z), 4), 'S · [v/c; Klein-disc radius]') +
    row('sec θ = cosh ζ', f(Math.cosh(z), 4), 'H · [Lorentz γ; Mercator stretch]') +
    row('log₂ |tan θ|', t ? f(Math.log2(Math.abs(t)), 2) : '—', 'corners passed · [octaves]') +
    gRows(Math.abs(t)) +
    '<span class="hd">the radius, a logarithm</span>' +
    row('r', f(dial.reach, 3), 'window = N^r = ' + fmtDur(s) + ' · [exponent]') +
    row('h, the unit', fmtDur(dial.unit(s)), 'the corner, one h · the rung: pinch, wheel, ↑ ↓ slide it (Prop. 3.8) · window half = 2^' + K + ' h');
}

// ── DRAWING: only when something moved (dial-core.js's surface) ─────────────────────────────────
function render(c, w, h, resized){
  W = w; H = h; updateNums(); if (resized) layout();
  c.fillStyle = BG; c.fillRect(0, 0, W, H);
  drawFigure(); drawDial(dial.liveGold(performance.now()));
}
Dial.run(dial, now => surf.draw([Math.round(dial.index), dial.zeta.toFixed(7), dial.liveGold(now).toFixed(5), dial.reach.toFixed(5),
                                 figZoom.toFixed(4), b.toFixed(4), nums.hidden].join()));

// ── HANDS: the dial's are shared; the figure's are this page's ───────────────────────────────────
function dragFigure(which, x, y){                               // each handle sets ζ by its own coordinate
  const f = Lay.fig, u = (f.oy - y) / f.L, v = (x - f.ox) / f.L;
  if (which === 'P') dial.setZeta(Math.asinh(Math.tan(clamp(Math.atan2(v, Math.max(0, u)), -dial.CAP, dial.CAP))));
  else if (which === 'S') dial.setZeta(Math.atanh(clamp(v, -Math.tanh(dial.ZMAX), Math.tanh(dial.ZMAX))));
  else dial.setZeta(Math.asinh(v));                             // T and H: the tangent, sinh ζ
}
function pick(x, y){ let best = 'P', bd = 30;
  for (const [n, [hx, hy]] of Object.entries(handles())) { const d = Math.hypot(hx - x, hy - y); if (d < bd) { bd = d; best = n; } }
  return best; }
let which = 'P';
Dial.hands(cv, dial, {
  hub: () => Lay.dial,
  claim: (x, y) => !!Lay && inBox(Lay.fig, x, y),                        // a press on the figure drags its handles
  press: (x, y) => { which = pick(x, y); dragFigure(which, x, y); },
  move: (x, y) => dragFigure(which, x, y),
  claimWheel: (x, y, e) => { if (!Lay || !inBox(Lay.fig, x, y)) return false;   // the wheel over the figure zooms the figure only
    figZoom = clamp(figZoom * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 16 : 1) * 0.0015), 0.2, 8); surf.invalidate(); return true; },
  // as city-dial: the wheel pushed away closes the radius; a trackpad pinch (ctrlKey) opens with the fingers
  wheel: { x: 1 / 2000, y: 1 / 400, pinch: 1 / 200 },
});
addEventListener('keydown', e => {
  if (e.key === 'h') dial.recentre();
  if (e.key === 't') dial.goTo(Date.now() - T0);
  if (e.key === 'n') setNums(nums.hidden);
  if (e.key === '[' || e.key === ']') b = clamp(b * 2 ** (e.key === ']' ? 0.25 : -0.25), 1 / 8, 8);
});
</script>
